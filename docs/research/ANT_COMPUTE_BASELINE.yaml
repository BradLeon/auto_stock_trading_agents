user_rules:
  status: 持仓人原表中的判读线；未纳入行动指南和监测配置
  rules:
    - {metric: 全部算力与基础设施 / 收入, bullish_at_or_below: 0.48, bearish_at_or_above: 0.55}
    - {metric: 期末现金及短投 / 未来 4 季预计付款, warn_below: 1.5}
  differences_from_action_guide:
    - 行动指南的 R1 看推理算力占比或承诺付款占收入比连续两季上升，不看绝对水平
    - 行动指南用推理算力口径，本线用全部算力
    - 行动指南没有现金覆盖类指标

