        backoff_seconds: [300, 1800]
      semantics: SEC Company Facts as immutable vintages per fetch; same complete-report-package gate as the vendor job
    macro_series_daily:
      # 2026-10-16: the Macro review used to pull these indicators itself (FRED, market closes, CNN
      # fear & greed). The scheduled run re-reads a rolling window so revisions are caught; the
      # first load (11 years) was done once with an explicit `since`.
      enabled: true
      source: macro_series_feeds
      datasets: [macro_series]
      schedule: daily
      at: "10:30"
      timezone: UTC
      command: ats data ingest --source macro_series_feeds --dataset macro_series --query-scope '{"lookback_days":120}'
      concurrency: 1
      freshness_slo_days: 4
      retry:
        attempts: 2
        backoff_seconds: [300, 1800]
      semantics: one observation per series point under US_MACRO; revisions become new vintages, never overwrites

