# SK Hynix ADR (SKHY) — PEAD config
# L5 HBM 龙头：HBM3E/HBM4 主导 AI 内存市场；NVIDIA 独家/优先供应商
# 2026-11-04 更新叙事。依据（网络检索，二手来源为主）：Q3 2026 营收 104.6 万亿韩元、营业利润 83.3 万亿韩元（利润率约 80%）；
# 预计 HBM4 在 4Q26 出货与营收双双超过 HBM3E、成为主力；M15X 年底满产；新股东回报计划（FCF 回馈比例提至 50% 以上）。

symbol: SKHY
company_name: "SK Hynix"
# fiscal_label 由财报日历派生（data/period.resolve_fiscal_label），无需手填；读档案用 data/period.label_for_reads。
#   2026-10-17：手填的季度名每季都会过期（ASML/TSM 财报已出 Q3，这里仍是 Q2），改为不写。
sector_etf: SMH
benchmark: QQQ
run_up_warn_pct: 6.0          # 高波动 ADR，阈值稍高
long_threshold: 1.3

scorecard_dims:
  - {key: hbm_revenue,    weight: 0.25, label: HBM 营收占比与 ASP 趋势}
  - {key: forward_guide,  weight: 0.20, label: 次季指引（HBM 出货 + DRAM 价格）}
  - {key: gross_margin,   weight: 0.15, label: 合并毛利率（HBM 溢价拉动）}
  - {key: hbm_share,      weight: 0.15, label: HBM3E/HBM4 市场份额维持}
  - {key: dram_pricing,   weight: 0.10, label: 传统 DRAM 价格走势}
  - {key: nvda_relation,  weight: 0.10, label: NVIDIA 独家/优先供应关系变化}
  - {key: call_tone,      weight: 0.05, label: 管理层对 HBM4 主力化、2027 长约与股东回报的表态}

signal_chain:
  - {symbol: NVDA,  role: downstream}   # 最大 HBM 客户
  - {symbol: AMD,   role: downstream}
  - {symbol: TSM,   role: peer}         # 先进封装合作（HBM on CoWoS）
  - {symbol: MU,    role: peer}         # DRAM/HBM 竞争对手
  - {symbol: ASML,  role: upstream}

narrative_seed: >
  全球 HBM（高带宽内存）市占率第一；HBM4 在 2026 年底接替 HBM3E 成为主力产品，Rubin 世代供货地位是核心；
  存储超级周期使营业利润率达到约 80% 的历史极值，传统 DRAM/NAND 涨价与企业级 SSD 也在贡献；
  当季 beat 是共识，股价更看 2027 年长约锁定、三星 HBM4 追赶与行业扩产是否导致周期见顶；
  股东回报力度提升是新变量；作为韩国股票的 ADR，汇率（韩元/美元）与政治风险是额外折价因子。
