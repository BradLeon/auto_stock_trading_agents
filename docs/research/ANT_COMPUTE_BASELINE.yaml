computed:
  derived:
    - {id: ocf_q3, value: 2.640, formula: ocf_9m26 - ocf_6m26}
    - {id: capex_ppe_q3, value: 0.443, formula: capex_ppe_9m26 - capex_ppe_6m26}
    - {id: fcf_q3, value: 2.197, formula: ocf_q3 - capex_ppe_q3, note: 与原表口径一致，未扣租赁预付款}
    - {id: short_term_compute_6m26, value: 1.5, formula: short_term_compute_9m26 - short_term_compute_q3}
    - {id: lease_prepayments_q3_at_least, value: 1.618, inferred: true,
       formula: lease_prepayments_9m26 - other_investing_6m26,
       note: 假设上半年这笔预付不超过当时的“其他投资活动”0.337；招股书没有单季数}
    - {id: fcf_q3_after_prepayments_at_most, value: 0.579, inferred: true,
       formula: fcf_q3 - lease_prepayments_q3_at_least}
    - {id: public_offering_gross, value: 79.377, inferred: true,
       formula: 956351354 * 83.00 / 1e9,
       note: 原表“募资约 790 亿”与此数吻合，应是扣费前的公开发行部分}
  indicator_readings:   # 行动指南指标在上市基线上的第一期读数
    - {indicator: 1a.a, value: 0.5817, formula: compute_q3 / revenue_q3,
       note: 全部算力与基础设施，招股书不拆推理与训练}
    - {indicator: 1a.b, value: 1.042, formula: due_next_12m / (revenue_q3 * 4)}
    - {indicator: 1b.b, value: 0.1464, formula: rpo * rpo_next_12m_share / due_next_12m}
    - {indicator: cash_coverage, value: 1.865, formula: (cash_0930 + short_term_investments_0930) / due_next_12m,
       note: 行动指南目前没有这一项}
    - {indicator: cash_coverage_pro_forma, value: 3.286, formula: pro_forma_as_adjusted_cash / due_next_12m}

