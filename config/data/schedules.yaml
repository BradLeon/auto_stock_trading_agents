# Source-specific refresh policy. The launchd agent wakes the controller; this
# file alone does not create or prove a running launchd job.
version: 1
controller:
  owner: launchd:com.ats.data-refresh
  interval_seconds: 3600
  ledger: var/data_refresh.sqlite
  misfire_grace_hours: 24
  max_run_seconds: 1800
  # Fail closed during controller rollout. Enable each validated job explicitly.
  default_enabled: false
structured:
  trigger: launchd_controller
  command: ats data ingest
  default_timezone: UTC
  jobs:
    ramp_ai_index_p10d_probe:
      enabled: true
      source: ramp_ai_index
      datasets: [ramp_ai_adoption, ramp_ai_spend]
      schedule: every_10_days
      interval_days: 10
      anchor_date: 2026-09-24
      at: "07:30"
      timezone: UTC
      command: ats data release-check --source ramp_ai_index --ingest-new --force-check
      concurrency: 1
      freshness_slo_days: 14
      retry:
        attempts: 3
        backoff_seconds: [60, 300, 900]
      semantics: compare reference_period/methodology_fingerprint/payload_sha256; append new periods or revisions, never overwrite
    openrouter_rankings_p7d_ingest:
      enabled: true
      source: openrouter_rankings
      datasets: [openrouter_rankings_daily]
      schedule: every_7_days
      interval_days: 7
      anchor_date: 2026-09-24
      at: "08:00"
      timezone: UTC
      command: ats data ingest --source openrouter_rankings --dataset openrouter_rankings_daily
      concurrency: 1
      retry:
        attempts: 2
        backoff_seconds: [60, 300]
      scope:
        overlap_days: 14
        period: day
        start_date: previous_14_complete_utc_days
        initial_history_start_date: 2025-01-01
        api_key_env: OPENROUTER_API_KEY
      # The cadence is 7 days, so an SLO tighter than that would report stale on
      # every single check.  10 days leaves the intended 7-day period plus three
      # days of tolerated upstream/scheduler delay before an alert is real.
      freshness_slo_days: 10
      semantics: append immutable artifacts and revision vintages; incomplete UTC weeks remain queryable daily but are excluded from trend products
    frontier_ai_capability_model_discovery_p7d:
      enabled: true
      source: frontier_ai_capability
      datasets: [frontier_ai_capability_benchmarks]
      schedule: every_7_days
      interval_days: 7
      anchor_date: 2026-10-02
      at: "07:20"
      timezone: UTC
      command: ats data release-check --source frontier_ai_capability --ingest-new --force-check
      concurrency: 1
      retry_discovery_only: true
      freshness_slo_days: 10
      retry:
        attempts: 2
        backoff_seconds: [120, 600]
      scope:
        public_routes: [livebench_git, terminal_bench_git, terminal_bench_science_json, osworld_json, automationbench_aa_public_page, scicode_aa_public_page, critpt_aa_public_page, mmmu_pro_aa_public_page, toolathlon_verified_html, spreadsheetbench_project, hle_aa_public_page]
        bulk_requests_per_run: 11
        conditional_requests: [etag, last_modified, git_sha, payload_sha256]
        hot_observation_days: 30
        # HTML collection also requires exact per-benchmark authorization in
        # ATS_FRONTIER_AI_PUBLIC_HTML_BENCHMARKS; other/future routes stay closed.
        public_html_benchmarks: [automationbench_aa, scicode, critpt, mmmu_pro, toolathlon_verified, humanitys_last_exam]
        fail_closed_on_policy_or_parser_drift: true
      semantics: discover model/benchmark revisions once per cycle; no_change never duplicates a vintage; paid AA API is optional only; events are retained separately from uniform matrix
    frontier_ai_capability_benchmark_probe_p7d:
      enabled: true
      source: frontier_ai_capability
      datasets: [frontier_ai_capability_benchmarks]
      schedule: every_7_days
      interval_days: 7
      anchor_date: 2026-10-02
      at: "07:25"
      timezone: UTC
      concurrency: 1
      freshness_slo_days: 10
      retry:
        attempts: 2
        backoff_seconds: [120, 600]
      scope:
        # The whole probe runs weekly now, so the previous hot/warm/mature tiers
        # (daily / every 3 days / weekly) collapse into a single 7-day cadence.
        # New benchmark scores are therefore captured with up to a 7-day delay.
        observation_ticks: weekly
        public_routes_only: true
        required_env: [ATS_FRONTIER_AI_PUBLIC_HTML_BENCHMARKS]
        public_terms_approval_env: ATS_FRONTIER_AI_PUBLIC_TERMS_APPROVED
        public_structured_page_policy_env: ATS_FRONTIER_AI_ALLOW_PUBLIC_STRUCTURED_PAGES
        public_html_benchmarks: [automationbench_aa, scicode, critpt, mmmu_pro, toolathlon_verified, humanitys_last_exam]
        event_ledger: [automationbench_aa, osworld_2, toolathlon_verified, spreadsheetbench_2]
      command: ats data ingest --source frontier_ai_capability --dataset frontier_ai_capability_benchmarks --query-scope '{"benchmarks":["automationbench_aa","scicode","critpt","mmmu_pro","toolathlon_verified","humanitys_last_exam"]}'
      semantics: append score additions/revisions and preserve explicit NA states; do not mix comparability groups
    frontier_ai_capability_official_release_probe_p7d:
      enabled: true
      source: frontier_ai_capability_official_lab
      datasets: [frontier_ai_public_model_cards]
      schedule: every_7_days
      interval_days: 7
      anchor_date: 2026-10-02
      at: "07:27"
      timezone: UTC
      command: ats data ingest --source frontier_ai_capability_official_lab --dataset frontier_ai_public_model_cards --query-scope '{"dataset_id":"frontier_ai_public_model_cards"}'
      concurrency: 1
      freshness_slo_days: 10
      retry:
        attempts: 2
        backoff_seconds: [120, 600]
      scope:
        public_only: true
        source_type: lab_self_reported
        fallback_source_type: competitor_reported
      semantics: discover official release/model-card identities and self-reported scores; never overwrite third-party observations
    frontier_ai_capability_full_audit_p7d:
      enabled: true
      source: frontier_ai_capability
      datasets: [frontier_ai_capability_benchmarks]
      schedule: every_7_days
      interval_days: 7
      anchor_date: 2026-10-02
      at: "07:35"
      timezone: UTC
      command: ats data frontier-capability-audit
      concurrency: 1
      freshness_slo_days: 10
      retry:
        attempts: 2
        backoff_seconds: [300, 900]
      scope:
      semantics: audit all Labs, benchmark methods and methodology fingerprints; surface stale warnings
    frontier_ai_labs_revenue_p7d_refresh:
      enabled: true
      # Sacra profiles and the TickerTrends essay are two information sources
      # about one research object, so they share a single 7-day beat rather than
      # running on separate cadences.
      source_group: frontier_ai_labs_revenue
      sources: [sacra_public_company_profiles, tickertrends_public_research]
      datasets: [frontier_ai_labs_revenue]
      schedule: every_7_days
      interval_days: 7
      anchor_date: 2026-10-02
      at: "07:50"
      timezone: UTC
      command: ats data release-check --group frontier_ai_labs_revenue --ingest-new --force-check
      concurrency: 1
      freshness_slo_days: 10
      retry:
        attempts: 2
        backoff_seconds: [120, 600]
      scope:
        sources: [sacra_public_company_profiles, tickertrends_public_research]
        sacra_pages:
          - https://sacra.com/c/openai/
          - https://sacra.com/c/anthropic/
        tickertrends_post_api: https://blog.tickertrends.io/api/v1/posts/anthropic-vs-openai-arr-tracking
        touches_other_layers: false
      semantics: compare content_sha256/semantic_fingerprint/methodology_regime; no_change keeps the last valid platform vintage, a same-period value change appends a revision, a methodology drift only quarantines the new candidate
    kr_semiconductor_exports_monthly:
      enabled: true
      source: kr_ecos_exports
      datasets: [regional_kr_exports]
      schedule: monthly
      day_of_month: 15
      at: "08:15"
      timezone: Asia/Seoul
      command: ats data ingest --source kr_ecos_exports --dataset regional_kr_exports
      concurrency: 1
      freshness_slo_days: 45
      retry:
        attempts: 2
        backoff_seconds: [300, 900]
      scope:
        release_day: monthly_upstream_latest_release_check
      semantics: monthly numerical series; append revised periods and preserve source vintage
    tw_ic_exports_monthly:
      enabled: true
      source: tw_mof_exports
      datasets: [regional_tw_exports]
      schedule: monthly
      day_of_month: 15
      at: "08:15"
      timezone: Asia/Taipei
      command: ats data ingest --source tw_mof_exports --dataset regional_tw_exports
      concurrency: 1
      freshness_slo_days: 45
      retry:
        attempts: 2
        backoff_seconds: [300, 900]
      scope:
        release_day: monthly_upstream_latest_release_check
      semantics: HS8542 export values in USD; append revised periods and preserve source vintage
    dram_contract_price_monthly:
      enabled: true
      source: trendforce_dram
      datasets: [industry_dram_contract_price]
      schedule: monthly
      day_of_month: 15
      at: "08:15"
      timezone: Asia/Taipei
      command: ats data ingest --source trendforce_dram --dataset industry_dram_contract_price
      concurrency: 1
      freshness_slo_days: 45
      retry:
        attempts: 2
        backoff_seconds: [300, 900]
      scope:
        release_day: monthly_upstream_latest_release_check
      semantics: public DRAM contract-price table; retain per-series identity and derive MoM only
unstructured:
  trigger: launchd_controller
  command: ats data article-ingest
  default_timezone: UTC
  jobs:
    defeatbeta_sec_index_daily:
      enabled: true
      source: defeatbeta_sec_filing_index
      datasets: [sec_filing_index]
      schedule: daily
      at: "08:00"
      timezone: UTC
      command: ats data document-ingest --source defeatbeta_sec_filing_index
      freshness_slo_days: 3 # refresh/check cadence, not age of latest upstream release
      retry: {attempts: 2, backoff_seconds: [300, 900]}
      semantics: pinned HF revision/spec/hash; index metadata only, never SEC body
    sec_official_body_daily:
      source: sec_edgar_filing_body
      datasets: [sec_filing_documents]
      schedule: daily
      at: "08:30"
      timezone: UTC
      command: ats data document-ingest --source sec_edgar_filing_body
      freshness_slo_days: 3
      retry: {attempts: 2, backoff_seconds: [300, 900]}
      scope:
        required_env: [SEC_EDGAR_USER_AGENT]
      semantics: official HTTPS URL and accession from accepted fixed index only
    defeatbeta_transcript_daily:
      enabled: true
      source: defeatbeta_earnings_transcript
      datasets: [earnings_transcripts]
      schedule: daily
      at: "09:00"
      timezone: UTC
      command: ats data document-ingest --source defeatbeta_earnings_transcript
      freshness_slo_days: 3 # refresh/check cadence, not age of latest upstream release
      retry: {attempts: 2, backoff_seconds: [300, 900]}
      semantics: pinned HF revision/spec/hash and exact ticker/fiscal-quarter segments
    ai_hardware_knowledge_daily:
      enabled: true
      source: ai_hardware_knowledge_corpus
      datasets: [ai_hardware_knowledge]
      schedule: daily
      at: "09:15"
      timezone: UTC
      command: ats data document-ingest --source ai_hardware_knowledge_corpus
      freshness_slo_days: 3
      retry: {attempts: 2, backoff_seconds: [300, 900]}
      semantics: repository manifest and content-hash check, no external fetch
    trendforce_news_weekly:
      enabled: true
      source: trendforce_news
      datasets: [shared_documents]
      schedule: weekly
      weekday: monday
      at: "10:00"
      timezone: America/New_York
      command: ats data article-ingest --source trendforce_news
      concurrency: 1
      freshness_slo_days: 10
      retry:
        attempts: 2
        backoff_seconds: [300, 900]
      semantics: public article discovery and body admission; no Agent or LLM side effects
    semianalysis_newsletter_weekly:
      enabled: true
      source: semianalysis
      datasets: [shared_documents]
      schedule: weekly
      weekday: monday
      at: "10:15"
      timezone: America/New_York
      command: ats data article-ingest --source semianalysis
      concurrency: 1
      freshness_slo_days: 10
      retry:
        attempts: 2
        backoff_seconds: [300, 900]
      scope:
        full_body_preferred: true
        partial_preview_explicit: true
        required_env: [GMAIL_ADDRESS, GMAIL_APP_PASSWORD]
      semantics: IMAP/RSS batch; advance mailbox cursor only after complete persistence
    ibkr_news_daily:
      enabled: true # 2026-10-02: TWS read-only probe and launchd ingestion passed.
      sources: [ibkr_news, yfinance_live_news]
      datasets: [shared_documents]
      schedule: daily
      at: "16:30"
      timezone: America/New_York
      command: ats data article-ingest --source ibkr_news
      concurrency: 1
      freshness_slo_days: 3
      retry:
        attempts: 2
        backoff_seconds: [120, 600]
      scope:
        fallback_only: yfinance_live_news
        fallback_on: [unreachable, tws_unreachable, unauthorized, provider_unavailable,
                      rate_limited, request_rejected, failed_slices]
        human_title_url_review_required: true
      semantics: TWS headlines daily; Yahoo only for failed primary scope and held for human review
