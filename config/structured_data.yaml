  sec_companyfacts:
    "us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax": financial.revenue.gaap
    "us-gaap:Revenues": financial.revenue.gaap
    "us-gaap:SalesRevenueNet": financial.revenue.gaap
    "ifrs-full:Revenue": financial.revenue.gaap
    "us-gaap:GrossProfit": financial.gross_profit.gaap
    "ifrs-full:GrossProfit": financial.gross_profit.gaap
    "us-gaap:OperatingIncomeLoss": financial.operating_income.gaap
    "ifrs-full:ProfitLossFromOperatingActivities": financial.operating_income.gaap
    "us-gaap:NetIncomeLoss": financial.net_income.gaap
    "ifrs-full:ProfitLoss": financial.net_income.gaap
    "us-gaap:EarningsPerShareDiluted": financial.eps.diluted.gaap
    "ifrs-full:DilutedEarningsLossPerShare": financial.eps.diluted.gaap
