# 第三方证据源注册表 —— 不依赖任何公司自述的证据。
#
# 为什么需要它：截至 2026-08-07，两条 L5 命题的证据**全部**来自公司自己的财报纪要。
# 立场多样性闸因此只能在 customer / supplier 之间取得，而这两类都是当事人。海关统计和
# 定价机构不是任何一方当事人 —— 它们提供的 `regulator` 立场是这套系统里最稀缺、也最难
# 被单方叙事污染的证据。
#
# 数据模型不用改：Observation 早就有 observation_type: regulatory|market|research，
# WitnessStance 早就有 regulator，三道闸对它们一视同仁。这里加的只是取数与声明。
#
# --- 字段 -------------------------------------------------------------------
# adapter            取数适配器，对应 src/ats/data/sources/<adapter>.py
# params             传给适配器的参数（各家 API 不同，这一层无法也不该抽象）
# entity             这条事实"关于"什么。非公司实体，用大写下划线以免和 ticker 混淆
# stance             进入立场多样性闸的立场
# observation_type   regulatory（官方统计） | market（价格/成交） | research
# cadence            发布频率，同时也是陈旧判据
# concepts           它有资格说话的维度 —— 绑定发生在维度 key 上，不绑定具体命题，
#                    所以加一个源不用改任何命题，加一条命题也不用改任何源
# direction_from     方向怎么从序列算出来：
#                      yoy          同比 —— 看趋势，滤掉季节性
#                      mom          环比 —— 看拐点，比同比早一步反映转折
#                      level_vs_ma  与移动均值比 —— 看水平偏离
#                    同比同环比可以并列声明，各产出一条观测；一段趋势和一个拐点是两件
#                    不同的事实，合成一个数会把先行信息抹掉。
#
# --- 不做的事 ---------------------------------------------------------------
# 序列不走 LLM 抽取：一串数字没有散文可读，direction 由公式算出、evidence_span 确定性
# 渲染成一行可复核的事实。但**含义仍然交给判读器** —— "出口同比 +32%" 既可能是需求强劲
# 也可能是供给转松，和扩产是同一类问题。引擎算观测，模型判含义，分工不变。
#
# 第三方源**不计入** witnesses_reported 的覆盖率分母（2026-08-07 决定）。那个分母衡量
# 的是"该说话的公司说了没有"，把统计局塞进去会稀释公司的沉默。它们贡献证据簇、立场
# 类别与支持/反驳记分，在报告里单列。

sources:
  kr_semiconductor_exports:
    label: 韩国半导体出口指数（月度）
    adapter: kr_ecos
    params: {stat: "403Y001", item: "3091AA"}      # 수출금액지수 / 반도체
    entity: KR_SEMI_EXPORT
    stance: regulator
    observation_type: regulatory
    cadence: monthly
    concepts: [supply_tightness, hbm_demand]
    direction_from: [yoy, mom]
    # 韩国半导体出口以**存储为主**，而 SK 海力士 + 三星就是它的主体——这条序列测的是这两家
    # 实际出货了什么，而不是它们如何评价自己。韩国银行每月发布，且是指数（2020=100），
    # 所以观测取同比/环比变化而非水平值。
    # 与台湾那条的区别正是"机制"而不是"统计口径"：台湾出口是代工与封装，不是存储。

  tw_ic_exports:
    label: 台湾积体电路出口（月度）
    adapter: tw_mof
    params: {hs_prefix: "8542", metric: export_value_usd}
    entity: TW_IC_EXPORT
    stance: regulator
    observation_type: regulatory
    cadence: monthly
    concepts: [packaging_throughput]
    direction_from: [yoy, mom]
    # 2026-08-07 改绑。原来挂在 supply_tightness / hbm_demand 上，判读器每次都判中性，
    # 理由是"台湾 IC 出口是整体口径，无法归因到 HBM"——它是对的：台湾出口是**代工与封装**，
    # 不是存储。这条序列真正能说话的是封装吞吐，改绑到 packaging_throughput 之后它才
    # 开始提供信息，而不是每期贡献一条"与命题无关"。
    #
    # 与韩国那条的对照说明了判据：同一类统计（半导体出口），换个国家机制完全不同。
    # 入选标准始终是"能否给出区分性读数"，不是"是不是官方数据"。

  dram_contract_price:
    label: DRAM 合约价
    adapter: trendforce
    params:
      items: ["DDR5 8GB SO-DIMM", "DDR4 16Gb 2Gx8", "DDR4 8Gb 1Gx8"]
    entity: DRAM_CONTRACT_PRICE
    stance: regulator
    observation_type: market
    cadence: monthly
    concepts: [hbm_pricing, supply_tightness]
    direction_from: [mom]        # 公开表只给"较上期"，没有历史序列可算同比 —— 只凭一期
                                 # 快照造一个同比就是编造
    # `hbm_pricing` 维度上唯一的独立读数。其余全部是存储厂在描述自己的定价能力，而三家
    # 各说自己 ASP 涨了，是三个当事人，不是交叉印证。
    #
    # 它不是 HBM 价格，为什么仍然对症：HBM 每 bit 吃的晶圆约是常规 DRAM 的三倍，HBM 爬坡
    # 会挤占常规 DRAM 产能、推高其价格——SK 海力士在 Q2 FY2026 电话会上原话就是"常规 DRAM
    # 价格近月大幅上行"。常规合约价上行是挤出效应为真的证据；若 HBM 仍在爬坡而合约价转跌，
    # 那才是反证。
    #
    # observation_type 是 market 不是 regulatory：TrendForce 是定价机构不是官方统计。
    # 注意这让它落入 SECONDARY —— 能参与支持/反驳记分，但**不贡献立场类别**。这是对的：
    # 立场类别是"独立证人"的度量，而一家研究机构的报价不是一个新的经济位置。

# ==============================================================================
# 文章类第三方源 —— 上面 sources: 的兄弟，但走另一条通路
# ==============================================================================
#
# 区别只有一个，但它决定了两者不能合并：**上面那些是数列，这些是散文**。
# 数列靠公式变成观测（chain/sources.py::to_observations，全程不过 LLM）；文章必须被读。
# 混进同一个声明块，就等于让 sources.py 悄悄失去它自己文档字符串所标榜的那个性质
# ——「这些数字从未经过模型的判断」。所以另起一块，另走 chain/articles.py。
#
# --- 字段（与 sources: 不同的部分）---------------------------------------------
# adapter          -> src/ats/data/articles/<adapter>.py，需实现 discover() 与 fetch_body()
# entity           **发布者**，不是被报道的对象。它是「说话人」（source_entity），
#                  文章里提到的公司才是 entity —— 一篇文章可以同时讲三家公司
# pages            索引页往回翻几页。跨轮重叠是免费的：已入库的文章在花掉一次抓取
#                  之前就被跳过，更别说模型调用
# max_per_run      成本上限，只封顶模型调用，不封顶发现
# min_body_chars   作用在**抽出的正文**上，不是整页。见下方 TrendForce 的注释
# match            slug 关键词预筛（slug 里就有标题）。**只管成本不管正确性**——
#                  concept_menu 是封闭菜单，漏网的离题文章会整篇落进未映射池，
#                  任何命题都够不着。所以宁可宽：筛漏了丢的是真证据，
#                  筛松了只浪费一次模型调用
#
# 立场与观测类型：entity 进 witnesses 表时给 regulator（它独立于任何一方当事人），
# 但**逐行的 observation_type 由抽取模型判**——转述台积电指引的句子是 guidance（PRIMARY，
# 贡献立场类），机构自己的观点是 research（SECONDARY，只贡献权重）。这意味着一条命题
# 能否过立场闸，部分取决于模型的逐行判型。这不稳定但有语义依据，**不要试图用配置钉死
# 类型** —— 那正是 supports_when 当初被删掉的同一类错误（见 schemas/chain.py::Concept）。

article_sources:
  trendforce_news:
    label: TrendForce 新闻
    adapter: trendforce
    entity: TRENDFORCE
    stance: regulator
    doc_type: article
    cadence: weekly
    pages: 5              # 每页约 9 篇、每天发 7-9 篇 -> 覆盖约一周，周更作业够且有冗余
    # 2026-08-17 由 12 提到 16：上面的关键词集扩了约三成（L4/XPU 一组），而
    # max_per_run 是**硬上限**——不同步抬高，新增的加速器文章会在上限处挤掉存储/封装/
    # 光互联的文章，等于用 L4 的覆盖率换 L3/L5 的覆盖率。这是本文件里已经写过一次的
    # 教训（"过松的过滤器会静默挤掉真正该读的文章"），只是这次挤压来自上限而不是过滤器。
    max_per_run: 16
    min_body_chars: 800   # 与 data/source_cache.py 的 MIN_CHARS 对齐
    # 2026-08-14 补光互联词。原来这一串全是存储/封装词，**一个光的都没有**，
    # 于是 TrendForce 的光模块/CPO 报道从来没被抓过——直接后果是 L3 三条 common 命题
    # 全部卡在「立场单一（只有 supplier）」，因为唯一能提供 regulator 立场的证人
    # 被关键词挡在门外。这不是判读的问题，是取数的问题。
    # 2026-08-17 补 L4/XPU 词。**与 2026-08-14 补光互联词那次是同一个毛病**：这串词里
    # nvidia/marvell/broadcom/intel 早就有，但 gpu / asic / xpu / accelerator / amd
    # **一个都没有**——于是 TrendForce 关于加速器本身（而不是它用的存储与封装）的报道
    # 从来没被抓过。后果同样直接：L4 四家的台账里非自述读数总共只有 11 条，AVGO 与 MRVL
    # 各 0 条，而 TrendForce 是这一层唯一现成的 regulator 立场来源。
    # **这是取数问题，不是判读问题**——不补词，四条 L4 命题只能全部落在 self_reported。
    match: [cowos, copos, emib, packaging, hbm, dram, nand, memory, foundry,
            tsmc, wafer, samsung, sk-hynix, hynix, micron, intel, nvidia,
            nanometer, 2nm, 3nm, advanced, osat, ase, capacity, yield,
            # --- 光互联/互联层 ---
            optical, optics, transceiver, laser, photonic, photonics, cpo,
            co-packaged, npo, dsp, retimer, aec, interconnect, 800g, 1.6t, 3.2t,
            eml, vcsel, inp, lumentum, coherent, credo, marvell, broadcom,
            # --- L4 芯片设计 / XPU ---
            # 刻意不加 `training` 与 `ai chip`：前者在标题里几乎总是泛指"AI 训练"而不是
            # 芯片，后者与已有的 nvidia/gpu/asic 高度重叠。按本文件自己的教训——过松的
            # 过滤器不只是费钱，它会在 max_per_run 上限处**静默挤掉真正该读的文章**。
            gpu, asic, xpu, accelerator, amd, instinct, blackwell, rubin,
            tpu, trainium, inference, hyperscaler]
    # 为什么不用它的 RSS（2026-08-13 实测）：https://www.trendforce.com/news/feed/ 确实存在，
    # 带全文与结构化 tags，本该是更好的源 —— 但它的**内容冻结在 2026-07-01**，
    # 而站点每天都在发（索引页当天就有 08-13 的文章）。更阴的是它每次都带一个新的
    # Last-Modified 重新分发，光看响应头看不出它是死的。所以发现走索引页翻页。
    # 哪天它修好了，只需要改 data/articles/trendforce.py 的 discover() 一个函数。
    #
    # 付费墙怎么处理：**靠正文容器在不在，不靠检测付费特征**。实测否掉的三种做法——
    #   · 按 "Subscribe"/"Member Center" 关键词判：每一页都命中（导航栏常驻），6/6 篇误报
    #   · 按整页长度判：反向相关，付费的 research/dram 页纯文本 32,216 字符，
    #     比任何正常文章都长，却一个字正文都没有
    #   · 直接用整页文本：正文只占 47%，其余是导航与页脚；付费页则是 100% 噪音
    # 采用的判据让**新出现的付费形态默认落在安全的一侧**（记成缺口），而不是默认被当成正文。
    # 取不到正文记 save_document_failure —— 「读不到」和「没说」是两种状态，
    # 只报成功会让付费墙扩大伪装成「TrendForce 最近没什么可说的」。

  # 2026-08-18 新增。**这条链上唯一覆盖「结构性交易」的源。**
  # 财报讲的是已经结束的那个季度；而融资平台、对客户的股权与担保、供应长约这类事情是
  # **公告出来的**，等它出现在 10-Q 里，命题问的那件事早就变了。
  #
  # 实证：`xpu_revenue_funded_by_customers`（XPU 收入由客户自有资金还是厂商垫资支撑）
  # 只靠第一方财报时判 unknown——独立证据簇 1 < 2。答案一直在这个源里：
  #   [2026-08-11 DJ-N]《Nvidia, Wall Street Firms Set Financing Pact -- WSJ》
  #     Apollo/Blackstone/BlackRock/Brookfield/高盛/KKR「aim to deploy over $500 billion
  #     of outside capital」建立「compute financing platforms」；
  #     并且——「Apollo and Blackstone earlier this year struck a deal with **Broadcom**
  #     to set up a similar financing platform for the chip maker's customers.」
  # 最后那句比标题值钱：它是**对博通自述 SPV 的独立印证**，而博通在台账里非自述读数为 0。
  # 这个源正是截面摆脱「四家自己给自己打分」的出路。
  #
  # **不需要订阅**：下面这些 Dow Jones 与 Briefing.com 源是有资金账户默认开通的
  # （TWS ▸ 配置 ▸ API ▸ 新闻配置里已勾选）。Benzinga / The Fly 在同一个对话框里但要另外
  # 订阅，未订阅时它们根本不出现在 reqNewsProviders() 里，不需要特殊处理。
  #
  # ⚠️ **依赖 TWS 正在运行**。取不到时按现有约定记成 unreachable 缺口（"读不到"与
  # "没说"是两种状态），不会静默当成"最近没新闻"。
  #
  # stance 用 regulator：同 TRENDFORCE 的理由——WitnessStance 枚举里没有 media，
  # 这个位置要的是"独立于任何一方的第三方"，不是"当事人的某一方"。
  # entity 用 DOWJONES 一个口径而不按 WSJ/Barron's/MarketWatch 拆：它们同属道琼斯，
  # 同一件事的多篇报道**本来就该算一个证据簇**（不变式 3：十篇转载是一个簇）。
  ibkr_news:
    label: IBKR 新闻（道琼斯/Briefing）
    adapter: ibkr_news
    entity: DOWJONES
    stance: regulator
    doc_type: article
    cadence: daily
    pages: 3                # 对本适配器 = 回看 3 个 3 天切片
    max_per_run: 10
    min_body_chars: 600     # 通讯社正文比网页文章短，阈值低于 TrendForce 的 800
    params:
      lookback_days: 7
      # 只扫这些标的的新闻。**不是全市场**——按 conId 逐个请求，名单越长越慢，
      # 且与命题无关的公司只会把未映射池做大。先覆盖 L4 四家 + 最活跃的买方。
      symbols: [NVDA, AMD, AVGO, MRVL, TSM, MU, ORCL, MSFT]
    # 关键词比 TrendForce 那份窄且偏"交易/结构"，因为这个源的价值不在于复述基本面
    # （那些财报里都有），而在于**财报里没有的那类事实**。
    match: [financing, finance, guarantee, backstop, prepay, prepayment, stake,
            equity, invest, investment, vehicle, spv, lending, loan, debt,
            apollo, blackstone, blackrock, brookfield, kkr, "goldman sachs",
            supply, agreement, deal, pact, partnership, commitment, order,
            capacity, gpu, asic, xpu, accelerator, chip, hbm, foundry, capex]

  # 2026-08-18 接入。**文章已经在抓了，缺的只是通往命题的那一段。**
  # config/news_sources.yaml 的 newsletter 管线（IMAP + Substack RSS）一直在收 SemiAnalysis，
  # 产出 47 条 research_insights。但那张表的形状是 ticker/direction/summary/quote，
  # **没有 concept、没有 stance、没有 source_entity**，所以任何命题都够不着它。
  # 而躺在里面的东西是这样的：
  #   AMD |「Meta is requesting a custom cut-down version of AMD's MI450X with half the
  #         compute and HBM, which could significantly reduce AMD's volume...」
  # 具名客户 + 具名项目的配置变更 + 量的方向，正是 xpu_account_and_customer_mix 最缺的，
  # 而且**不是自述**——四家自己给自己打分的截面永远产不出这种读数。
  #
  # 两条管线读同一篇文章，是有意的不是浪费：
  #   research_insights   回答「这对我持有的某只票意味着什么」→ 喂 PEAD 监控
  #   evidence_observations 回答「这条事实属于哪个命题维度」→ 喂命题印证
  # 两个不同的问题，合并只会让一个输出把两件事都做砸。成本由 max_per_run 封顶。
  # 重复计数不是风险：闸 1 按**说话人**聚簇，SemiAnalysis 关于同一件事说多少遍都是一簇。
  semianalysis:
    label: SemiAnalysis（已订阅）
    adapter: semianalysis
    entity: SEMIANALYSIS
    stance: regulator     # 同 TRENDFORCE / DOWJONES：枚举里没有 media，这个位置要的是
                          # "独立于任何一方的第三方"，不是"当事人的某一方"
    doc_type: article
    cadence: weekly
    pages: 3
    max_per_run: 4        # 单篇 2-7 万字符，会被切成多个抽取窗口，比网页文章贵得多
    min_body_chars: 2000
    params:
      lookback_days: 30
      source_match: SemiAnalysis   # newsletter 管线里若以后有别家，这里限定只取它
    # **刻意留空 = 全读。** 与 TrendForce/IBKR 相反：那两个是宽口径信息流，需要关键词
    # 控成本；这个是逐篇订阅的深度分析，篇篇都值得读，加过滤只会漏掉真正的增量。
    # 见 ArticleSourceDef.match 的注释：漏一篇丢的是真证据，多读一篇只多一次模型调用。
    match: []

# --- 已评估但暂不接入 ---------------------------------------------------------
