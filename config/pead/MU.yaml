# Micron (MU) — PEAD config · L5 存储：HBM 第二供 + DRAM/NAND 全线。
# 2026-11-04 由 observe 升入 targets，新建本文件（此前只作链证据证人，用 _defaults）。
# 财年 8 月底结：9 月下旬报 FQ4，12 月下旬报 FQ1。
# 叙事依据（2026-11 网络检索，二手来源为主，数字以 MU 公告为准）：FQ4 FY2026 指引约 $50B、毛利率约 86%，
# 2026 年 HBM4 产能已按合同售罄；市场分歧在"存储超级周期还能持续多久"，不在当季能否 beat。

symbol: MU
company_name: "Micron Technology"
# fiscal_label 由财报日历派生（data/period.resolve_fiscal_label），无需手填。
sector_etf: SMH
benchmark: QQQ
run_up_warn_pct: 6.0          # 周期股、财报前常有大幅预期交易
long_threshold: 1.3           # 毛利率已在历史极值，beat 的边际信息量低，门槛抬高

# 权重之和 = 1.00。超级周期里当季数字普遍超预期，次季指引与 HBM 合同能见度才区分好坏。
scorecard_dims:
  - {key: forward_guide,  weight: 0.25, label: 次季营收/毛利率指引（中枢 vs 卖方）}
  - {key: gross_margin,   weight: 0.15, label: 毛利率（周期顶部的边际变化方向）}
  - {key: hbm,            weight: 0.20, label: HBM 营收、HBM4 量产与 2027 合同锁定比例}
  - {key: dram_pricing,   weight: 0.15, label: 传统 DRAM/NAND 合约价与比特出货}
  - {key: capex_supply,   weight: 0.10, label: 资本开支与新增产能节奏（供给是否过快释放）}
  - {key: revenue,        weight: 0.10, label: 营收超预期}
  - {key: call_tone,      weight: 0.05, label: 电话会语气：周期持续性与客户长约措辞}

signal_chain:
  - {symbol: SKHY,      role: peer}        # HBM 份额与定价的直接对照
  - {symbol: "005930.KS", role: peer}      # 三星 HBM4 追赶决定份额与价格
  - {symbol: SNDK,      role: peer}        # NAND 同业
  - {symbol: NVDA,      role: downstream}  # 最大 HBM 客户
  - {symbol: AMD,       role: downstream}
  - {symbol: GOOG,      role: downstream}  # TPU 同样吃 HBM
  - {symbol: LRCX,      role: upstream}    # 存储扩产设备
  - {symbol: FORM,      role: upstream}    # DRAM/HBM 探针卡

narrative_seed: >
  美国唯一的大型 DRAM 厂、HBM 第二供；AI 服务器把 HBM 与高容量 DDR5/企业级 SSD 同时推到供不应求，
  毛利率已处历史极值区间（约 85%+），2026 年 HBM4 产能按合同售罄；
  当季 beat 几乎是共识，股价对次季指引、2027 年长约锁定比例和新增产能节奏更敏感；
  三星 HBM4 追赶、行业资本开支提速导致的供给过剩，是周期见顶的主要信号。
