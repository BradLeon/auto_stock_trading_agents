# 宏观策略师（macro_strategist，权益策略师范式）配置。
# 9 个 theme = 策略师的输入盘（专业仪表盘分类）；定量 theme 关联 MacroData 字段，
# 定性 theme 靠 Tavily 定向搜索。产出以 regime + rate_path + sector_tilts 为核心。

name: macro
label: 宏观
output_dir: /Users/liuchao/Documents/Obsidian Vault/量化投资/个股分析系统

themes:
  - key: fed_policy
    label: 货币政策（美联储）
    kind: quant
    quant: [fed_funds, ust_10y, ust_2y, real_10y]
    queries: ["FOMC Federal Reserve interest rate decision dot plot", "Fed rate cut expectations 2026"]
  - key: inflation
    label: 通胀（CPI/PCE）
    kind: quant
    quant: [cpi_yoy, pce_yoy, breakeven_10y]
    queries: ["US CPI PCE inflation latest data"]
  - key: growth
    label: 增长（PMI/活动指数）
    kind: quant
    quant: [cfnai]
    queries: ["US ISM manufacturing services PMI latest"]
  - key: employment
    label: 就业
    kind: quant
    quant: [unemployment, nfp_change_k, jobless_claims_k]
    queries: []
  - key: financial_conditions
    label: 金融条件（信用利差/美元/波动）
    kind: quant
    quant: [hy_oas, ig_oas, real_10y, dxy, vix]
    queries: []
  - key: commodities
    label: 大宗商品（原油/黄金/美元）
    kind: quant
    quant: [oil_wti, gold, dxy]
    queries: ["oil price OPEC supply", "gold price drivers"]
  - key: geopolitics
    label: 地缘政治
    kind: qual
    quant: []
    queries: ["US Iran Middle East conflict latest", "Russia Ukraine war latest", "Taiwan China tension semiconductor"]
  - key: trade_tariff
    label: 关税与贸易政策
    kind: qual
    quant: []
    queries: ["US tariff trade policy latest", "US China trade semiconductor export controls"]
  - key: industrial_policy
    label: 产业扶持政策
    kind: qual
    quant: []
    queries: ["Korea Japan semiconductor subsidy chip act", "US CHIPS Act funding AI chip policy latest"]

search:
  max_results_per_query: 4
  recency_days: 21
  max_chars_per_result: 1800

# FactSet Earnings Insight — 周度 S&P 500 盈利/估值 backdrop（权威一手）。
# 稳定 URL 302 跳转到当周日期编码 PDF；下载失败回退到文件夹里最新的本地 PDF。
factset:
  enabled: true
  url: https://www.factset.com/earningsinsight
  folder: /Users/liuchao/Documents/Obsidian Vault/信息源/macro
  download: true
  max_pages: 16       # 正文页（图表页 pypdf 提取乱码）
  max_chars: 14000

review:
  max_context_chars: 60000

# 四象限判定的标定阈值（docs/MACRO_ANALYST.md §6.2）。
# ⚠️ 这些是初始标定值，不是定论：上线后按实际触发频率复盘调整——每周翻转说明太灵敏，
#    长期不动说明太钝。改值改这里，代码里的 regime.DEFAULTS 只是缺省兜底。
regime:
  neutral_band: 0.25          # |轴分| 低于此值 ⇒ transition（进入门槛）
  stay_band: 0.15             # 留在已确认象限的宽松门槛（迟滞，见 §4.3）
  min_inputs_per_axis: 2      # 存活输入少于此数 ⇒ insufficient，不猜
  confirm_weeks: 2            # 连续几期同向后 provisional → confirmed

  growth:
    sahm_bad: 0.50            # 失业率 3m均值 − 12m最低 ≥ 0.50pp（Sahm 规则）
    sahm_good: 0.0
    initial_claims_bad_pct: 10.0     # 初请 4 周均值 vs 3 个月前
    continuing_claims_bad_pct: 8.0   # 续请（再就业难度，早期信号）
    cfnai_bad: -0.35          # CFNAI-MA3
    cfnai_good: 0.20

  inflation:
    pce_momentum_pp: 0.3      # 核心 PCE 3m年化 − 12m YoY
    breakeven_z: 1.5          # 10y 通胀补偿 z(3y) —— 饱和点而非触发点：设 0.5 时
                              #   z=-0.51 与 z=-3.0 同样打 -1.0，输入退化成二值
    energy_3m_pct: 15.0       # 汽油/原油 3 个月变化

  alerts:
    credit_widen_bp: 50.0         # HY OAS 1 个月走阔
    equity_near_high_pct: 3.0     # SPX 距 3 个月高点（背离判定）
    worst_combo_real_bp: 20.0     # 实际↑ 且 通胀补偿↑ = 最差组合
    worst_combo_breakeven_bp: 15.0
    bond_vol_z: 1.5               # MOVE（或代理）z-score

  decomposition:
    flat_bp: 5.0              # |Δ| 小于此值视为持平，避免 +4bp 被读成"通胀补偿↑"

  shock_vs_trend:
    shock_z: 2.0              # 1m 变化 z 超此值且 3m 未成形 ⇒ 冲击
    trend_z: 1.0              # 3m 变化 z 超此值且与 1m 同向 ⇒ 趋势
