# Alphabet (GOOG) — PEAD stub. 用户实际持有 GOOG（C 类）。
# 需求端云厂（Google Cloud + Gemini），AI CapEx 指引是全链景气风向标。
# TODO: 如需定制打分卡/信号链（Cloud 增速、CapEx 指引、TPU 自研），参照 NVDA.yaml 补全。

symbol: GOOG
company_name: "Alphabet"
# fiscal_label 由财报日历派生（data/period.resolve_fiscal_label），无需手填；读档案用 data/period.label_for_reads。
#   2026-10-17：手填的季度名每季都会过期（ASML/TSM 财报已出 Q3，这里仍是 Q2），改为不写。
long_threshold: 1.2            # megacap 高关注度，门槛抬高

# 产业链关系：GCP 既买加速器也自研 TPU，是链条上少数同时是买方与设计方的角色。
signal_chain:
  - {symbol: NVDA,  role: upstream}     # GPU 采购（与自研 TPU 并行）
  - {symbol: AVGO,  role: upstream}     # TPU 联合设计方
  - {symbol: TSM,   role: upstream}     # TPU 代工（二级上游）
  - {symbol: SKHY,  role: upstream}     # TPU 用 HBM（三级上游）
  - {symbol: MSFT,  role: peer}         # 同为超大规模云
  - {symbol: AMZN,  role: peer}
  - {symbol: META,  role: peer}
