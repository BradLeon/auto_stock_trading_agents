# Target §3-4, §12 coverage declaration. This is NOT verification evidence.
# A row becomes verified only through a reproducible assurance run.
schema_version: 1
target: docs/TARGET_WORKFLOW_DATAFLOW.md
data_input_contracts:
  HIER_DATA:
    schema_version: target-consumer-input-v1
    owner: ats.data.products
    input_mode: persistent
    allowed_consumers: [layer, sector, fundamental]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.data.products.base.DataProducts.metric_series + ats.data.products.base.DataProducts.neutral_evidence
  DOC_DATA:
    schema_version: target-consumer-input-v1
    owner: ats.data.products
    input_mode: persistent
    allowed_consumers: [layer, information]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.data.products.unstructured.admitted_documents
  COMPANY_DATA:
    schema_version: target-consumer-input-v1
    owner: ats.data.products
    input_mode: persistent
    allowed_consumers: [fundamental]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.data.products.base.DataProducts.metric_series + ats.data.products.unstructured.admitted_documents
  MACRO_DATA:
    schema_version: target-consumer-input-v1
    owner: ats.data.products
    input_mode: persistent
    allowed_consumers: [macro]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.data.products.base.DataProducts.metric_series
  MARKET_DATA:
    schema_version: target-consumer-input-v1
    owner: ats.data.runtime
    input_mode: runtime
    allowed_consumers: [technical, risk]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.data.runtime.market_data.fetch_close_history_many + ats.data.runtime.options.fetch_runtime
  PORTFOLIO_DATA:
    schema_version: target-consumer-input-v1
    owner: ats.execution.state_api
    input_mode: internal
    allowed_consumers: [chief, risk]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.execution.state_api.get_internal_state
  HISTORY_DATA:
    schema_version: target-consumer-input-v1
    owner: ats.execution.state_api
    input_mode: internal
    allowed_consumers: [chief]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.execution.state_api.get_internal_state
  RISK_RULES:
    schema_version: target-consumer-input-v1
    owner: ats.config
    input_mode: configuration
    allowed_consumers: [risk]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.config.get_config
  APPROVED_EXECUTION_AUTHORIZATION:
    schema_version: target-consumer-input-v1
    owner: ats.execution.authorization
    input_mode: authorization
    allowed_consumers: [trader]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.execution.authorization.build_authorization + ats.execution.authorization.validate_authorization
  BROKER_STATE:
    schema_version: target-consumer-input-v1
    owner: ats.data.runtime
    input_mode: runtime
    allowed_consumers: [clerk]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.data.runtime.broker.portfolio_snapshot
  DECISION_APPROVAL_CONTEXT:
    schema_version: target-consumer-input-v1
    owner: ats.decision.repository
    input_mode: internal
    allowed_consumers: [clerk]
    read_api: ats.data.consumer_api.read_input
    native_api: ats.decision.repository.DecisionAuditRepository.read_chain
retired_consumers:
  evidence_observer:
    status: retired
    replaced_by: layer
    policy_version: observer-to-layer-v1
    preserve_historical_lineage: true
    standalone_role: forbidden
    dispositions:
      - datasets: [ai_work_adoption, ai_enterprise_adoption_us, ai_worker_adoption_us, ramp_ai_adoption, ramp_ai_spend]
        target_product: HIER_DATA
        reason: AI 使用与投入证据支持 L1 产业层级命题。
      - datasets: [frontier_ai_labs_revenue, openrouter_rankings_daily, frontier_ai_capability_benchmarks, frontier_ai_public_model_cards]
        target_product: HIER_DATA
        reason: Frontier 公司商业化、用量与能力证据支持 L1 命题。
      - datasets: [company_financials, market_consensus, regional_tw_exports, regional_kr_exports, industry_dram_contract_price]
        target_product: HIER_DATA
        reason: 财务截面及上下游信号供 Layer 使用，保留通用共享产品和其他消费者。
      - datasets: [sec_filing_documents, earnings_transcripts, ai_hardware_knowledge]
        target_product: DOC_DATA
        reason: 已准入文档保留原 source/version/hash，供 Layer 按实体和命题读取。
      - datasets: [sp500_earnings_insight, private_company_events]
        target_product: general_data_product
        reason: 保留 Macro/Fundamental 等现有消费者，不创建 Observer 角色。
nodes:
  - id: RUNTIME_SRC
    domain: runtime
    owner: external_market_providers
    implementation: src/ats/data/runtime
    config: config/data/structured.yaml
    legacy: direct_market_provider_calls
    verify: runtime_timestamp_failure_no_persistence
  - id: STRUCT_SRC
    domain: structured
    owner: external_structured_providers
    implementation: src/ats/data/adapters/structured
    config: config/data/structured.yaml
    legacy: direct_financial_provider_calls
    verify: source_identity_and_policy
  - id: UNSTRUCT_SRC
    domain: unstructured
    owner: external_document_providers
