# Application configuration (non-secret). Secrets live in .env.
# Loaded by src/ats/config.py.

environment: live           # paper | live  (switch here when going live)

# --- LLM routing -------------------------------------------------------------
# provider: anthropic (native ChatAnthropic) | openai (OpenAI-compatible via base_url)
llm:
  # OpenRouter relay (OpenAI-compatible) — swap provider/model by editing here.
  default_provider: openai
  default_model: anthropic/claude-opus-5
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 120
  max_retries: 3
  # Per-role overrides. Omit a role to use the defaults above.
  routing:
    industry_analyst: {model: deepseek/deepseek-v4-pro}   # PEAD signal-chain read-throughs
    manager: {}            # routing key reused by pead-scorer — real money, keep Opus
    # --- cheap tier (Gemini Flash): high-volume or extraction-only, no quality loss ---
    news_triage: {model: deepseek/deepseek-v4-flash-0731, temperature: 0.0, max_tokens: 8192}  # 高频头条 triage 打分（gemini-flash 太贵，deepseek-v4-pro ~1/9 输出价、智能相近）
    context_monitor: {model: deepseek/deepseek-v4-flash-0731, max_tokens: 8192}   # PEAD monitor _llm_update（高频；triage 已预筛；deepseek-v4-pro 省钱）
    intel_brief: {model: openai/gpt-5.6-terra, temperature: 0.2, max_tokens: 8192}   # 每日情报 digest：逐票投资要点+方向+中文翻译（嵌套结构化，flash/deepseek 偶发翻空 → 用 sonnet 保证每天出；2026-08-03 验证后换 terra，更便宜且智能指数更高）
    actuals_extract: {model: openai/gpt-5.6-terra, max_tokens: 8192}   # pull reported numbers from transcript/8-K over a large context — gemini-flash flaked (empty tool call → all-zero scorecard); needs a reliable extractor（2026-08-03 换 terra）
    # --- mid tier: analysis/synthesis where near-Opus quality costs 1/4-1/20 ---
    research_extract: {model: deepseek/deepseek-v4-flash-0731}   # supply-chain insight extraction
    # 产业链证据抽取（观察名单财报）：只抽事实+原文片段，不做判断 → 便宜档足够。
    # 6 个名字 × 每年约 4 次财报 ≈ 24 次/年，成本可忽略。见 docs/CHAIN_EVIDENCE.md
    evidence_observer: {model: deepseek/deepseek-v4-flash-0731, temperature: 0.0, max_tokens: 8192}
    # 涌现命题归纳：低频（证据驱动，不设 cron），但要从一堆散落事实里归纳出可证伪命题，
    # 是判断活不是抽取活 → 走中档。产出只是给人看的待确认卡，不进因子也不进 Chief。
    claim_proposer: {model: openai/gpt-5.6-terra, max_tokens: 4096}
    # 证据簇判读：唯一决定"这组证据对命题意味着什么"的地方。取代了原来写在 yaml 里的
    # supports_when 标量——真实数据证明那个形状是错的（SK 海力士一边说客户还在要货、
    # 一边扩产，被判成 7 条反驳）。上下文很短（一条命题 + ~10 组、每组几句原文），
    # 但判的是机制不是方向词，判错方向直接改写结论 → 走中档。频次同 sector_review。
    evidence_adjudicator: {model: openai/gpt-5.6-terra, temperature: 0.0, max_tokens: 8192}
    # gemini-2.5-pro (reasoning model) on the full ~57k live context intermittently
    # returns an empty tool call → None; run_structured retries a few times. 24000
    # keeps output headroom for reasoning + the large structured payload.
    sector_analyst: {model: openai/gpt-5.6-terra, max_tokens: 24000}   # weekly L1-L6 sector review — 试点(2026-08-03)验证通过：Terra AA智能指数55(max effort)>sonnet-5(53)，且 OpenRouter 限时5折后价格($1/$6)是 sonnet-5($2/$10)的一半；结构化输出稳定，不稳就退回 anthropic/claude-sonnet-5
    macro_strategist: {model: openai/gpt-5.6-terra, max_tokens: 24000} # weekly macro regime + sector tilts — 同上，换 terra（2026-08-03）
    pead_analyst: {model: openai/gpt-5.6-terra}  # PEAD prep framework/narrative/expectations (token-heavy)（2026-08-03 换 terra）
    structure_analyst: {model: openai/gpt-5.6-terra, max_tokens: 8192}  # 截面 v2 KB 定性结构层：技术久期/护城河/定价权（2026-08-03 换 terra）
    invalidation_check: {model: openai/gpt-5.6-terra, max_tokens: 2048}  # 交易日志每周失效判定——事实分类不是叙事，输入已 blind() 去除盈亏，判读需稳定（2026-08-03 换 terra）
    # --- Opus tier: genuine judgment that drives trades, low frequency ---
    chief: {max_tokens: 8192}            # 首席收口 — daily portfolio decision synthesis, Opus
    risk_officer: {max_tokens: 8192}     # 组合风控官 — narrative memo over the deterministic 6-layer read, Opus
    critic: {max_tokens: 4096}           # 交易日志季度 critic —— 低频、人工签字前最后一道叙事关卡，成本不是约束

# --- IBKR broker connection --------------------------------------------------
# Port: TWS live=7496, TWS paper=7497, IB Gateway live=4001, IB Gateway paper=4002
# client_id: use different IDs for paper vs live to avoid conflicts
broker:
  port: 7496        # live TWS
  client_id: 12     # live client id

# --- Account (sizing) --------------------------------------------------------
account:
  net_liquidation_usd: 100000   # paper book size until IBKR provides the live value

# --- Boss approval channel ---------------------------------------------------
channel:
  kind: feishu_bot              # cli | feishu (app) | feishu_bot (group-bot signed-link approval) | discord
                                # feishu_bot: scheduler pushes an approval card with signed Approve/Reject
                                # links to FEISHU_BOT_WEBHOOK; taps hit `ats serve` (FEISHU_APPROVE_BASE).

# --- Scheduling (Phase 9) ----------------------------------------------------
schedule:
  # Removed `enabled: false` — nothing ever read it, so it claimed scheduling was off
  # while the launchd job scheduled normally. Start/stop the daemon instead.
  run_at: "10:30"               # daily cycle: 1h after US open (was 16:15 close) — lands
                                # ~22:30 China so the Boss can approve in the evening;
                                # chief decides on intraday prices, orders fill in RTH.
                                # PEAD score windows are separate — they fire off an
                                # observed earnings print: config/pead.yaml
                                # schedule.score_windows (bmo 11:00 / amc 20:00 ET).
  timezone: America/New_York
  # 宏观/行业周报：独立的时间与时区，不跟 run_at/timezone 绑定。这个 job 不碰 broker、
  # 不需要 NYSE 交易日，绑定 ET 没有意义——且一旦触发时刻的本地日期和 ET 日历日不一致
  # 就会出问题（例如北京周六 08:50，纽约那一刻还是周五晚上），所以直接用操作者的时区。
  weekly_review_at: "08:50"
  weekly_review_tz: Asia/Shanghai
  # 这台机器会睡眠。触发时刻若在睡眠中，任务只有在唤醒后、且仍在本宽限窗口内才补跑。
  # 实测 2026-07-27：旧值 1 小时导致 daemon 存活 2.5 天、CPU 仅 0.45 秒 —— 每一次触发
  # 都被静默丢弃。最糟的是盘后 20:00 ET 窗口，它落在本地 09:00（清晨）。
  # 6 小时的依据：20:00 ET + 6h = 02:00 ET，距次日开盘仍有约 7 小时，迟到的打分依然
  # 有效；再晚就交给 _score_plan 的 T+1 补打路径。
  misfire_grace_hours: 6

# --- Trade journal -----------------------------------------------------------
# 对账必须每个交易日跑：IBKR 的 reqExecutions 只返回**当日**执行，漏掉的那天成交
# 无法事后补回（除非人工导 Flex Query）。所以它是独立 cron，不挂在日级联后面 ——
# 级联里任何一个 LLM 步骤失败都不该连累它。
journal:
  enabled: true
  reconcile_at: "16:10"         # America/New_York，收盘后
  horizons: [1, 5, 20, 60]      # 预测打分窗口；四个全部保留，长短期分歧本身是信号
