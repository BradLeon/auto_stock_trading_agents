  ai.uk_enterprise_adoption.extensive_use_share: {value_type: number, unit_family: percent, cadence: conditional_wave, period_basis: survey_wave}
  ai.uk_enterprise_adoption.limited_use_share: {value_type: number, unit_family: percent, cadence: conditional_wave, period_basis: survey_wave}
  ai.uk_enterprise_adoption.pilot_use_share: {value_type: number, unit_family: percent, cadence: conditional_wave, period_basis: survey_wave}
  ai.uk_enterprise_adoption.employee_daily_use_share: {value_type: number, unit_family: percent, cadence: conditional_wave, period_basis: survey_wave}
