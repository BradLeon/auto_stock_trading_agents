# 上线步骤：贴回本段 → 打开 event_impact.yaml 的 layer.enabled → 重启 dispatcher。
      # ⑥ 2026-11-16 风险命题（kind: risk，event-impact-routing）。只问**整层共同**的政策风险：
      # 出口许可与市场准入收紧会同时压缩四家的可达市场。单家公司的治理、人事、诉讼不在这里——
      # 那些是该公司的风险项，归基本面（fundamental_risk_register）。
      # 状态五档（休眠/出现/承压/兑现/解除）由层次分析给出；「承压」「兑现」须过独立来源门槛，
      # 由代码核对（agents/layer/event_inputs.py）。只要还在 layer.enabled=false，加载器会把它
      # 整条滤掉，抽取菜单与证据引擎都看不到它。
      - id: l5_export_market_access_risk
        kind: risk
        statement: 出口管制与市场准入限制正在收紧，压缩 XPU 厂商的可达市场
        horizon: {from: 2026-11-01, to: 2027-12-31}
        concepts:
          - key: xpu_export_market_access
            desc: 影响加速器出口与市场准入的**政策与执法动态**——出口许可的发放、撤销与收紧，
                  相关立法草案与表决，针对特定国家或客户的销售限制，出口合规调查与处罚，
                  以及公司因此把某地区收入排除在指引之外。方向指**限制的松紧**：收紧记 up，放宽记 down。
                  ⛔ 不记单家公司的治理、人事、诉讼（那是公司风险项）。
                  ⛔ 不记客户结构与地区收入占比本身（属 ④ 的 xpu_account_and_customer_mix），
                  只记**政策变化**及其对可达市场的直接影响
            expect_from: [NVDA, AMD, AVGO, MRVL, DOWJONES, SEMIANALYSIS, TRENDFORCE]
        falsifiers:
          - 出口许可恢复或放宽，且被排除的地区收入重新纳入指引
          - 相关立法草案在委员会或表决中被否决或无限期搁置
        witnesses:
          - {entity: NVDA, stance: incumbent}
          - {entity: AMD,  stance: incumbent}
          - {entity: AVGO, stance: incumbent}
          - {entity: MRVL, stance: incumbent}
          - {entity: DOWJONES, stance: regulator}
          - {entity: SEMIANALYSIS, stance: regulator}
          - {entity: TRENDFORCE, stance: regulator}

