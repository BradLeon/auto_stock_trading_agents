  - {id: external_unstructured, from: UNSTRUCT_SRC, to: U_ADAPTER, owner: ats.data.sources, verify: source_identity_and_policy}
  - {id: external_market, from: RUNTIME_SRC, to: RUNTIME_API, owner: ats.data.runtime, verify: runtime_timestamp_failure_no_persistence}
  - {id: broker_runtime, from: BROKER_EXT, to: RUNTIME_API, owner: ats.data.runtime, verify: broker_query_and_execution_boundary}
  - {id: catalog_to_adapters, from: SOURCE_REGISTRY, to: S_ADAPTER, owner: ats.data.catalog, verify: source_adapter_resolution}
  - {id: catalog_to_unstructured, from: SOURCE_REGISTRY, to: U_ADAPTER, owner: ats.data.catalog, verify: source_adapter_resolution}
  - {id: refresh_to_structured, from: REFRESH, to: S_ADAPTER, owner: ats.data.refresh, verify: refresh_binding_and_run}
  - {id: refresh_to_unstructured, from: REFRESH, to: U_ADAPTER, owner: ats.data.refresh, verify: refresh_binding_and_run}
  - {id: structured_raw, from: S_ADAPTER, to: RAW_S, owner: ats.data.pipelines.structured, verify: raw_lineage_readback}
  - {id: unstructured_raw, from: U_ADAPTER, to: RAW_U, owner: ats.data.pipelines.unstructured, verify: document_version_readback}
  - {id: structured_gate, from: RAW_S, to: S_GATE, owner: ats.data.pipelines.structured, verify: structured_admission_and_rejection}
  - {id: unstructured_gate, from: RAW_U, to: U_GATE, owner: ats.data.pipelines.unstructured, verify: document_admission_and_rejection}
  - {id: structured_reject, from: S_GATE, to: QUARANTINE, owner: ats.data.pipelines.structured, verify: rejection_raw_and_reason_readback}
  - {id: unstructured_reject, from: U_GATE, to: QUARANTINE, owner: ats.data.pipelines.unstructured, verify: rejection_raw_and_reason_readback}
  - {id: structured_publish, from: S_GATE, to: OBS, owner: ats.data.stores.structured, verify: observation_vintage_asof}
  - {id: unstructured_publish, from: U_GATE, to: DOCS, owner: ats.data.stores.unstructured, verify: immutable_document_versions}
  - {id: document_facts, from: DOCS, to: FACTS, owner: ats.data.stores.unstructured, verify: neutral_fact_lineage}
  - {id: observations_product, from: OBS, to: PRODUCTS, owner: ats.data.products, verify: product_to_consumer_contract}
  - {id: observations_calendar, from: OBS, to: EVENT_CAL, owner: ats.data.calendar_refresh, verify: calendar_version_and_trigger_boundary}
  - {id: documents_product, from: DOCS, to: PRODUCTS, owner: ats.data.products, verify: product_to_consumer_contract}
  - {id: facts_product, from: FACTS, to: PRODUCTS, owner: ats.data.products, verify: product_to_consumer_contract}
  - {id: curated_product, from: KB, to: PRODUCTS, owner: ats.data.products, verify: curated_version_and_readback}
  - {id: product_to_layer, from: PRODUCTS, to: AGENT_LAYER, owner: ats.data.products, verify: layer_read_contract}
  - {id: product_to_information, from: PRODUCTS, to: AGENT_INFORMATION, owner: ats.data.products, verify: information_read_contract}
  - {id: product_to_sector, from: PRODUCTS, to: AGENT_SECTOR, owner: ats.data.products, verify: sector_read_contract}
  - {id: product_to_fundamental, from: PRODUCTS, to: AGENT_FUNDAMENTAL, owner: ats.data.products, verify: fundamental_read_contract}
  - {id: product_to_macro, from: PRODUCTS, to: AGENT_MACRO, owner: ats.data.products, verify: macro_read_contract}
  - {id: runtime_to_technical, from: RUNTIME_API, to: AGENT_TECHNICAL, owner: ats.data.runtime, verify: technical_read_contract}
  - {id: state_to_chief, from: INTERNAL_API, to: AGENT_CHIEF, owner: ats.execution.state_api, verify: chief_read_contract}
  - {id: state_to_risk, from: INTERNAL_API, to: AGENT_RISK, owner: ats.execution.state_api, verify: risk_read_contract}
  - {id: calendar_trigger, from: EVENT_CAL, to: AGENT_CHIEF, owner: ats.data.calendar_refresh, verify: calendar_version_and_trigger_boundary}
  - {id: agent_memory_write, from: AGENT_CHIEF, to: MEMORY, owner: ats.memory, verify: opinion_isolation}
  - {id: analysis_projection_layer_sector, from: AGENT_LAYER, to: AGENT_SECTOR, owner: ats.workflow, verify: declared_projection_dependency}
  - {id: analysis_projection_information_fundamental, from: AGENT_INFORMATION, to: AGENT_FUNDAMENTAL, owner: ats.workflow, verify: declared_projection_dependency}
  - {id: approval_execution, from: MEMORY, to: TRADER, owner: ats.trader, verify: authorized_order_boundary}
  - {id: trader_broker, from: TRADER, to: BROKER_EXT, owner: ats.trader, verify: authorized_order_boundary}
  - {id: broker_clerk_read, from: BROKER_EXT, to: CLERK, owner: ats.execution.clerk, verify: ledger_readback}
  - {id: broker_state, from: BROKER_EXT, to: INTERNAL_API, owner: ats.execution.state_api, verify: internal_asof_completeness}
