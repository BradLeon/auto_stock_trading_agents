# 产业链关系：L4 里唯一的第二家**外售通用 GPU**。它在 XPU 截面里的作用不是"第二名"，
# 而是**通用平台路线的对照组**——没有它，"外售平台 vs 定制 ASIC"这条轴上只剩 NVDA
# 一家自述，而一家自述构不成比较（这正是 sk_hbm_share 当初被改写成截面的理由）。
signal_chain:
  - {symbol: MSFT,  role: downstream}   # Azure 上的机架级部署
  - {symbol: ORCL,  role: downstream}   # OCI 加速器采购与利用率
  - {symbol: META,  role: downstream}   # 推理侧部署
  - {symbol: NVDA,  role: peer}         # 外售通用加速平台的直接竞争
  - {symbol: AVGO,  role: peer}         # 定制 ASIC 路线，争同一批实验室/云厂账户
  - {symbol: MRVL,  role: peer}         # 同上
  - {symbol: TSM,   role: upstream}     # 先进制程与 CoWoS 排期
  - {symbol: SKHY,  role: upstream}     # HBM 供给与成本
