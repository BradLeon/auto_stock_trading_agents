# Global PEAD settings (per-ticker config lives in config/pead/<SYM>.yaml).

targets: [GOOG, NVDA, SKHY, TSM, ASML, COHR, LRCX, LITE, CRDO, AVGO, MRVL, VRT, KLAC]  # monitor + scheduler operate on
# 上一轮：[ASML, TSM, NVDA]（AI 硬件上游三家）。本轮扩到全链 10 家：
#   需求端云厂 GOOG/MSFT/AMZN → GPU 龙头 NVDA → 晶圆/HBM TSM/SKHY → 设备 ASML/KLAC/LRCX
#   → 光互联 COHR。COHR/LRCX 当前以期权持有，但 PEAD 仍监控其正股财报事件。
# 2026-07-23 扩 L3 数据中心基建/光互联：+LITE/CRDO/AXT/AAOI/VRT（capex 上调 read-through 的
#   "卖铲子"层，见 config/sectors/ai_hardware.yaml L3_dc_infra）。这 5 家暂用 _defaults 打分卡，
#   fiscal_label 待各自财报前补；标的内部"选谁/配多少"待截面因子框架落地（见设计讨论）。
# 注：GOOG/MSFT/AMZN/KLAC/LRCX 暂用 _defaults 通用打分卡（仅设了 fiscal_label）；
#   如需像 NVDA.yaml 那样定制 scorecard/signal_chain/narrative，再逐个补。

# 观察名单：只读财报、不打分、不产出仓位建议、**绝不进入下单路径**。
# 它们的财报被抽成产业链证据（见 docs/CHAIN_EVIDENCE.md）——利润是流动的，HBM 的
# 供需由海力士/美光/三星三家共同决定，云 capex 由五家共同决定，只读自己持有的那家
# 等于用几分之一的证据下注。
# 与 targets 的区别：targets 可交易、走完整 PEAD 打分；observe 只贡献证据。
# 2026-08-15 加 AMAT：它在 L6 的 tickers 里、是设备层截面的第四家，但此前既不在 targets
# 也不在 observe，从未抽取过第一方财报——台账里关于它的 12 条全是 TrendForce 转述。
# 不持有它，所以进 observe 而非 targets（只贡献证据，不进下单路径）。
observe: [MSFT, AMZN, META, ORCL, MU, "005930.KS", SPCX, INTC, AMAT]

monitor:
  enabled: true
  lookback_days: 7
  push_context_updates: false    # switch: push material context changes to Feishu (info only)
  materiality_threshold: 0.7     # >= this AND push on -> Feishu info card
  triage:                        # cheap-LLM news triage (news_triage role)
    enabled: true
    min_score: 0.35              # below: stored but excluded from the manager-LLM context
    fulltext_score: 0.65         # at/above: fetch the article body for depth
    max_fulltext: 4              # bodies per run (latency/cost bound)
    fulltext_chars: 12000

# Newsletter research channel (Gmail IMAP + Substack RSS -> per-ticker insights).
research:
  enabled: true
  lookback_days: 2
  max_articles_per_run: 8
  article_chars: 40000           # per-article cap fed to the extraction LLM
  min_confidence_event: 0.6      # >= this -> insight becomes a pead_events entry
  push_threshold: 0.8            # >= this -> immediate Feishu info push

schedule:
  prep_days_before: 3            # run/refresh prep when earnings is within N days
  score_after: true             # master switch for the score windows below

  # Scoring is triggered by an OBSERVED print (actual EPS in the calendar feeds, or a
  # SEC 8-K filed on/after the print date), not by a predicted date — the vendors'
  # dates get revised and their bmo/amc flag is blank for 5 of 13 targets.
  # Two windows a day, America/New_York:
  #   amc 20:00 — that evening's after-close prints. Transcripts land within hours
  #               (measured), so this scores before the next open and the approval
  #               card reaches the Boss at ~08:00 Asia.
  #   bmo 11:00 — before-open prints, scored the same morning.
  # A print whose session can't be determined is attempted in BOTH windows; the
  # pead_score_runs ledger makes the duplicate attempt a no-op.
  score_windows: {bmo: "11:00", amc: "20:00"}
  score_lookback_days: 4        # still catch up on a print this many days old
  transcript_upgrade_days: 4    # window to replace a no-transcript v1 with a v2
  chief_after_score: true       # one Chief cycle (one approval card) per window

  # Kill-switch for the score windows. While false they are forced to dry-run even when
  # the daemon runs --live: scoring, the Chief cycle and the approval card all happen,
  # but no order reaches the broker. Takes effect on the next window — config/pead.yaml
  # is re-read every run, so no daemon restart is needed either way.
  #
  # ENABLED 2026-07-25, knowingly, on the LIVE account (IBKR_PORT=7496,
  # environment=live — NOT paper). The precondition was that overnight orders are
  # priced as LIMITs rather than market: see overnight_limit_slippage_pct below and
  # trader/execute.as_overnight_limits.
  # The Boss's Feishu approval remains the last gate — nothing is submitted without it,
  # and the card is prefixed "⚠️⚠️ 实盘账户" for a live account.
  # Set back to false to stop automated order placement without touching the daemon.
  score_windows_live: true

  # Orders from the after-close window are approved overnight (~08:00 Asia) and reach
  # the broker before the open, so they are submitted as LIMITs off the last close:
  # buy at ref × (1 + pct/100), sell at ref × (1 − pct/100). If a post-earnings gap
  # blows through the limit the order simply doesn't fill — for a name that already
  # moved 12% overnight that is usually the right outcome.
  overnight_limit_slippage_pct: 0.5

# Context budget fed to the actuals extractor. A scraped transcript arrives wrapped
# in page furniture (investing.com: ~34K chars of nav before the body, ~24K of ad
# pixels after); data/transcript.extract_body strips that first, so ~55K of real
# body reaches the LLM whole. Clipping keeps head AND tail — guidance and the
# analyst Q&A sit at the END of a call.
score:
  transcript_chars: 120000
  documents_chars: 40000
  # A v1 (scored from the release only, no call transcript) opens at half size and has
  # its call-only scorecard weights renormalized away rather than scored 0 — 0 means
  # "in line", which would quietly drag every v1 toward 中性观望.
  v1_size_factor: 0.5

# Daily digests surfaced to the Boss each cascade — a detailed Obsidian .md +
# a thumbnail Feishu card (runtime/digest.py). Always push (not gated by
# monitor.push_context_updates). Set false to silence a digest.
digest:
  intel: true                   # 每日情报：高分事件 + 研报 insight + 各票 Δthesis
  perf_risk: true               # 每日绩效·风控：NetLiq/日盈亏 + 6 层风控破限

# Folder holding manually-downloaded official docs: <docs_root>/<SYM>/*.pdf
# (e.g. investor presentations). The earnings release auto-fetches from SEC 8-K.
# Override with env ATS_DOCS_ROOT.
docs_root: /Users/liuchao/Documents/Obsidian Vault/信息源

# Curated industry / supply-chain knowledge (Obsidian notes) injected as stable
# background into prep's thesis building. All PEAD targets share one AI-hardware
# sector brief for now. Missing root -> feature silently skipped.
industry_notes:
  root: /Users/liuchao/Documents/Obsidian Vault/Notion_Sync 1/半导体产业研究合集
  files:              # whitelist; skip pure-101 background. Empty list = all *.md.
    - AI半导体产业链分析上篇-供应链全貌概览.md
    - AI半导体产业链分析中篇-利润去哪了？.md
    - AI半导体产业链分析-下篇-周期股与护城河.md
    - AI Capex 的另一半——数据中心基建产业链解读.md
    - L2云服务层研究：AI 时代的”数字房东”，还能不能收租？.md
    - L4-L6层公司，当前估值分析(4.14).md
  max_chars_per_file: 12000

# Weekly sector review (sector_analyst): L1-L6 层评审 + 个股 call，结论注回 prep/monitor。
sector_review:
  enabled: true
  sectors: [ai_hardware]
  weekday: 5            # 周六跑（独立 cron job，不跟随周一到周五的交易日级联）
  inject_prep: true     # prep 的 industry_context 追加最新评审块
  inject_monitor: true  # monitor 上下文加 1-3 行 regime 提示
  # 截面选股：周报后自动跑各层排序（带结构层，即把产业链证据带进 moat_pricing）。
  cross_section: true
  # 把截面的「复合排名 vs 纯量化排名的分歧 + 依据」写进 Chief 上下文。
  # 刻意不给建议权重数字——Chief 是唯一决策者，把确定性模型算好的仓位直接递过去，
  # 它大概率照抄，等于决策权悄悄转移给一个没人为它负责的模型。
  # 这两个开关关掉 = 完全回到阶段三之前的行为。
  feed_chief_basket: true
