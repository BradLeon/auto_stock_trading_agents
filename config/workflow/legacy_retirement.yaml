# 旧实现退役登记处（workflow/legacy-retirement）
#
# 退出旧实现的唯一合法路径：墓碑登记 → fail-closed 读取门 → 两段式清除。
# `active` 是当前在用清册；`retired` 是墓碑。同一标识若在 `retired` 中状态为
# `retired` 且仍出现在 `active` 里，加载即失败（两处并存不允许静默取胜）。
#
# 本阶段（Phase A）只登记；除标注 `status: retired` 者外不执行任何删除，
# 且本阶段不执行任何物理清除（审计记录为空）。

active:
  - task_projections
  - evidence_fact_projections.legacy_observation_id
  - scheduler.hardcoded_serial_run
  - pead_dossier
  - sector_reviews
  - macro_reviews
  - technical_reviews

retired:
  # ── 本阶段退出 ────────────────────────────────────────────────────────────
  - identifier: workflow_memory.evidence_observations
    capability_domain: data/data-layer-architecture
    replaced_by: data_evidence_observations
    target_phase: A
    status: retired
    exit_condition: >-
      写侧 cutover 完成：四条调用路径（调度观察、chain/sources、chain/articles、命令行）
      全部经 TradingMemory.data_store() 改指数据层，且数据层读入口能按同一标识与血缘读回。
    consumers:
      - scheduler.observe
      - chain.sources
      - chain.articles
      - runtime.cli
    consumer_zero_criterion: >-
      四条路径均无旁路写入；src 内除 _SCHEMA / _retire_data_tables / _migrate /
      _migrate_shared_facts 与 ownership.py 边界登记表外不再出现该表名。
    location: src/ats/memory/store.py（表由 _retire_data_tables 删除）

  - identifier: workflow_memory.evidence_facts
    capability_domain: data/data-layer-architecture
    replaced_by: data_evidence_facts
    target_phase: A
    status: retired
    exit_condition: 写侧 cutover 完成，事实写入经 save_evidence_observation 落到数据层。
    consumers:
      - chain.evidence
      - scheduler.observe
    consumer_zero_criterion: 无代码再引用该表名（同 evidence_observations 的扫描判据）。
    location: src/ats/memory/store.py（表由 _retire_data_tables 删除）

  - identifier: workflow_memory.evidence_fact_projections
    capability_domain: data/data-layer-architecture
    replaced_by: data_evidence_projections
    target_phase: A
    status: retired
    exit_condition: 写侧 cutover 完成，投影与事实在同一事务写入数据层。
    consumers:
      - chain.evidence
      - memory.store.projection_lineage
    consumer_zero_criterion: 血缘解析改由数据层解析两族投影。
    location: src/ats/memory/store.py（表由 _retire_data_tables 删除）

  - identifier: workflow_memory.evidence_failures
    capability_domain: data/data-layer-architecture
    replaced_by: data_evidence_failures
    target_phase: A
    status: retired
    exit_condition: save_observation_failure 改指数据层。
    consumers:
      - chain.sources
      - chain.articles
    consumer_zero_criterion: 无代码再引用该表名。
    location: src/ats/memory/store.py（表由 _retire_data_tables 删除）

  # ── 待退（条件未满足，本阶段只登记） ──────────────────────────────────────
  - identifier: task_projections.legacy_columns
    capability_domain: agent/task-projection
    replaced_by: task_projection_envelopes
    target_phase: D
    status: pending
    exit_condition: 读取方全部切换到 task_projection_envelopes，且旧表在新写路径中零写入。
    missing_condition: >-
      旧列的读取方（store.projection_lineage 同时解析两个投影族、tests/test_fact_projections.py）
      尚未切换；本阶段只登记，不删除任何旧列。
    consumers:
      - memory.store.projection_lineage
      - tests/test_fact_projections
    consumer_zero_criterion: 上述读取方全部改为读 task_projection_envelopes，且旧表零写入。
    location: src/ats/memory/store.py:337-343

  - identifier: evidence_fact_projections.legacy_observation_id
    capability_domain: data/data-layer-architecture
    replaced_by: data_evidence_projections
    target_phase: D
    status: pending
    exit_condition: 历史观测标识不再被任何读取方引用。
    missing_condition: 迁移期兼容读仍按 legacy_observation_id 回溯旧观测，消费方未清零。
    consumers:
      - memory.store.fact_projections
      - tests/test_data_migrations
    consumer_zero_criterion: 无读取方再按该列查询。
    location: 数据层 data_evidence_projections

  - identifier: scheduler.hardcoded_serial_run
    capability_domain: workflow/run-contracts
    replaced_by: workflow.run_contracts.TaskRegistry + Dispatcher
    target_phase: E
    status: pending
    exit_condition: 任务注册表与依赖解析上线并通过验收，Dispatcher 接管阶段编排。
    missing_condition: >-
      Dispatcher 运行时属 Phase E，本阶段只定义契约与注册表结构，未接线任何调度执行路径。
    consumers:
      - runtime.scheduler
      - tests/test_scheduler_jobs
    consumer_zero_criterion: 调度入口不再以硬编码顺序表达阶段依赖。
    location: src/ats/runtime/scheduler.py

  - identifier: legacy_read_models
    capability_domain: agent/task-projection
    replaced_by: task_projection_envelopes + 角色专用 payload
    target_phase: D
    status: pending
    exit_condition: 新写路径稳定，且旧报表与 CLI 消费方迁移完成。
    missing_condition: >-
      pead_dossier / sector_reviews / macro_reviews / technical_reviews 仍是活动兼容读模型，
      报表与 CLI 消费方尚未迁移到 envelope。
    consumers:
      - runtime.cli
      - channel.context
    consumer_zero_criterion: 旧报表与 CLI 全部改为读 envelope，兼容写入登记退役条件后清零。
    location: Workflow memory
  - identifier: store.direct_trade_reads
    capability_domain: execution/internal-state-api
    replaced_by: execution.state_api（as-of + 完整性标记的内部状态读模型）
    target_phase: C
    status: pending
    exit_condition: Chief（assemble.py）、Risk（risk/assess.py）与 channel/context 的交易历史与绩效读取全部改经 Internal State API。
    missing_condition: >-
      上述消费方仍在直读 trades/fills/performance 原始表；双读比对确认一致后逐个切换。
    consumers:
      - agents.chief.assemble
      - risk.assess
      - channel.context
    consumer_zero_criterion: 消费方全部切换且直读调用清零（grep 校验）。
    location: Workflow memory

  # ── Phase B（决策审计与交易安全）──────────────────────────────────────────
  - identifier: risk.checks.in_place_clipping
    capability_domain: risk/deterministic-review
    replaced_by: risk.checks.review_revision（整条修订只读审查 + counterproposal）
    target_phase: B
    status: retired
    exit_condition: >-
      图风控节点改调 review_revision；旧就地裁剪函数（_apply_order_caps /
      _clip_event_notional 及裁剪式返回值）从 src 移除，pre_trade() 适配层除外。
    consumers:
      - graph.chief.risk_gate
      - graph.pead
    consumer_zero_criterion: src 内无任何调用方再取得「被裁剪后的订单」作为风控输出。
    location: src/ats/risk/checks.py

  - identifier: agents.risk_validator.apply_guardrails
    capability_domain: risk/deterministic-review
    replaced_by: agents.risk_validator.review_guardrails（只读边界，不改写提案）
    target_phase: B
    status: retired
    exit_condition: 默认流程改调 review_guardrails，apply_guardrails 无引用。
    consumers:
      - graph.pead
    consumer_zero_criterion: src 内 grep apply_guardrails 仅剩定义与其自身测试（已改造）。
    location: src/ats/agents/risk_validator.py

  - identifier: runtime.server.in_process_resume_dedup
    capability_domain: decision/approval-lifecycle
    replaced_by: decision.repository.validate_callback（持久幂等键 + 终态/修订/审查判定）
    target_phase: B
    status: retired
    exit_condition: server 移除进程内 _RESUMED，去重改查 boss_approvals 与 decision_cycles。
    consumers:
      - runtime.server.handle_callback
      - runtime.server.handle_approve
    consumer_zero_criterion: src 内不再存在任何进程内回调去重集合。
    location: src/ats/runtime/server.py

  - identifier: memory.store.legacy_decision_write_path
    capability_domain: decision/decision-audit-store
    replaced_by: decision_revisions + mirror_revision_to_legacy（D2 双写过渡）
    target_phase: B
    status: pending
    exit_condition: cycles/decisions 旧决策写路径的全部读取方切换到审计表后，镜像写移除。
    missing_condition: >-
      D2 过渡期：决策审计表是权威，但 last_chief_run / recent_decisions 等旧读入口
      仍由镜像双写供数，不能立即停写。
    consumers:
      - decision.repository.mirror_revision_to_legacy
      - memory.store.last_chief_run
      - memory.store.recent_decisions
    consumer_zero_criterion: 上述读取方全部改读 decision_revisions，镜像写调用清零。
    location: src/ats/decision/repository.py

  - identifier: trades.client_order_id.legacy_derivation
    capability_domain: execution/authorization-gate
    replaced_by: client_order_id = cycle + revision_no + order_seq 派生式
    target_phase: B
    status: pending
    exit_condition: 旧式（cycle:symbol:action）行全部被退役/对账清理，新派生式覆盖全部写入。
    missing_condition: >-
      新写入已全量切换到新派生式；历史 trades 行仍携带旧式标识，重试幂等查询需与其共存。
    consumers:
      - memory.store.save_trades
      - trader.execute.place_orders
      - trader.reconcile
    consumer_zero_criterion: trades 表中不再有旧式 client_order_id 行，且代码中旧派生式无引用。
    location: src/ats/memory/store.py

  - identifier: risk.checks.pre_trade_adapter
    capability_domain: risk/deterministic-review
    replaced_by: risk.checks.review_revision
    target_phase: B
    status: pending
    exit_condition: >-
      唯一遗留调用点（runtime/scheduler.py、runtime/cli.py 的组合级巡检语义）确认迁移
      或声明退役后，适配层删除；该开关仅用于风控回滚，不用于生产放行。
    missing_condition: >-
      pre_trade() 已退化为 deprecated 适配层（由新审查结果生成旧式输出），
      保留作为回滚通道。
    consumers:
      - runtime.scheduler
      - runtime.cli
    consumer_zero_criterion: src 内 pre_trade 引用清零（调用方迁至 review_revision）。
    location: src/ats/risk/checks.py

  # ── Phase C（Clerk 与账本）────────────────────────────────────────────────
  # 本阶段已退出（retired）——旧行为已被替换，代码路径已不存在。
  - identifier: reconcile.origin_manual_fallback
    capability_domain: execution/clerk-ledger
    replaced_by: reconcile 三类归属（匹配→system / 人工 orderRef→manual /
      其余→unattributed + 审计异常）
    target_phase: C
    status: retired
    exit_condition: 匹配失败的成交不再静默归为 manual，而是归为 unattributed 并登记异常。
    consumer_zero_criterion: reconcile 内「匹配不到即 manual」分支清零（已达成）。
    location: src/ats/trader/reconcile.py

  - identifier: reconcile.partial_fill_as_filled
    capability_domain: execution/clerk-ledger
    replaced_by: 累计式成交核算（filled_qty 累计 + 成交量加权均价，满量才收口）
    target_phase: C
    status: retired
    exit_condition: 见价即置 filled 的行为消失，部分成交以 partial 终态留痕。
    consumer_zero_criterion: 「见价即 filled」写入路径清零（已达成）。
    location: src/ats/trader/reconcile.py

  # 待退（pending）——双轨期内旧入口仍在用，Phase E 收口。
  - identifier: scheduler.adhoc_journal_jobs
    capability_domain: execution/clerk-ledger
    replaced_by: execution.clerk.clerk_run（窗口幂等的确定性编排入口）
    target_phase: C
    status: pending
    exit_condition: 生产触发（cron/launchd/人工）全部经 ats clerk run，
      reconcile / mark / episodes / predictions / performance 的独立直调入口
      仅保留为单步调试。
    missing_condition: >-
      `ats journal reconcile` 等独立 CLI 入口仍可绕过 Clerk 编排直接写账本，
      双轨期靠窗口幂等键防重复；Phase E 收口时切断直调触发。
    consumers:
      - runtime.cli
    consumer_zero_criterion: 生产触发路径不再直调单步 journal 动作。
    location: src/ats/runtime/cli.py（journal 子命令）

  - identifier: performance.legacy_snapshot
    capability_domain: execution/clerk-ledger
    replaced_by: execution.clerk 编排内的 performance 步骤（+ rebuild 派生读模型）
    target_phase: C
    status: pending
    exit_condition: 「ats trader snapshot」与 scheduler 的直调
      record_snapshot 改经 clerk run 编排（编排内同一步骤幂等）。
    missing_condition: >-
      trader/performance.record_snapshot 仍被 runtime/cli.py:435 与
      runtime/scheduler.py:514 绕过 Clerk 直接调用；clerk_run 内部调用同一
      确定性函数，无重复事实风险，但编排留痕缺失。
    consumers:
      - runtime.cli
      - runtime.scheduler
    consumer_zero_criterion: record_snapshot 的调用方仅剩 execution.clerk。
    location: src/ats/trader/performance.py

  - identifier: journal.report.render_ledger
    capability_domain: execution/internal-state-api
    replaced_by: Internal State / ledger_read_models（派生读模型供报告消费）
    target_phase: C
    status: pending
    exit_condition: 报告（journal ledger 月度台账）改读派生读模型或经
      Internal State API 取数；该报告只展示、从不回读系统，风险低。
    missing_condition: >-
      journal/report.py 仍直接读 trades 原始表渲染 Obsidian 台账；
      SQLite 仍是权威、报告输出从不回流，故仅登记不急退。
    consumers:
      - runtime.cli
    consumer_zero_criterion: report.py 不再直读 trades/fills 原始表。
    location: src/ats/journal/report.py

  # ── Phase D（任务 2.9：层级配置字段退役，写路径已停写、列保留）──
  - identifier: layer_verdict.allocation
    capability_domain: agent/layer-analyst
    replaced_by: >-
      层级分析师产出 layer_status（expanding|steady|contracting|unclear）经
      LayerAnalysis 投影发布；行业分析师消费投影自行产出三级配置结论
      （agent/sector-allocation），经 allocation_for_status 映射与
      risk.yaml layer_utilization 的关系不变。
    target_phase: D
    status: pending
    exit_condition: >-
      任何消费方不再从 LayerVerdict.allocation 读取预算或配置语义；
      层报告不再出现预算章节（行业报告承载）。
    missing_condition: >-
      过渡期内 viz / cli / 行业索引仍以 `allocation or allocation_for_status(layer_status)`
      兼容读历史行；新写路径已不写 allocation（默认空串）。
    consumers:
      - agents.sector.report
      - agents.sector.viz
      - runtime.cli
      - agents.sector.review
    consumer_zero_criterion: >-
      src 内除 schemas/sector.py 的字段定义与「历史行兼容读」外，无任何代码以
      verdict.allocation 为非空语义做预算决策（统一走 allocation_for_status）。
    location: src/ats/schemas/sector.py（字段保留，历史行可读回）

  # ── Phase D（Group 5：PEAD 内部风控与 sizing 路径退出）──
  - identifier: graph.pead.internal_risk_and_sizing
    capability_domain: agent/fundamental-pead
    replaced_by: >-
      基本面事件评审只产出非可执行视图（direction / magnitude / 信心 / 理由 /
      可证伪条件，FundamentalEventReview 投影）；可执行性与风控结论只能在
      主理人提案 + 风控审查的审批链内产生。
    target_phase: D
    status: retired
    exit_condition: >-
      src 内不再存在从基本面输出构造 TradeDecision 或调用风控的代码路径：
      graph/pead.py 的 risk_agent.assess / review_guardrails / pre_trade 调用与
      PeadRecommendation→TradeDecision 转换已删，score.py 的 sizing 树已改为
      event_view()（direction 不映射动作，9.2 契约落地载体）。
    consumers:
      - graph.pead
      - agents.pead.score
    consumer_zero_criterion: >-
      src 内 agents/pead 与 graph/pead 对 risk_agent.assess / pre_trade /
      TradeDecision 的引用清零（已达成；tests/test_pead_graph.py 断言）。
    location: src/ats/graph/pead.py、src/ats/agents/pead/score.py

  # ── Phase D（Group 7：Chief 旧表直读入口，双读期登记）──
  - identifier: chief.legacy_table_direct_reads
    capability_domain: decision/research-snapshot
    replaced_by: >-
      task_projection_envelopes 固定研究快照（build_chief_snapshot：六类投影齐备
      才进决策周期，真实快照随 create_cycle 落库；修订轮次重验失效即 superseded）。
    target_phase: D
    status: pending
    exit_condition: 主理人上下文渲染全部改读投影/快照，旧表直读入口移除。
    missing_condition: >-
      双读期：assemble.py 仍从旧读模型（sector_reviews / macro_reviews /
      technical_reviews / pead dossier / technical context）直读渲染上下文，
      投影路径只负责齐备性校验、快照与缺口阻断；上下文切流属 Phase F。
    consumers:
      - agents.chief.assemble
    consumer_zero_criterion: assemble.py 直读旧表的渲染路径清零，dual_read_diffs 下线。
    location: src/ats/agents/chief/assemble.py

  # ── Phase D（任务 9.1：旧读模型逐项登记，替代 legacy_read_models 的分组条目）──
  - identifier: pead_dossier
    capability_domain: agent/fundamental-pead
    replaced_by: >-
      fundamental_expectation_update / fundamental_event_review 投影
      （task_projection_envelopes，按标的 entity 作用域）
    target_phase: D
    status: pending
    exit_condition: >-
      dossier 的全部消费方改读基本面投影或数据产品；monitor 不再写 dossier
      （Phase D 已达成），dossier 只剩历史只读报表渲染。
    missing_condition: >-
      dossier 报告与 CLI 仍渲染历史 dossier；基本面例行/事件模式已发布投影，
      但报表消费方尚未迁移到 envelope。
    consumers:
      - runtime.cli
      - agents.pead.report
    consumer_zero_criterion: 除历史报表只读渲染外，无任何链路读/写 dossier 表。
    location: Workflow memory

  - identifier: sector_reviews
    capability_domain: agent/sector-allocation
    replaced_by: sector_allocation 投影（+ layer_analysis 投影，task_projection_envelopes）
    target_phase: D
    status: pending
    exit_condition: >-
      行业配置的全部消费方改读投影，sector_reviews 行只作历史报表数据源。
    missing_condition: >-
      Chief 双读仍从 sector_reviews 取行业结论；行业报告渲染仍走旧读模型行；
      两处切流均属 Phase F。
    consumers:
      - agents.chief.assemble
      - runtime.cli
    consumer_zero_criterion: Chief 与 CLI 的 sector_reviews 读取清零（切流后）。
    location: Workflow memory

# 干跑用的清除影响范围声明（未确认时只报告，不执行）
purge_scope:
  - identifier: task_projections.legacy_columns
    scope:
      - task_projections.profile
      - task_projections.profile_version
      - task_projections.input_kind
      - task_projections.input_ref
      - task_projections.target_type
      - task_projections.target_id
