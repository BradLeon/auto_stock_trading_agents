    catalog_status: runtime_excluded
    persistence: runtime
    provider: ThetaData
    adapter: options
    datasets: []
    excludes: [option_chain, greeks, implied_volatility]
  # Frontier AI Labs revenue. Both sources read only unauthenticated public
  # pages and are stored as constrained snapshots; no paid API, MCP connector,
  # licensed export or login-gated table is ever contacted. Paywalled cells are
  # server-side redacted upstream, so their absence is a documented coverage
  # gap — never a zero revenue observation.
  sacra_public_company_profiles:
    catalog_status: current_partial
    persistence: persistent
    provider: Sacra
    upstream: Sacra public company profiles (OpenAI, Anthropic)
    adapter: sacra_frontier_labs_revenue
    datasets: [frontier_ai_labs_revenue]
    cadence: every_7_days
    retention: constrained_snapshot
    discovery_group: frontier_ai_labs_revenue
    constraints:
      paid_api_allowed: false
      mcp_allowed: false
      authentication_required: false
      max_pages_per_run: 2
      max_browser_snapshots_per_run: 2
      public_pages_only: true
      notes: 只采集无需登录的公开公司页面；付费下载、API 与 MCP 一律不接入。
    internal_request_budget:
      concurrency: 1
      requests_per_run: 2
      timeout_seconds: 45
      max_file_bytes: 52428800
      retry_attempts: 1
  tickertrends_public_research:
    catalog_status: current_partial
    persistence: persistent
    provider: TickerTrends
    upstream: TickerTrends public research essay (anthropic-vs-openai-arr-tracking)
    adapter: tickertrends_frontier_labs_revenue
    datasets: [frontier_ai_labs_revenue]
    # The same research object seen from a second angle, so it shares the Sacra
    # profiles' 7-day beat and their discovery group.  The probe fingerprints the
    # numeric claims it admits rather than the page bytes, because Substack
    # re-serialises body_html between fetches; an unchanged essay therefore stays
    # no_change and markup churn can never re-baseline the main sequence.
    cadence: every_7_days
    retention: constrained_snapshot
    discovery_group: frontier_ai_labs_revenue
    constraints:
      paid_api_allowed: false
      mcp_allowed: false
      public_post_api_only: true
      accepted_reference_period: 2026-01-01..2026-06-30
      chart_derived_values_allowed: false
      notes: 与 Sacra 同一研究对象的第二信息源；每 7 天复核公开 Substack post API，语义指纹未变即 no_change，不重新基准主序列。
    internal_request_budget:
      concurrency: 1
      requests_per_run: 1
      timeout_seconds: 45
      max_file_bytes: 5242880
      retry_attempts: 2

# Business datasets. Source references must be reciprocal with `sources.*.datasets`.
# `quality` values are release gates; do not loosen them merely to make a run pass.
datasets:
  frontier_ai_labs_revenue:
    catalog_status: current_partial
    entities: [OPENAI, ANTHROPIC]
    expected_cadence: every_7_days
    primary_sources: [sacra_public_company_profiles]
    fallback_sources: [tickertrends_public_research]
    core_metrics: [ai.frontier_lab.reported_arr, ai.frontier_lab.annualized_revenue_run_rate,
                   ai.frontier_lab.trailing_revenue, ai.frontier_lab.forward_revenue_projection]
    quality:
      positive_value_required: true
      currency_required: true
      reference_period_required: true
      metric_identity_required: true
      observation_identity_required: true
      citation_chain_required: true
      # A headline is chosen by (metric identity, observation identity) first and
      # only then by this source ranking. Priority never deletes a lower-ranked
      # candidate and never turns an estimate into a reported figure.
      headline_source_priority: [company_reported, media_reported, third_party_estimate]
      # Two readable same-cell values are a visible conflict, not something to
      # average away. 0.10 = 10% relative tolerance from the trend design.
      source_conflict_relative_tolerance: 0.10
      # Different metric identities are `not_comparable`; no difference is computed.
      comparison_requires_same_metric_identity: true
      comparison_requires_same_observation_identity: true
      comparison_requires_same_methodology_regime: true
      # A trend cell needs >= 3 comparable points spanning >= 60 days.
      minimum_comparable_points: 3
      minimum_history_days: 60
      direction_net_change_threshold: 0.10
      # Values are stored as absolute USD; billions conversion is a derivation.
      display_scale_divisor: 1000000000
      display_unit_label: USD bn
      reconciliation_relative_tolerance: 1e-9
      core_metric_coverage_ratio_min: 0.5
      coverage_ratio_min: 0.5
      freshness_hours_max: 336
      quarantine_on_missing_period_or_identity: true
      forbid_cross_entity_aggregation: true
      forbid_projection_in_historical_actual: true
      forbid_company_plus_product_summing: true
    acceptance_samples: [OPENAI, ANTHROPIC]
  ai_work_adoption:
    catalog_status: current_partial
    # Entity membership is dynamic taxonomy data rather than a static list.
    entity_types: [soc_major_group, soc_occupation, onet_task]
    expected_cadence: release_event
    primary_sources: [anthropic_economic_index]
    fallback_sources: []
    core_metrics:
      - ai.work_adoption.usage_share
      - ai.work_adoption.automation_share
      - ai.work_adoption.augmentation_share
      - ai.work_adoption.observed_exposure
      - ai.work_adoption.task_penetration
    quality:
      global_only: true
      eligible_row_reconciliation_ratio_min: 1.0
      task_relation_coverage_min: 0.99
      percentage_sum_tolerance_pp: 0.15
      privacy_filtered_missing_status: not_published_or_privacy_filtered
    acceptance_samples: [SOC:15-2031.00, SOC:15-0000, ONET_TASK:7382]
  ai_enterprise_adoption_us:
