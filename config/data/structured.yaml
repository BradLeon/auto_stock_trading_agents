# Provider sources. `adapter` must match a controlled runtime adapter key.
# `internal_request_budget` is our conservative limit, not a Provider SLA/QPS claim.
sources:
  tw_mof_exports:
    catalog_status: current_partial
    persistence: persistent
    provider: Taiwan Ministry of Finance
    adapter: tw_mof
    datasets: [regional_tw_exports]
    cadence: monthly
    retention: full_response
    internal_request_budget: {concurrency: 1, requests_per_run: 2, timeout_seconds: 60}
  kr_ecos_exports:
    catalog_status: current_partial
    persistence: persistent
    provider: Bank of Korea ECOS
    adapter: kr_ecos
    datasets: [regional_kr_exports]
    cadence: monthly
    retention: query_slice
    internal_request_budget: {concurrency: 1, page_size: 10, timeout_seconds: 30}
  trendforce_dram:
    catalog_status: current_partial
    persistence: persistent
    provider: TrendForce public price table
    adapter: trendforce
    datasets: [industry_dram_contract_price]
    cadence: monthly
    retention: constrained_snapshot
    internal_request_budget: {concurrency: 1, requests_per_run: 1, timeout_seconds: 30}
  sec_companyfacts:
    catalog_status: current_partial
    persistence: persistent
    provider: SEC EDGAR
    adapter: sec_companyfacts
    datasets: [company_financials]
    cadence: event
    retention: full_response
    internal_request_budget: {concurrency: 1, requests_per_second: 5, timeout_seconds: 30}
  company_disclosures:
    # Current partial: official TSM quarterly release (SEC 6-K/EX-99.1) only.
    # No annual 20-F obligation is implied by this source's acceptance scope.
    catalog_status: current_partial
    persistence: persistent
    provider: issuer or equivalent official disclosure
    adapter: company_disclosures
    datasets: [company_financials]
    cadence: event
    retention: source_policy
    internal_request_budget: {concurrency: 1, requests_per_second: 1, timeout_seconds: 30}
  defeatbeta_stock_statement:
    catalog_status: current_partial
    persistence: persistent
    provider: defeatbeta mirror hosted by HuggingFace
    upstream: Yahoo Finance structured statement data
    adapter: defeatbeta_stock_statement
    datasets: [company_financials]
    cadence: snapshot
    retention: query_slice
    internal_request_budget: {concurrency: 1, slices_per_entity_run: 1, timeout_seconds: 60}
  yfinance_financials:
    # Promoted from the legacy fundamentals reader strictly for low-frequency
    # financial statement gaps.  Prices, OHLCV, options and quote metadata remain
    # runtime-only under yfinance_market / yfinance_options below.
    catalog_status: current_partial
    persistence: persistent
    provider: Yahoo Finance via yfinance
    adapter: yfinance_financials
    datasets: [company_financials]
    cadence: event
    retention: query_slice
    internal_request_budget: {concurrency: 1, min_interval_seconds: 1, timeout_seconds: 30}
  yfinance_consensus:
    catalog_status: current_partial
    persistence: persistent
    provider: Yahoo Finance via yfinance
    adapter: consensus
    datasets: [market_consensus]
    cadence: event_snapshot
    retention: normalized_snapshot
    internal_request_budget: {concurrency: 1, min_interval_seconds: 1, timeout_seconds: 30}
  accepted_document_evidence:
    # The evidence workbench remains available for a future approved source, but
    # no private-company event acquisition or publication is scheduled now.
    catalog_status: deferred
    persistence: persistent
    provider: accepted document asset layer
    adapter: document_numeric_evidence
    datasets: [private_company_events]
    cadence: event
    retention: evidence_link_only
    internal_request_budget: {concurrency: 1}
  factset_earnings_insight_metrics:
    catalog_status: current_partial
    persistence: persistent
    provider: FactSet Earnings Insight
    adapter: factset_earnings_insight
    datasets: [sp500_earnings_insight]
    cadence: weekly
    retention: licensed_internal_research
    internal_request_budget:
      concurrency: 1
      requests_per_run: 1
      timeout_seconds: 60

  # Deliberate non-datasets. These entries must never be scheduled, backfilled or
  # written to the structured repository/artifact store. They have no datasets and
  # use persistence=runtime plus catalog_status=runtime_excluded.
  ibkr_market:
    catalog_status: runtime_excluded
    persistence: runtime
    provider: Interactive Brokers
    adapter: ats.broker
    datasets: []
    excludes: [ticker_price, ohlcv, order_book, option_chain, greeks, implied_volatility]
  yfinance_market:
    catalog_status: runtime_excluded
    persistence: runtime
    provider: Yahoo Finance via yfinance
    adapter: market_data
    datasets: []
    excludes: [ticker_price, ohlcv]
  yfinance_options:
    catalog_status: runtime_excluded
    persistence: runtime
    provider: Yahoo Finance via yfinance
    adapter: options
    datasets: []
    excludes: [option_chain, greeks, implied_volatility]
  thetadata_options:
    catalog_status: runtime_excluded
    persistence: runtime
    provider: ThetaData
    adapter: options
    datasets: []
    excludes: [option_chain, greeks, implied_volatility]

# Business datasets. Source references must be reciprocal with `sources.*.datasets`.
# `quality` values are release gates; do not loosen them merely to make a run pass.
datasets:
  sp500_earnings_insight:
    catalog_status: current_partial
    entities: [SP500, GICS_10, GICS_15, GICS_20, GICS_25, GICS_30,
               GICS_35, GICS_40, GICS_45, GICS_50, GICS_55, GICS_60]
    expected_cadence: weekly
    primary_sources: [factset_earnings_insight_metrics]
    fallback_sources: []
    core_metrics:
      - earnings.reporting.coverage
      - earnings.eps.above_estimate_share
      - earnings.eps.inline_estimate_share
      - earnings.eps.below_estimate_share
      - earnings.revenue.above_estimate_share
      - earnings.revenue.inline_estimate_share
      - earnings.revenue.below_estimate_share
      - earnings.eps.surprise_pct
      - earnings.revenue.surprise_pct
      - earnings.eps.yoy_growth
      - earnings.revenue.yoy_growth
      - earnings.net_profit_margin
      - earnings.margin.increase_share
      - earnings.margin.unchanged_share
      - earnings.margin.decrease_share
      - earnings.guidance.positive_count
      - earnings.guidance.negative_count
      - earnings.revision.improved_sector_count
      - earnings.bottom_up_eps
      - valuation.forward_pe
      - valuation.trailing_pe
      - valuation.forward_pe.average_5y
      - valuation.forward_pe.average_10y
      - valuation.trailing_pe.average_5y
      - valuation.trailing_pe.average_10y
      - revenue.geographic.us_share
      - revenue.geographic.international_share
      - consensus.rating.buy_share
      - consensus.rating.hold_share
      - consensus.rating.sell_share
      - consensus.target.upside
    quality:
      freshness_hours_max: 240
      composition_abs_tolerance: 0.01
      index_core_required_evidence_ratio: 1.0
      sector_core_expected_entities: 11
      sector_core_annotated_cell_accuracy_min: 1.0
      require_concrete_target_period: true
      require_estimate_state: true
      require_unit: true
      required_dimensions_by_metric:
        earnings.revision.improved_sector_count:
          [comparison_date, revision_direction, sector_total]
    acceptance_samples: [SP500, GICS_10, GICS_35, GICS_45]
    rollback_on: [unknown_template, evidence_incomplete, source_conflict,
                  sector_table_incomplete, future_leakage, stale]
  regional_tw_exports:
    catalog_status: current_partial
    entities: [TW_IC_EXPORT]
    expected_cadence: monthly
    primary_sources: [tw_mof_exports]
    core_metrics: [regional.tw_ic_exports.value]
    quality:
      coverage_ratio_min: 1.0
      require_period_continuity: true
      freshness_hours_max: 1488   # 62 days; publication lag is source-specific
      reconciliation_abs_tolerance: 0.000001
      shadow_abs_tolerance: 0.000001
    acceptance_samples: [TW_IC_EXPORT]
    rollback_on: [period_gap, unit_change, shadow_mismatch, stale]
  regional_kr_exports:
    catalog_status: current_partial
    entities: [KR_SEMI_EXPORT]
    expected_cadence: monthly
    primary_sources: [kr_ecos_exports]
    core_metrics: [regional.kr_semiconductor_exports.index]
    quality:
      coverage_ratio_min: 1.0
      require_period_continuity: true
      freshness_hours_max: 1488
      reconciliation_abs_tolerance: 0.000001
      shadow_abs_tolerance: 0.000001
    acceptance_samples: [KR_SEMI_EXPORT]
    rollback_on: [period_gap, unit_change, shadow_mismatch, stale]
  industry_dram_contract_price:
    catalog_status: current_partial
    entities: [DRAM_CONTRACT_PRICE]
    expected_cadence: monthly
    primary_sources: [trendforce_dram]
    core_metrics: [industry.dram_contract_price]
    quality:
      coverage_ratio_min: 0.66
      require_period_continuity: false
      freshness_hours_max: 1488
      # TrendForce labels a half-month market session (for example ``2H Jun``).
      # A page can be fresh while the disclosed session is old; check both.
      source_period_lag_days_max: 90
    rollback_on: [parse_failed, stale]
  company_financials:
    catalog_status: current_partial
    entity_registry: config/entities.yaml
    coverage_from: [config/pead.yaml, config/sectors/ai_hardware.yaml]
    expected_cadence: quarterly_or_issuer_period
    # One report package is selected per entity/reporting period.  The ingestion
    # chain stops at the first complete package, in this availability order;
    # later Provider sources are not used to patch individual fields into that
    # package.  The only controlled exception is an `official_disclosure_bundle`
    # made from SEC Facts + same-entity/same-period issuer IR when both official
    # sources are individually incomplete; each selected field retains its source
    # artifact and any XBRL derivation must be reproducible.  This package-level
    # data gate does not read consumer shadow records or Workflow memory.
    primary_sources: [defeatbeta_stock_statement, yfinance_financials, sec_companyfacts, company_disclosures]
    fallback_sources: []
    core_metrics:
      - financial.revenue.gaap
      - financial.gross_profit.gaap
      - financial.operating_income.gaap
      - financial.net_income.gaap
      - financial.eps.diluted.gaap
      - financial.cash_from_operations.gaap
      - financial.capex.gaap
      - financial.cash_and_equivalents.gaap
      - financial.inventory.gaap
      - financial.total_debt.gaap
      # FCF and margins are governed query-time derivations of the raw core fields
      # above; they must not be counted as missing source observations.
    quality:
      core_metric_coverage_ratio_min: 0.80
      require_period_continuity: true
      freshness_hours_max: 240
      reconciliation_relative_tolerance: 0.001
      shadow_relative_tolerance: 0.001
      pending_mapping_loss_max: 0
    # Explicit operational coverage only.  `MIRROR_MISSING` remains a unit-test
    # negative case, not a company the platform promises to cover.
    acceptance_samples: [AMZN, MSFT, KLAC, TSM]
    rollback_on: [wrong_entity, wrong_period, unit_change, future_leakage, shadow_mismatch]
  market_consensus:
    catalog_status: current_partial
    coverage_from: [config/pead.yaml, config/sectors/ai_hardware.yaml]
    expected_cadence: event_snapshot
    primary_sources: [yfinance_consensus]
    core_metrics:
      - consensus.eps.reported_actual
      - consensus.eps.mean
      - consensus.eps.low
      - consensus.eps.high
      - consensus.revenue.mean
      - consensus.revenue.low
      - consensus.revenue.high
      - consensus.price_target.mean
      - consensus.price_target.median
      - consensus.price_target.low
      - consensus.price_target.high
      - consensus.rating.strong_buy_count
      - consensus.rating.buy_count
      - consensus.rating.hold_count
      - consensus.rating.sell_count
      - consensus.rating.strong_sell_count
      - consensus.rating.change
    quality:
      required_any: [consensus.eps.mean, consensus.revenue.mean, consensus.price_target.mean]
      freshness_hours_max: 168
      require_concrete_target_period: true
      shadow_relative_tolerance: 0.000001
    acceptance_samples: [AMZN, MSFT, KLAC, TSM]
    rollback_on: [target_period_conflict, future_leakage, stale, shadow_mismatch]
  private_company_events:
    # Intentionally empty in this release.  Keep its schema and review workflow
    # registered so a later approved source can be added without a data-model fork.
    catalog_status: deferred
    entities: [OPENAI, ANTHROPIC]
    expected_cadence: event
    primary_sources: [accepted_document_evidence]
    core_metrics: [event.funding.amount, event.valuation.pre_money,
                   event.valuation.post_money, event.valuation.reported, company.arr]
    quality:
      verified_sample_accuracy_min: 1.0
      require_document_version_span: true
      require_human_verification_for_release: true
    acceptance_samples: [OPENAI, ANTHROPIC]
    rollback_on: [evidence_incomplete, unit_unresolved, event_duplicate, sample_error]

# Provider-neutral metrics. An id is a durable contract once observations use it.
# Semantically different GAAP/non-GAAP, point-in-time/period, or raw/derived values
# require separate definitions rather than an ambiguous mapping.
metric_definitions:
  earnings.reporting.coverage: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.eps.above_estimate_share: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.eps.inline_estimate_share: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.eps.below_estimate_share: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.revenue.above_estimate_share: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.revenue.inline_estimate_share: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.revenue.below_estimate_share: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.eps.surprise_pct: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.revenue.surprise_pct: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.eps.yoy_growth: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: [target_quarter, target_year]}
  earnings.revenue.yoy_growth: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: [target_quarter, target_year]}
  earnings.net_profit_margin: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.margin.increase_share: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.margin.unchanged_share: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.margin.decrease_share: {value_type: number, unit_family: ratio, cadence: weekly, period_basis: target_quarter}
  earnings.guidance.positive_count: {value_type: integer, unit_family: count, cadence: weekly, period_basis: target_quarter}
  earnings.guidance.negative_count: {value_type: integer, unit_family: count, cadence: weekly, period_basis: target_quarter}
