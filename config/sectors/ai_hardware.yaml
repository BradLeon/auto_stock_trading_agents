      - {symbol: MRVL, note: 定制 XPU。**光 DSP 与互联收入不在本层命题内**——那部分由 L3 的
                            interconnect_moat_distribution 负责，它已在那条的 cohort 里}
    structure_notes:
      芯片设计: config/knowledge/芯片设计.md
      资本开支链: config/knowledge/资本开支链.md   # 跨层共同因子（见 docs/KNOWLEDGE.md）

    # ── 2026-08-17 新增四条 XPU 命题 ─────────────────────────────────────────
    # 此前本层**一条命题都没有**（L1 只有一只票，不算），而它挂着知识库、有四家标的。
    # 后果与 L6 上一轮同型但规模更大：这四家目前只是**别人命题的证人**（NVDA 在 HBM 供给
    # 里、MRVL 在互联截面里、AVGO 在先进制程里），concept_menu() 给它们的菜单全是关于
    # 别人的维度，于是 761 条读数里 **588 条落在未映射池**：
    #   NVDA 227 条 / 184 未映射（81%）   AMD  223 / 187（84%）
    #   AVGO  75 条 /  62 未映射（83%）   MRVL 236 / 155（66%）
    # 同时 L4 的 moat_pricing 只能由静态长文 + 毛利率给出 —— 正是 docs/CHAIN_EVIDENCE.md
    # 开篇批评的那个状态。
    #
    # ⚠️ 与 L6 的一处**重要差别**：L4 未映射池里有相当比例是纯财务读数（revenue / FCF /
    # 毛利 / 回购 / EPS / 股数）。那些本就该留在 PEAD 打分卡，**不该被任何命题吸收**——
    # 所以 L4 未映射率的合理下限比 L6 高，别拿 L6 的数字当验收线。
    #
    # **命题集 = 知识库的收入分解式**（同 L6 那一轮的纪律）。config/knowledge/芯片设计.md
    # 第十一节把 XPU 层的收入变化拆成：
    #
    #   收入变化 ≈ 部署算力规模 × 每单位算力的 XPU 内容价值 × 该厂商份额
    #              + 系统/软件附加 − 代际交付延期与可达市场约束
    #
    #   部署算力规模与订单节奏 → ① xpu_order_momentum_outpacing_revenue  common
    #   每单位内容价值与毛利   → ② xpu_value_capture_per_capacity        common
    #   代际交付（时点+有效算力）→ ③ xpu_generation_cadence_delivering    common
    #   份额 + 客户归属 + 系统  → ④ xpu_position_distribution             relative
    #   收入的资金来源质量     → ⑤ xpu_revenue_funded_by_customers       common
    #
    # 一一对应保证**没有一项被漏掉、也没有两条命题问同一件事**，后者是这套系统里最贵的
    # 错误（packaging_allocation_pressure / equipment_process_content / asic_external_revenue
    # 三次同款失效）。
    #
    # ⑤ 不在分解式的五项里，它是**乘在整个式子上的质量系数**：同样的收入，客户自有资金
    # 支撑的与厂商垫出来的，持续性不是一回事。首版把它当成 ④ 的一个维度，2026-08-17
    # 首轮判读后拆出来独立成命题——诊断与留痕写在 ④ 被删掉的那一维原位。
    #
    # **刻意不立的三条**（免得以后重复起草）：
    #   ~~市场可达性 / 出口管制命题~~ —— 台账里只有 NVDA（7 条）与 AMD（1 条）说话，
    #     **2 个说话人 < MIN_INDEPENDENT_SPEAKERS=3**，立了永远判 unknown。判据与 L6 那轮
    #     否掉独立光刻命题完全一样。中国与主权敞口降为 ④ 的 xpu_account_and_customer_mix
    #     里的客户结构一维 —— **在那里它反而有区分度**（NVDA 主权收入 +80%、中国 DC 收入
    #     被排除在 outlook 外，对比 AVGO 只有三个客户）。
    #   ~~L4 侧的 ASIC 替代 common 命题~~ —— L2 的 asic_substitution_delivering 已经在问
    #     「自研 ASIC 兑现了没有」（买方视角，common）。供给侧要问的是**订单在四家之间
    #     怎么转移**，那是截面、就是 ④，不是第二条 common。
    #   ~~独立的 XPU 供应锁定命题~~ —— 「对上游的采购承诺/预付/长约」在抽取模型眼里与 L5
    #     的 foundry_node_demand_visibility（**MRVL 已有 7 行落在那里**）语义不可分，新开
    #     一维只会抢同一批行。改为并入 xpu_demand_creation_commitment —— 用资产负债表锁定
    #     **供应**与锁定**需求**本就是同一件事的两半；晶圆/封装口径的读数继续留在 L5。
    #
    # **AMD 此前既不在 targets 也不在 observe**（证据扫描只覆盖这两个名单，见
    # runtime/scheduler.py 的 _observe_window），那 223 条读数不会自动刷新、horizon 一滚
    # 全部过期。与上一轮发现 AMAT 同型，已按同样先例加入 observe 并补 config/pead/AMD.yaml。
    claims:
      # ① 直接回答「什么时点判断该层的投资力度」。形状取自 L2 的
      # cloud_demand_still_accelerating（RPO 增速 vs 自身收入增速），换成 L4 口径：
      # **订单承诺 vs 已出货收入**。AVGO 把这个差直接说出来了——「$30B bookings against
      # the $10.8B we shipped」——book-to-bill 是本层最有信息量的周期读数。
      #
      # 与 L2 那条的边界：它的 demand_conversion 明确写着「不记该公司自身产品线的供需」
      # 并把那部分指向「L5 的命题」，但 L5 没有一条在收加速器级别的订单读数。这条命题
      # 填的就是 L2 显式留下的那个洞。
      # 2026-08-17 首轮判读后收窄：原 statement 还带着「且未被厂商自身的融资安排稀释」
      # 一句，并挂了第三个维度 xpu_demand_creation_commitment。已拆出去独立成命题 ⑤——
      # 理由见 ⑤ 的注释。这条回到只问一件事：**订单节奏**。
      - id: xpu_order_momentum_outpacing_revenue
        kind: common
        statement: 加速器的订单承诺与能见度仍在扩张——承诺增长快于已确认收入
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: xpu_order_visibility
            desc: 加速器的订单承诺与能见度——bookings/backlog、能见度年限、design win 金额、
                  客户 PO，以及已宣布但未交付的部署承诺规模（GW/机架/集群）。
                  **与同期已出货收入的对比是本维度最有信息量的形态**（book-to-bill）。
                  ⛔ 不记网络/交换/光模块的订单（那属于 L3）。
                  ⛔ 不记数据中心与电力容量本身（那属于 L2 的 datacenter_capacity_delivered），
                  只记**加速器**的承诺
            expect_from: [NVDA, AMD, AVGO, MRVL, MSFT, GOOG, AMZN, META, ORCL, SPCX]
          # 需求的**质量**：订单能不能持续，取决于已经买回去的卡有没有在真烧。
          # 与 L2 的 cloud_capacity_constraint 是两件事：那条问「云侧产能够不够」，
          # 这条问「已装机的存量在什么利用水平上」。
          # ⚠️ 首轮实测 7 行（ORCL 与其他买方 5、NVDA 2）。密度偏低但**信息量最高**：
          # 拿到的是"全球 GPU 利用率 97.5%""到期的卡有 49% 的客户续租了其中 92%"
          # 这类只有买方说得出、且直接证伪整条 AI 论点的读数。
          # 若下一轮涨到两位数，**应把它升格成独立 common 命题**（"已部署算力仍在被
          # 充分消耗"）——它现在寄居在订单命题里，是因为单独立一条还撑不住。
          - key: installed_fleet_utilization
            desc: 已装机加速器的利用率、续租率、租金价格与旧世代资产的残值——
                  GPU 利用率、到期续租比例、按小时租金的方向、旧世代是否提前退役。
                  ⛔ 不记云厂"产能受限/需求超过供给"的表述（那属于 L2 的
                  cloud_capacity_constraint）——这里问的是**存量在不在被消耗**，
                  不是增量够不够
            expect_from: [ORCL, MSFT, GOOG, AMZN, SPCX, CRWV, NBIS, NVDA]
        falsifiers:
          - 任一家的 bookings 或能见度年限收缩，或 book-to-bill 掉到 1 以下
          - 租金或利用率下行、续租率下降、旧世代加速器提前退役
          - 买方推迟或缩量已宣布的部署承诺
        # 买方证人是这条命题拿到第二类立场的关键：ORCL 的利用率与续租率、SPCX 的采购
        # 承诺、AMZN 对实验室多年多 GW 承诺的描述，都是供给侧自己不会说的事。
        witnesses:
          - {entity: NVDA, stance: supplier}
          - {entity: AMD,  stance: supplier}
          - {entity: AVGO, stance: supplier}
          - {entity: MRVL, stance: supplier}
          - {entity: MSFT, stance: customer}
          - {entity: GOOG, stance: customer}
          - {entity: AMZN, stance: customer}
          - {entity: META, stance: customer}
          - {entity: ORCL, stance: customer}
          - {entity: SPCX, stance: customer}
          - {entity: CRWV, stance: customer}
          - {entity: NBIS, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}
          - {entity: DOWJONES, stance: regulator}
          - {entity: SEMIANALYSIS, stance: regulator}

      # ② 这条把「轻资产 + 高毛利 ⇒ 该是 AI 主 Beta」从信念变成可证伪的命题。
      # 知识库第二节的核心句：「高终端芯片金额不等于高 L4 利润留存」「高毛利是定价权的
      # 结果；要追问客户为何不能迁移或压价」。
      #
      # 本命题最有价值的证据是 AVGO **同一家给出的两条互相矛盾的读数**：
      #   「content per gigawatt will increase…XPU 价格会大幅上升」
      #   「dollars per gigawatt, dollar billions per gigawatt is relatively stable」
      # 内部张力比单向读数有信息量（同 L6 ① 的 INTC：工具支出指引 +40% 与 PP&E 实际
      # 下降同时出自它自己）。判读时不要挑一条用，要把两条都带上。
      - id: xpu_value_capture_per_capacity
        kind: common
        statement: 每单位部署算力里 XPU 拿到的内容价值与毛利留存仍在上升——未被存储/封装/电力成本挤压
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          # ⚠️ 2026-08-18 大改口径。首版 desc 写的是「单位部署算力里**芯片**拿到多少钱」，
          # 「芯片」两个字同时可以读成"整机 BOM 里的加速器模组"和"XPU 厂商自己收到的钱"，
          # 判读器选了前者，于是把「Helios 比竞品多近 50% HBM」判成了内容价值上升的支持。
          # **那条证据的方向其实是相反的**：HBM 含量更高意味着同一美元机架里更大一块流向
          # 存储厂，在 HBM 涨价周期里，XPU 厂商自己拿到的那一份反而可能被压缩。
          # 下面把这个区分写死，让判读器只需要**分类**，不需要做那三步反向推理。
          - key: xpu_content_per_capacity
            desc: 每 GW / 每机架 / 每集群里，**XPU 厂商自己确认为收入的那一部分**的方向与 ASP。
                  ⚠️ 关键区分：**整机 BOM 的内容量 ≠ XPU 厂商拿到的钱**。
                  "本代产品用了更多 HBM / 更贵的封装 / 更多电源模块"记的是**别人**拿到的钱
                  变多了，它对本维度是**中性甚至反向**的读数（在上游涨价周期里尤其如此），
                  **不要**把它读成本层内容价值上升；只有明确指向本公司**单位算力收入或 ASP**
                  的表述才算正向。
                  买方一侧的资本开支硅含量占比也记这里（"多少比例的 capex 是 CPU/GPU
                  这类短寿命资产"），那是本维度上少有的非自述读数。
                  ⚠️ 但**只有占比的方向变化才算证据，单期静态占比是中性背景**——
                  "约三分之二的 capex 是短寿命资产"是一个水平值，没说它在升还是降。
                  同一次电话会里"已经转向短寿命资产"与"占比约三分之二"讲的是同一件事，
                  不要当成两条独立证据。
                  ⛔ 不记服务器 CPU 的单位与 ASP（EPYC/Vera 这类通用 CPU 不是加速器）。
                  ⛔ 不记网络/光模块的单位内容量（L3）
            expect_from: [NVDA, AMD, AVGO, MRVL, MSFT, GOOG, AMZN, META]
          # ⚠️ 2026-08-18 大改口径。首版只排除了"软件与非 AI 分部毛利"，没排除**合并口径**，
          # 于是「Q3 合并毛利率降至约 74%」进来了并被判成反驳。那个数字的机制是**业务组合
          # 稀释**——高毛利软件业务占比下降、低毛利 AI 半导体占比上升——与"XPU 在单位算力
          # 里的价值捕获"无关。最能说明问题的是：解释这个机制的原话就在同一份纪要里、
          # 同一个维度里、已经抽出来了（"It's the mix... between software and non-AI to the
          # very highly, rapidly growing AI semiconductor that is just diluting gross margin"），
          # 判读器一次看得到全部证据簇，却仍按字面把合并毛利下行判成了反驳。
          # **根子不是它没看见，是这个数字本来就不该进这个维度。** 口径改成正列举。
          - key: xpu_margin_retention
            desc: 只问**加速器业务本身**的毛利率方向及其归因——上游（HBM/晶圆/封装）涨价
                  能否向客户传导、客户是否压价、定制 vs 外售的组合对加速器毛利的影响。
                  ⚠️ 只收能归到加速器口径的读数。以下**一律不算**，即使它们的字面是"毛利率"：
                  公司合并毛利率 / 合并营业利润率；任何**分部级**毛利率或营业利润率
                  （半导体分部、基础设施软件分部等——半导体分部同时含网络、无线与非 AI
                  产品，它的毛利率变化主要由这些产品的组合驱动，与加速器无关）。
                  判据很简单：**这个数字里混进了加速器以外的业务，就不算。**
                  "组合稀释"与"单位价值被挤压"是两回事，混用会把前者误读成后者。
                  厂商自己解释毛利变化来自组合而非定价时，那是**中性背景**，
                  不是对本命题的反驳。
                  ⛔ 不记公司层面的净利/EPS/回购——那些是 PEAD 打分卡的事，不是链式证据
            expect_from: [NVDA, AMD, AVGO, MRVL]
        falsifiers:
          - 每 GW/每机架的芯片内容价值走平或下行，而部署算力仍在增长
          - 存储/封装涨价无法传导，加速器毛利连续两个观察期下行
          - 买方把更多单位算力预算移向电力、存储或系统集成
          - 厂商用降价换取份额（ASP 与出货量方向背离）
        # 2026-08-18 移除 ORCL。它是**算力建设方不是 XPU 提供方**，对"加速器自身的毛利
        # 与单位内容价值"给不出区分性读数，但它会不停地讲**自己的合同经济学**——
        # 「客户预付与自带硬件以相近或更好的利润率获得」「大型项目稳态 ROIC 20%+」——
        # 这些句子反复被抽进本命题的两个维度，讲的却是 ORCL 卖云服务的利润率，
        # 不是加速器的毛利。连续两轮用 desc 排除都没挡住，因为它字面上确实在谈"margin"。
        # 按本文件的老规矩处理：**名单宁短勿长，声明一个说不出区分度的证人只会把覆盖率
        # 的分母做大，看起来更差而并没有更差。** ORCL 仍留在 ①（利用率与续租是它最好的
        # 读数）、④（具名账户）、⑤（谁为加速器出钱），只从这条命题退出。
        witnesses:
          - {entity: NVDA, stance: supplier}
          - {entity: AMD,  stance: supplier}
          - {entity: AVGO, stance: supplier}
          - {entity: MRVL, stance: supplier}
          - {entity: MSFT, stance: customer}
          - {entity: GOOG, stance: customer}
          - {entity: AMZN, stance: customer}
          - {entity: META, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}
          - {entity: DOWJONES, stance: regulator}
          - {entity: SEMIANALYSIS, stance: regulator}

      # ③ 对应知识库第三节（「流片是高成本、低容错的离散事件，一次延期把收入曲线整体
      # 后移」）、第七节 4（迭代速度本身成为壁垒）与第十节（证据等级）。
      # Fabless 没有晶圆厂，所以资本开支不是有信息量的指标——**代际交付时点才是**。
      - id: xpu_generation_cadence_delivering
        kind: common
        statement: 新一代加速器正按公布的年度节奏兑现——量产时点未推迟，且代际的单位任务成本改进在真实负载上兑现
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          # ⚠️ 2026-08-18 补两条方向判据。首轮判读把
          # 「we'll be supply constrained throughout the entire life of Vera Rubin」
          # 判成了**支持**，理由是"供应受限说明需求高于供给"——那是把它当成需求信号读了，
          # 而本维度问的是**交付**。这与 xpu_content_per_capacity 上"多用 HBM = 内容价值
          # 上升"是同一类错：表面读数与它对本命题的含义方向相反。
          - key: xpu_generation_timeline
            desc: 新一代加速器从流片、量产、首出货到爬坡完成的**时点**及其变化
                  （提前 / 按时 / 推迟本身就是读数），以及供应或良率是否限制了已承诺的爬坡。
                  ⚠️ **本维度只问交付，不问需求。** "供应受限 / supply constrained /
                  产能跟不上"是**约束**读数，对本命题是中性偏反向——即使它同时说明需求很强，
                  那份需求信息属于命题 ①，不在这里计分。反过来，"供应已能满足承诺的爬坡"
                  才是正向。
                  **厂商为保障交付而做的上游安排也记这里**——库存、对晶圆/存储/封装供应商
                  的采购承诺与预付款、产能锁定、多年需求展望。但它们是**投入不是结果**：
                  锁产能说明在努力保交付，不等于时点已经兑现，除非同时给出时点未推迟的
                  表述，否则按中性处理。
                  钱付给上游换的是自己能不能出货，与命题 ⑤ 问的「客户那笔钱是谁出的」
                  方向相反，不要混为一谈。
                  ⛔ 不记代工厂自身的节点良率与爬坡（那属于 L5 的 node_yield_progress
                  与 foundry_node_capacity_addition）——这里只记**加速器产品**的时点
            expect_from: [NVDA, AMD, AVGO, MRVL, TSM]
          - key: xpu_effective_performance_delivery
            desc: 代际的**有效算力与单位任务成本**改进——真实负载下的吞吐、每美元 token、
                  每瓦性能、成本下降幅度，以及客户侧能否复现。
                  ⚠️ **峰值 FLOPS 与规格表数字不算兑现**（知识库第六节 1：客户购买的是
                  有效算力与单位任务成本，不是规格表）。只记落到真实负载或单位任务成本
                  上的读数；纯参数对比留空，不要硬套
            expect_from: [NVDA, AMD, AVGO, MRVL, MSFT, GOOG, AMZN, ORCL]
        falsifiers:
          - 任一家推迟量产/出货时点，或供应约束限制了已承诺的爬坡
          - 代际的每 token 成本改进放缓，或客户在真实负载上复现不出厂商声称的改进
          - 出现重流片、良率问题或架构级回退
        # TSM 作 supplier：加速器的量产时点在物理上受它的节点与封装排期约束，它是这条
        # 命题上唯一能对交付时点给出非自述读数的一方。
        witnesses:
          - {entity: NVDA, stance: supplier}
          - {entity: AMD,  stance: supplier}
          - {entity: AVGO, stance: supplier}
          - {entity: MRVL, stance: supplier}
          - {entity: TSM,  stance: supplier}
          - {entity: MSFT, stance: customer}
          - {entity: GOOG, stance: customer}
          - {entity: AMZN, stance: customer}
          - {entity: ORCL, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}
          - {entity: DOWJONES, stance: regulator}
          - {entity: SEMIANALYSIS, stance: regulator}

      # ④ 截面。三个维度全部 direct: true —— relative 命题只在 direct 维度上移动（闸 3），
      # 默认 false，cloud_moat_hard_assets 曾因此 47 条证据出 0 簇。
      #
      # 为什么是这三维、而不是「谁的份额高」：份额分母无人披露（没有一家给出 XPU 单位
      # 出货或美元份额的可比口径），问了只会得到各家自己定义的口径。改问**位置的三个
      # 可观测代理**：具名账户归属、交付形态深度、资产负债表绑定。
      #
      # **代际交付节奏刻意不作为本条的维度**：本期四家都在年度节奏上，那是整层共享的
      # 问题（命题 ③），在这里再开一维只会与 xpu_generation_timeline 抢同一批句子。
      # 若将来出现某一家连续两代延期而同业按时，再把它升为截面维度。
      - id: xpu_position_distribution
        kind: relative
        entities: [NVDA, AMD, AVGO, MRVL]
        feeds_factor: moat_pricing
        statement: XPU 层的结构位置在 NVIDIA / AMD / Broadcom / Marvell 之间如何分布
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          # entity 归属规则见下方长注释——这一维的成败全在它身上。
          - key: xpu_account_and_customer_mix
            desc: 具名客户/AI 实验室的加速器部署归属与**转移方向**（谁拿到哪个账户、
                  独家还是双供、配额比例、下一代是否续用），以及客户结构的广度与集中度
                  （云厂/实验室/主权/企业各占多少、前几大客户占比、新客户导入、
                  受限市场的可达性差异）。
                  ⛔ 不记网络/光互联的客户集中度（那属于 L3 的
                  interconnect_customer_concentration）——这里只问**加速器账户**
            direct: true
            expect_from: [NVDA, AMD, AVGO, MRVL, MSFT, GOOG, AMZN, META, ORCL, SPCX]
          # ⚠️ 首轮抽取实测：**全库只有 4 行**（NVDA 2、AVGO 2，AMD 与 MRVL 各 0）。
          # 保留但列为下一轮的头号复核对象，理由与判据一并留在这里：
          #   · 拿到的那 4 行**正是设计它时想要的对照**——"只卖芯片不做机架"与"全栈"
          #     出现在同一维度上，这不是噪音。
          #   · AMD 的 0 行是**语义竞争的迹象，不是它没说**：它的机架级平台在同一轮里
          #     拿到了 8 行 xpu_generation_timeline。「机架平台已投产、本季度开始出货」
          #     在抽取模型眼里首先是一条**时点**事实，"交付形态"这个抽象没抢过它。
          #     这正是 packaging_allocation_pressure / equipment_process_content 的
          #     早期形态。
          # **下一轮若仍是个位数且 AMD/MRVL 仍为 0，就删掉它**，把交付形态并进
          # xpu_account_and_customer_mix（客户按什么形态采纳，本就是账户归属的一部分），
          # 不要留着它假装在比较。
          - key: xpu_platform_scope
            desc: 交付形态的深度——裸芯片 / 板卡 / 整机架 / 网络与软件打包，各家在系统级
                  交付与软件栈上的投入，以及客户是否按这个形态采纳。
                  这一维天然可比：同一个问题上「只卖芯片、不做机架」与「机架级平台」与
                  「全栈」是三种明确的位置，而不是一条高低轴。
                  **记的是形态本身，不是某一代产品的量产时点**——后者属于命题 ③ 的
                  xpu_generation_timeline。
                  ⛔ 不记网络芯片本身的竞争位置（L3）
            direct: true
            expect_from: [NVDA, AMD, AVGO, MRVL, MSFT, GOOG, AMZN, ORCL]
          # ⚠️ 这里原本还有第三维 xpu_demand_creation_commitment（"谁最依赖用资产负债表
          # 锁定需求"），**2026-08-17 首轮判读后删除**，原因值得完整留痕——它是本文件里
          # 第一次出现的**符号歧义**型失效，与 packaging_allocation_pressure 那类
          # "两个 key 抢同一批句子"是不同的病。
          #
          # 症状：同一批证据、同一份配置，连跑三次得到三个不同的截面答案
          #   （AVGO 强/中/中，MRVL 中/无读数/无读数），而这条命题 feeds moat_pricing，
          #   摆动会一路传到复合排名与权重。
          # 根因：那一维的 9 行读数里塞了**三种符号相反的事实**——
          #   · MRVL 5 行全是对**上游供应商**的预付与产能锁定（保障交付，正向）
          #   · AVGO 3 行全是为**下游客户**设的融资载体（"a vehicle to basically have
          #     these chips funded for these LLM players"，客户付不起、卖方垫，负向）
          #   · ORCL 1 行是客户自付（"customer prepayments and BYOH at similar or
          #     better margins"）——那是这条轴的**对立面**本身
          #   判读器每次都要重新决定这堆混合物算强还是算弱，于是每次结论不同。
          #   最能说明问题的是它写过的一句判词：MRVL"只做上游预付所以偏弱"——
          #   **拿供应保障的证据去比客户融资的位置，那句话本身就是维度错配的证据。**
          # 处理：按符号切成两半，各归各家，一行证据都没丢——
          #   上游锁供应 → 命题 ③ 的 xpu_generation_timeline（desc 已明确接手）
          #   下游垫需求 → 新命题 ⑤ xpu_revenue_funded_by_customers（符号写进 statement）
          # **不在这里保留一个"垫得越多越弱"的维度**：那要在 desc 里人工声明符号，
          # 已经贴近被删掉的 supports_when 反模式；且截面三维只要有一维需要声明符号，
          # 加权就重新变成判读器的自由裁量，摆动会以另一种形式回来。
          # 现在剩下的两维符号都无歧义：覆盖越广越强、交付形态越深越强。
        falsifiers:
          - 某家在具名客户的下一代部署里被替换，或从独家变成双供
          - 某家的客户集中度上升且第一大客户份额扩大，而同业在分散
          - 某家的系统级方案被客户拆解回裸芯片采购
        # ⚠️ **entity 归属规则**，这一维的成败全在它身上：
        #   · 读数说的是「这笔算力用了谁的芯片」→ entity 记**芯片方**。
        #     例：AMD 说某实验室部署 2GW MI450 → entity=AMD（不是那个实验室）。
        #     台账里这条现在记成了 entity=ANTHROPIC，落在 cohort 外、闸 3 直接挡掉，
        #     重抽后会归位。
        #   · 读数说的是客户**自研项目本身**的进展 → entity 记那家客户，那属于 L2 的
        #     custom_silicon_program（云厂的 TPU/Trainium/MTIA 部署与对外收入在那里）。
        # **不把 ANTHROPIC / OPENAI 声明成证人**：它们无票据、永不发声，声明只会造两个
        # 沉默证人并把覆盖率的分母做大——「名单宁短勿长」（L5 命题注释里那条）。
        # 它们说过的话通过芯片方或云厂的财报进来，entity 按上面的规则落到 cohort 内。
        #
        # 买方证人是 AVGO/MRVL 摆脱 100% 自述的唯一出路：台账里关于这两家的读数
        # **非自述为 0 条**（NVDA 11 条、AMD 1 条）。买方点名某家时 entity 落在 cohort 内、
        # speaker 是买方，闸 3 照过，basis 直接从 self_reported 升到 corroborated。
        # 2026-08-18 四家一律 supplier，**刻意不分 incumbent / competitor**。
        # 首版按 L6 ⑤ 的样子写成 NVDA=incumbent、其余=competitor，那是错的：
        # incumbent/competitor 这对标签是**旧的 subject 式命题**留下的化石——它预设了
        # 一个主角、把问题读成「谁在挑战 NVDA」，而截面命题被发明出来正是为了取消主角
        # （见 schemas/chain.py 里 entities 字段那段：sk_hbm_share 之所以被改写，就是因为
        # 「以某家为主体」让它永远只有主体自述、实践上不可证伪）。
        # statement 已经写成中立的「如何分布」，证人表不能把主角再塞回来。
        # 机制上两种写法的 basis 结果相同（每家读数按 entity 分组，各自 1 类立场），
        # 差别在判读器看到的框架——而它会照着框架写理由。
        # ⚠️ L6 的 equipment_position_distribution 仍是 incumbent/competitor 写法，
        # 同一个问题，尚未统一。
        witnesses:
          - {entity: NVDA, stance: supplier}
          - {entity: AMD,  stance: supplier}
          - {entity: AVGO, stance: supplier}
          - {entity: MRVL, stance: supplier}
          - {entity: MSFT, stance: customer}
          - {entity: GOOG, stance: customer}
          - {entity: AMZN, stance: customer}
          - {entity: META, stance: customer}
          - {entity: ORCL, stance: customer}
          - {entity: SPCX, stance: customer}
          - {entity: TSM,  stance: supplier}
          - {entity: TRENDFORCE, stance: regulator}
          - {entity: DOWJONES, stance: regulator}
          - {entity: SEMIANALYSIS, stance: regulator}

      # ⑤ 2026-08-17 由 ④ 的一个维度拆出来独立成命题。它问的是**这笔收入的钱最终由谁出**。
      #
      # 起草 ④ 时我拒绝过给它单立 common 命题，理由是「问『融资性需求创造是否在扩大』，
      # 支持证据每季度自动送上门、反驳证据没人主动披露，支持N/反驳0 实践上不可证伪」。
      # **那个理由对下面这个写法不成立，因为方向反过来了。** 写成多头假设之后：
      #   支持证据 = 客户掏现金、客户预付、自带硬件（ORCL「customer prepayments and
      #              BYOH at similar or better margins」就是现成的一条）
      #   反驳证据 = 每一个新宣布的表外载体、股权、担保（AVGO 的 Apollo/Blackstone
      #              20GW 平台、首期 350 亿就是现成的一条）
      # **两边都有人主动说**，命题才真的可证伪。这正是 L2 capex_funding_quality 的写法，
      # 它的注释里写着「statement 刻意写成多头假设，让证据去证伪它。首次判读即为 mixed
      # （反驳 3 簇），那正是它的价值，不是要回避的结果」。本条大概率同样首判 mixed。
      #
      # **它与 L2 的 capex_funding_quality 天然成对**：那条问「买方的钱从哪来」，这条问
      # 「卖方替买方垫了多少」。两边同时恶化才是系统性信号，只看一边会得出相反结论——
      # 这句话已写进 config/knowledge/芯片设计.md 第八节 A 第 7 条，此前没有命题承接它。
      #
      # **与命题 ③ 的边界是这条命题最容易被搞混的地方，所以两边都写了**：
      # 钱付给**上游**换的是自己能不能出货（保障交付，归 ③ 的 xpu_generation_timeline）；
      # 钱垫给**下游**换的是客户买不买得起（创造需求，归这里）。两者方向相反，
      # 合在一个维度里正是 ④ 那一维被删掉的原因。
      - id: xpu_revenue_funded_by_customers
        kind: common
        statement: XPU 层的收入仍主要由客户自有资金支撑——厂商自身的股权、担保、承购与表外载体未成为订单的实质来源
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          # ⚠️ 2026-08-18 收窄口径。首轮判读时这一维**支持侧的 3 行全部来自 ORCL**，
          # 而且说的是「ORCL 自己的客户预付给 ORCL / 自带硬件」——那是**下一层**的资金
          # 结构（谁出钱买 ORCL 的云服务），不是「谁出钱买 XPU」。ORCL 作为 L4 的
          # customer 立场没错，错的是这批读数答的是另一层的问题：它们的正确落点是
          # L2 的 capex_funding_quality（那条问的就是买方这笔 capex 由谁的钱支撑，
          # ORCL 已在它的证人表里、且被点名为"负债驱动 capex 最典型的一家"）。
          # 结果是本命题在**零家 XPU 厂商发声**的情况下判了 supportive，支持 2 / 反驳 1
          # 正好压在 DECISIVE_MAJORITY_RATIO=2.0 的线上——这个结论不该被当真。
          - key: xpu_order_funding_source
            desc: 问的是**买加速器的这笔钱由谁出**——一端是买方自有现金、买方自筹的债务与
                  股权、买方向 XPU 厂商支付的预付款；另一端是 XPU 厂商提供的股权投资、担保与
                  承购安排、为客户设立的表外融资载体、对客户算力采购的信用支持。
                  方向指的是**XPU 厂商承担比例**的升降，不是绝对金额。
                  买方说「我们的加速器是自己出钱买的」或「由芯片供应商安排融资」时，
                  entity 记那家 **XPU 厂商**——那是本维度上最有价值的非自述读数。
                  ⛔ **只看链条上这一跳：买方 → XPU 厂商。** 买方自己的客户如何付钱给买方
                  一律不记——云厂/新云口中的"客户预付合同""自带硬件（BYOH）""RPO 里多少
                  比例是预付类交易"，讲的是**它自己的客户**在为**它的云服务**出钱，
                  与谁为加速器出钱隔了一层。那些读数属 L2 的 capex_funding_quality。
                  ⛔ 不记 XPU 厂商对**上游供应商**的预付与产能锁定——那是保障交付不是
                  创造需求，方向相反，属命题 ③ 的 xpu_generation_timeline
            expect_from: [NVDA, AMD, AVGO, MRVL, MSFT, GOOG, AMZN, META, ORCL, SPCX, CRWV, NBIS]
        falsifiers:
          - 任一厂商为客户设立或扩大融资载体、提供担保或承购承诺
          - 新增订单中由厂商股权/担保/表外载体支撑的比重上升
          - 客户预付与自带硬件的比例下降
          - 厂商对客户的股权投资出现减值，或被投客户推迟、取消采购
        # 买方证人在这条命题上比在别处更重要：「这笔钱是谁出的」买方最清楚，而且
        # 与 L2 capex_funding_quality 的道理一样——**钱的主人最有资格作证**。
        # 区别是那条只留买方（供应商拿不到客户的资产负债表），这条两边都要：
        # 表外载体与担保安排出现在**卖方**的披露里，客户自付则出现在**买方**的披露里，
        # 两端各说各自看得见的那一半，合起来才是完整的资金来源结构。
        witnesses:
          - {entity: NVDA, stance: supplier}
          - {entity: AMD,  stance: supplier}
          - {entity: AVGO, stance: supplier}
          - {entity: MRVL, stance: supplier}
          - {entity: MSFT, stance: customer}
          - {entity: GOOG, stance: customer}
          - {entity: AMZN, stance: customer}
          - {entity: META, stance: customer}
          - {entity: ORCL, stance: customer}
          - {entity: SPCX, stance: customer}
          - {entity: CRWV, stance: customer}
          - {entity: NBIS, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}
          - {entity: DOWJONES, stance: regulator}
          - {entity: SEMIANALYSIS, stance: regulator}

  - key: L6_memory
    label: L6 存储（HBM/常规DRAM/NAND/HDD）
    legacy_keys: [L5_fab]
    question: 存储周期走到哪了？HBM 产能缺口与涨价是否仍在扩大？
    # 2026-08-20 从 L5_fab 拆出，代工与先进封装分到 L7_foundry_pkg。
    # 拆的判据是**定价机制**：存储是商品化周期品（价格由 bit 供需定、毛利大幅摆动），
    # 代工是产能垄断型服务（价格由卖方定、毛利高且稳）。两者的毛利率差**不来自谁经营得
    # 更好**，来自商业模式——而 z 分会把它读成「台积电的质量因子更强」，一个每周都会
    # 出现的假信号。原 L5_fab 的 30% 还是全表最松的一档 cap，恰好盖住相关性最低的两类资产。
    #
    # **subgroup 是叙述与比较的分组标签，不是 z 分的作用域**（2026-08-20 裁定）：
    # z 分在**整层**统一计算，subgroup 不参与标准化。理由是组内样本太小（HDD 两只、
    # NAND 一只），组内标准化会让 z 分主要反映组内排名，且单样本组恒为 0（_zscores 在
    # 样本 <2 时的退化）。代价是 HDD 与 HBM 的毛利率/增速分布差异会被读成公司间差异——
    # 对冲办法是层级分析师在叙述里按 subgroup 分开讲，不是改标准化口径。
    tickers:
      - {symbol: MU, subgroup: HBM, note: HBM。⚠️ 它同时做 DRAM 与 NAND，
          subgroup 按**主导驱动**归 HBM —— subgroup 是比较用的标签，不是收入拆分}
      - {symbol: HY9H, subgroup: HBM, note: SK海力士/HBM龙头（IBKR法兰克福ADR代码，用户实际持有）}
      - {symbol: SKHY, subgroup: HBM, note: SK海力士 美国ADR（用户同时持有此代码）}
      - {symbol: "000660.KS", subgroup: HBM, note: SK海力士 韩股（参考）}
      - {symbol: "005930.KS", subgroup: HBM, note: 三星/HBM追赶}
      # 2026-08-20 新增。入本层的理由是 ③ 相关簇：**吃同一个存储 bit 周期 beta**，
      # 不是「都是存储」。产能线与工艺不同（② 只在 subgroup 内成立），所以标 subgroup。
      # ⚠️ 与 HBM 的机制联系强弱不同：HBM 单 bit 吃约三倍晶圆、挤占常规 DRAM 产能，
      # 这是同一条产能线上的直接传导；而 NAND/HDD 是另一条产线，联系是「AI 存储需求
      # 外溢」——**那是另一条命题**，本次不立（见 L3_dc_power 的两步法注释）。
      - {symbol: SNDK, subgroup: NAND, note: SanDisk。2025 年从西部数据分拆的纯 NAND}
      - {symbol: STX, subgroup: HDD, note: 希捷。近线 HDD；AI 存储需求外溢的直接承接方。
          ⚠️ AI 数据中心敞口**不是 100%**，z 分里混着非 AI 业务}
      - {symbol: WDC, subgroup: HDD, note: 西部数据（分拆 SanDisk 后为 HDD）。同上，
          ⚠️ AI 敞口不是 100%}
    cohort_extra: []
    structure_notes:
      存储: config/knowledge/HBM存储.md
      资本开支链: config/knowledge/资本开支链.md   # 跨层共同因子（见 docs/KNOWLEDGE.md）
    # ── 新增三只（SNDK/STX/WDC）的命题缺口实测 · 2026-08-20 ────────────────────
    # 文档全部可达（keyed 直取 Q4 FY2026，31k~35k 字符）；读数 SNDK 102 / STX 109 /
    # WDC 95 = **306 条，100% 未映射**——它们不在任何一条 HBM 命题的证人声明里。
    # 内容同样以通用财务条目为主（free_cash_flow / gross_margin / capex / revenue…），
    # 其中 capex 与 incremental_gross_margin 有命题价值：**NAND/HDD 的资本开支纪律**
    # 正是「AI 存储需求外溢是否会被供给追平」的关键读数。
    # 本次**不声明它们为 HBM 命题的证人**：HBM 与 NAND/HDD 是两条产线，把它们塞进
    # hbm_supply_tight 的 expect_from 只会稀释那条命题。外溢是**另一条命题**，
    # 等下一轮用真实读数起草。
    #
    # ⚠️ HBM存储.md 只覆盖 HBM，**不覆盖 NAND/HDD**。kb_review 的①盲区标记会命中
    # 「该层已有 KB，但未覆盖这些名字所属的环节」——**那是预期行为不是误报**。
    # 本次不补笔记：先看两轮读数，再决定值不值得为 NAND/HDD 单写一份判据。
    #
    # ── z 分口径：**层内统一计算，subgroup 不参与标准化**（2026-08-20 裁定）──────
    # 备选方案是组内标准化，否决理由：组内样本太小（HDD 两只、NAND 一只），组内 z 分
    # 主要反映组内排名而不是层内位置，单样本组还会恒为 0（_zscores 在样本 <2 时的退化）。
    #
    # **代价在扩容当天第一轮就出现了，实测记录在此**（2026-08-20，六只新票入表后首跑）：
    #     SNDK  NAND  revG 371.6%  PEG 0.1  → comp  0.83  rank 1  wt 5.2%
    #     MU    HBM   revG 345.7%  PEG 0.1  → comp  0.74  rank 2  wt 8.0%
    #     STX   HDD   revG  48.5%  PEG 0.3  → comp -0.80  rank 5  wt 1.1%
    #     WDC   HDD   revG  43.8%  PEG 0.3  → comp -1.39  rank 6  wt 0.5%
    # 两只 HDD 垫底、权重被压到接近剔除。**但那多半不是「它们更差」，是 HDD 的因子分布
    # 本来就与 HBM 不同**——增速一个数量级之差来自生意形态，不来自谁经营得更好。
    # 这正是层内标准化的已知代价。
    # **对冲办法不是改标准化口径，是层级分析师按 subgroup 分开讲**：跨 subgroup 的排名
    # 先后可能含分组间的分布差异，不得仅凭名次断言跨组优劣（spec 已写死这条）。
    # 若跑两轮后发现这个失真持续到影响判断，再考虑组内标准化——那要先解决单样本组的退化。
    # HBM 主题的证人范围（2026-08-06 人工规定）。身份按 config/entities.yaml 归一：
    # 写 canonical，别名代码（HY9H / 000660.KS）自动折叠，不会被算成额外证人。
    #
    # 入选判据是**能否给出区分性读数**，不是体量。一家只会说"AI 需求很好"的公司，
    # 说的是三家存储厂自己已经说过的话，只增加音量不增加信息 —— 而音量正是去重闸要
    # 压掉的东西。名单宁短勿长：声明一个取不到或说不出区分度的证人，只会把覆盖率的
    # 分母做大，看起来更差而并没有更差。
    #
    # peer       同层竞对，尽量完备。HBM 是三家寡头，这就是全部在产玩家。
    # upstream   直接上游最主要供应商。ASML(EUV/DRAM 节点)、KLA(过程控制) 用户点名；
    #            LRCX 的 TSV 刻蚀是 HBM 堆叠专属工序。AMAT 落选：沉积对 HBM 无专属
    #            读数，它的评论与存储厂自述重复。
    # downstream 直接下游买家。NVDA 用户点名（占 HBM 需求大头）；AMD 的 MI 系列是
    #            真实第二大买家且会明确评论 HBM 供给。AVGO 落选：定制 ASIC 确实吃
    #            HBM，但它对外只给"AI 收入"口径，落不到 HBM 维度上。
    # reference  不计入证人覆盖率。南亚科是唯一没有 HBM 的上市 DRAM 厂，用来把常规
    #            DRAM 信号与 HBM 信号分开 —— HBM 单 bit 吃约三倍晶圆，挤占产能推高
    #            常规 DRAM 价格，是本命题机制的一环。
    # private    未上市、无票据，仅供 LLM 参考。
    #
    # 落选但值得复评（等 downloader 覆盖扫描证明可达后再升）：
    #   6857.T Advantest（HBM 测试是真实瓶颈）、6146.T Disco（堆叠减薄）、
    #   BESI.AS（混合键合，对 HBM4 时点最有区分度）—— 三家都是日/荷股，可达性未验证。
    # 明确不属于本主题：SNDK(NAND)、STX(HDD)。NAND 是不同产线不同工艺，HDD 与 HBM
    #   机制无关；"AI 存储需求外溢到 NAND/HDD"是**另一条命题**，该由归纳引擎自己提。
    witness_roster:
      peer:       [SKHY, "005930.KS", MU]
      upstream:   [ASML, KLAC, LRCX, TSM]
      downstream: [NVDA, AMD, MSFT]
      reference:  ["2408.TW"]
      private:    [CXMT 长鑫存储]
    # 可证伪命题（见 docs/CHAIN_EVIDENCE.md）。人工维护：agent 只能提议，只有人能加。
    # concepts 是「维度」不是指标名——观测按 desc 的语义归属，绝不做字符串匹配。
    # expect_from 声明该维度**该由谁来说**：单份财报只代表自家、且可能选择性披露，
    # 所以交叉验证对象要在定义命题时就写清；声明后"沉默"会显示成缺口而不是中性。
    claims:
      - id: hbm_supply_tight
        kind: common
        statement: HBM 供给持续紧张、需求高于规划产能
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: supply_tightness
            desc: 供给紧张程度——售罄比例、订单能见度、交期长短、是否成为出货瓶颈
            expect_from: [SKHY, MU, "005930.KS", NVDA, AMD, TSM, TRENDFORCE]
          - key: capacity_addition
            desc: 新增产能、扩产节奏与资本开支投放（含 bit 供给增长）
            expect_from: [SKHY, MU, "005930.KS", TSM, TRENDFORCE]
          - key: hbm_demand
            desc: 下游对 HBM 的需求强度、采购计划与瓶颈表述
            expect_from: [NVDA, AMD, MSFT, KR_US_SUMMIT, TRENDFORCE]
          # 2026-08-07 新增。HBM 装到加速卡上必须过 CoWoS/先进封装这一关，所以封装吞吐
          # 是本命题机制里与存储供给并列的另一条链路——它紧，HBM 就到不了客户手上，
          # 无论存储厂产出多少。分开声明是因为两者会背离：存储宽松而封装紧，或反之。
          - key: packaging_throughput
            desc: 先进封装（CoWoS/2.5D/3D）的产能、排期与是否成为出货瓶颈
            expect_from: [TSM, NVDA, AMD]
        # 2026-08-07 补入 AMD / TSM。判据仍是"能否给出区分性读数"：
        #   AMD  MI 系列是第二大 HBM 买家，会明确评论 HBM 供给 → customer
        #   TSM  CoWoS 是 HBM 上板的必经环节，产能与排期由它披露 → supplier
        # ASML/KLAC/LRCX 仍不入列：它们说的是 WFE 订单，对"HBM 此刻紧不紧"只是间接
        # read-through，进来只会稀释而不增加分辨力。
        #
        # 2026-08-13 加 KR_US_SUMMIT：旧金山峰会披露 SK 集团计划五年内向 Nvidia 等供应
        # 7500 亿美元先进存储——这是需求侧的多年承诺，且是政府简报独立确认，不是 SK
        # 自己财报电话会里的自述，stance 用 regulator。
        #
        # 2026-08-13 加 TRENDFORCE（文章类第三方源，见 config/sources.yaml 的
        # article_sources）。三家存储厂各说自己供给多紧，是三个当事人不是交叉印证；
        # TrendForce 在同一周里同时报道三家、且会写出买方抢货与产能分配这类
        # 供给侧自己不会说的事。首轮抓取实测：它对 SKHY/MU/三星共产出 57 条读数，
        # 但当时全部落在未映射池——**因为它没被声明到这条命题上**，
        # concept_menu 只给了它 4 个封装维度。声明即是为了让那批读数有地方落。
        witnesses:
          - {entity: NVDA, stance: customer}
          - {entity: AMD, stance: customer}
          - {entity: MSFT, stance: customer}
          - {entity: SKHY, stance: supplier}
          - {entity: MU, stance: supplier}
          - {entity: "005930.KS", stance: supplier}
          - {entity: TSM, stance: supplier}
          - {entity: KR_US_SUMMIT, stance: regulator}
          - {entity: TRENDFORCE, stance: regulator}
      # 2026-08-07 由 sk_hbm_share 改写为截面比较。原来的形状是"SK Hynix 维持领先"
      # ——一条只有 SK 自己会回答的命题：闸 3 只收「关于主体」的读数，而财报电话会几乎
      # 从不点名竞争对手，于是它永远是 SK 自述 支持N/反驳0，实践上不可证伪。改成问
      # 「这个位置在三家之间怎么分布」，每家的自我披露都算数（算给它自己），不可回答的
      # 问题就变成了可比较的问题。持有其中一家时，这也是更诚实的问法。
      - id: hbm_share_and_pricing_power
        kind: relative                   # kind 只决定怎么聚合（逐家读数 vs 支持/反驳记分）
        entities: [SKHY, MU, "005930.KS"]
        # 这条命题的读数可以进哪个结构因子。省略 = 不进任何因子（仍上周报、仍进行业
        # 分析师的「定价权」块）。可选 moat_pricing / tech_tenor —— 截面一共就这两个
        # 结构因子，而"份额与定价权"正对应 moat_pricing 自身的分解口径。
        feeds_factor: moat_pricing
        statement: HBM 份额与定价权在 SK 海力士 / 美光 / 三星之间如何分布
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: hbm_share
            desc: HBM 市场份额/供货占比及其指引（含"份额将下降/提升"这类表述）
            direct: true
            expect_from: [SKHY, MU, "005930.KS", NVDA, AMD]
          - key: customer_qualification
            desc: 核心客户认证进展——谁通过认证、谁被替代、供应商多元化推进
            direct: true
            expect_from: [SKHY, MU, "005930.KS", NVDA, AMD]
          - key: hbm_pricing
            desc: HBM 价格/ASP 与毛利率走向（定价权的直接读数）
            direct: true
            expect_from: [SKHY, MU, "005930.KS"]
        # 立场表仍然声明：谁自述、谁是竞对、谁是客户。它决定 basis 是"仅自述"还是
        # "有交叉印证"——客户点名某家通过认证，比该家自己宣布重得多。
        witnesses:
          - {entity: SKHY, stance: incumbent}
          - {entity: MU, stance: competitor}
          - {entity: "005930.KS", stance: competitor}
          - {entity: NVDA, stance: customer}
          - {entity: AMD, stance: customer}
        falsifiers:
          - 某家份额指引下修，同时另一家通过其核心客户认证
          - HBM ASP 连续两个观察期下修

      # 2026-08-12 新增。与上面的 hbm_share_and_pricing_power 问的是**不同的问题**：
      # 那条是 relative，问"三家之间谁的定价权更强"（排序）；这条是 common，问
      # "整个 HBM 层的定价权本身还在不在扩张"（真假）——供给紧张（hbm_supply_tight）
      # 不等于还能继续涨价，"售罄但 ASP 走平"是这个子层最常见的误判。
      #
      # 复用 hbm_pricing key（不新建）：一个 concept key 可被多条命题各自声明，
      # corroborate._relevant_concept 逐命题查自己的 concept 表，两条命题共用同一批
      # 观测互不影响——capex_funding_quality/asic_substitution_delivering 已验证过
      # 这个模式，实测 concept 的证据数只会因为多一条命题声明而被更充分地抽取，不会被拆散。
      #
      # 第一方数据审计（2026-08-12）：三家里只有三星给具体 ASP 数字（DRAM 环比+40%），
      # SK 海力士只讲定价机制不给数字（HBM 走年度 LTA，非现货报价——它自己解释了
      # 为什么没有可追踪的周期性价格），美光只给毛利率。**没有一家披露 HBM 专属价格**。
      # 第三方数据审计：TrendForce 免费价格表**没有 HBM 行**（核实过完整品类列表，
      # 只有传统 DDR/LPDDR/GDDR）；免费新闻中心的 HBM 文章是定性叙事（"预计涨价数倍"），
      # 无可追踪的周期性数字；真正的 HBM 报价在付费报告里，拿不到。**不新接源**——
      # 现有 dram_contract_price（挤占机制，SK 海力士自己确认过）已是这个维度上
      # 唯一能拿到的独立读数。
      - id: hbm_pricing_still_expanding
        kind: common
        statement: HBM 的定价权仍在扩张——ASP/合约价仍在上行而非走平
        horizon: {from: 2026-08-01, to: 2027-06-30}
        concepts:
          - key: hbm_pricing
            desc: HBM/存储 ASP、合约价与毛利率的方向——上行/走平/下行。
                  买方对存储成本上升的表述也算——它可能是"价格确实在涨"的佐证，
                  也可能是压价前兆，由判读器按上下文区分（不是配置能预判的方向）。
                  与第三方源 dram_contract_price 共享绑定：传统 DRAM 合约价上行是
                  HBM 挤占产能的佐证，机制见该 adapter 的模块文档
            expect_from: [SKHY, MU, "005930.KS", NVDA, AMD, TRENDFORCE]
        falsifiers:
          - 任一供应商披露 HBM/DRAM ASP 环比走平或下行
          - 客户明确要求降价、缩短订单能见度或下调规格
        # 与 hbm_share_and_pricing_power 用同一套证人（少 MSFT——它在存储成本上
        # 没有可用表述，加了只会制造一个说不出区分度的沉默证人）。
        #
        # 2026-08-13 加 TRENDFORCE。这条命题此前在这个维度上**唯一**的独立读数是
        # dram_contract_price（那张合约价表），而它 observation_type 是 market，
        # 落入 SECONDARY，只贡献权重不贡献立场类。TrendForce 的现货价周报与
        # 「买方以极高价格抢货」这类报道走的是文章通路，逐行判型里会出现
        # reported_actual/guidance，才可能补上第二类立场——注意这取决于模型的
        # 逐行判型，不是配置能保证的（见 config/sources.yaml 里的同一条说明）。
        witnesses:
          - {entity: SKHY, stance: supplier}
          - {entity: MU, stance: supplier}
          - {entity: "005930.KS", stance: supplier}
          - {entity: NVDA, stance: customer}
          - {entity: AMD, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}

      # ── 2026-08-13 新增四条代工/封装命题 ─────────────────────────────────────
      # TSM 此前在本文件里**只是别人命题的证人**（hbm_supply_tight 的 supplier、
      # cloud_demand_still_accelerating 的 supplier），没有一条以它自己为主体的命题。
      # 台账里它有 123 条观测，其中 **66 条落在未映射池**——制程组合、N2 爬坡的毛利
      # 稀释、A14 的 SRAM 良率、COUPE 量产、海外厂稀释，全都没有维度可归。下面四条
      # 命题主要就是给这批读数一个落点。
      #
      # 切分轴：**按产能类型分，不按产品线分**。起草时先按用户提的三条产品线
      # （AI 加速器 / CPU 服务器芯片组 / CPO 光引擎）各立一组，查证后否掉了：
      #   · 台积电官方路线图把 COUPE 分三步——SoIC-X 堆出光引擎裸片（2025 验证完成）、
      #     **2026 起光引擎上 CoWoS interposer 与交换 ASIC 合封**、更远期光引擎直接
      #     与计算芯粒同封。也就是说从 2026 这一步开始，CPO 和 GPU+HBM **吃的是同一
      #     池 CoWoS 中介层产能**（IFTLE 642 标题即 "Integrated CoWoS and COUPE"）。
      #     按产品线各立"缺口方向"命题，两条会永远同向变动，互相稀释。
      #     ⚠️ 未查到的：140k wpm 的 CoWoS 目标里 CPO 与 GPU 各占多少配额，无第一方
      #     拆分。所以只知道"共享池"，不知道"分池比例"——不要在判读时假装知道。
      #   · CPU/服务器芯片组**不单独立命题**：全库对它只有"用台积电 3nm"一句，
      #     无良率、无产能、无订单转移读数（Google Axion 的代工厂连归属都没查到）。
      #     证据密度排序与收入权重排序是反的，立不立命题看前者。它的读数并入下面
      #     的先进制程两条命题即可。
      #
      # 形状：缺口方向 → common（问真假）；竞对位置与订单转移 → relative（问分布）。
      # 良率是**领先指标**、订单转移是**滞后确认**，两者因果相连，所以合在同一条
      # relative 命题里作两个维度，不拆成两条互相稀释的薄命题。
      #
      # 为什么不复用 hbm_supply_tight 的 capacity_addition / supply_tightness：
      # 那两个 key 的语义是**存储 bit 供给**（desc 里写着"含 bit 供给增长"），
      # 晶圆厂产能是另一回事。这正是 cloud_capacity_constraint 当初要单开 key 的
      # 同一个理由——MSFT 的 Azure 产能话术曾因共享 key 被误归进 HBM 命题。
      # packaging_throughput 是唯一**真正同维度**的，所以复用（见下）。
  - key: L7_foundry_pkg
    label: L7 代工与先进封装
    legacy_keys: [L5_fab]
    question: 先进制程与 CoWoS 的产能缺口在扩大还是收敛？三家的技术位置如何分布？
    # 2026-08-20 从 L5_fab 拆出，存储分到 L6_memory（拆的理由写在那一层）。
    tickers:
      - {symbol: TSM, note: 先进制程+CoWoS}
    cohort_extra: []
    structure_notes:
      代工封装: config/knowledge/先进封装代工.md
      资本开支链: config/knowledge/资本开支链.md   # 跨层共同因子（见 docs/KNOWLEDGE.md）
    # ── 命题挂「被判断的主体」所在层，不挂「说话的人」所在层 ──────────────────────
    # 这条规则 2026-08-20 拆层时定死，**下次再动层结构直接引用，不要重吵**。
    # 落到本层：先进制程与先进封装的四条命题判断的是**晶圆厂的产能与技术位置**，所以在这里；
    # 而 hbm_supply_tight 判断的是**HBM 供给**，留在 L6_memory —— 尽管它的
    # packaging_throughput 维度主证人是台积电（本层主体）。封装吞吐只是 HBM 那条供给链路上
    # 的一环：它紧，HBM 就到不了客户手上，无论存储厂产出多少。
    # 推论：**witness_roster 与 expect_from 不随拆层重切**。它们本来就跨层
    # （upstream: [ASML, KLAC, LRCX, TSM] 在拆分前也不是同层公司）。按新层重切是错的——
    # 那会把「谁能作证」偷换成「谁在同一层」。
    claims:
      - id: advanced_node_supply_gap
        kind: common
        statement: 先进制程晶圆的需求仍高于可用产能——缺口在扩大而非收敛
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: foundry_node_utilization
            desc: 先进制程（7nm 及以下）的稼动率、满载/售罄表述、产能分配与排期。
                  台积电的制程收入组合（N2/N3/N5/N7 各占多少、先进制程占晶圆收入比重）
                  也记在这里——组合快速上移是产能被高阶需求挤占的读数。
                  **不记存储 bit 供给**，那属于 hbm_supply_tight
            expect_from: [TSM, "005930.KS", INTC]
          - key: foundry_node_capacity_addition
            desc: 先进制程的新增产能与爬坡节奏——新厂投产时点、节点爬坡进度、
                  资本开支投放方向，以及**爬坡对毛利的稀释幅度**（台积电用它量化
                  N2 与海外厂的爬坡强度，是产能投放规模的间接但可追踪的读数）
            expect_from: [TSM, "005930.KS", INTC, ASML]
          - key: foundry_node_demand_visibility
            desc: 买方对先进制程的需求强度与订单能见度——长约、预付、产能预订、
                  多代产品的节点选择。**只记与先进制程产能相关的表述**，
                  不记该买方自身终端产品的需求好坏
            expect_from: [NVDA, AMD, AVGO, MRVL, "005930.KS"]
        falsifiers:
          - 台积电或三星披露先进制程稼动率下滑、或出现产能空档
          - 先进制程新增产能的投放速度快于买方订单能见度的延长
          - 买方明确表示先进制程产能不再是约束、或转为削减预订
        # ASML 入列的理由与 hbm_supply_tight 里把它排除的理由并不矛盾：那条命题问
        # "HBM 此刻紧不紧"，WFE 订单只是间接 read-through；这条问的是**先进制程产能
        # 本身**，而先进制程产能在物理上约等于 EUV/High-NA 装机量，它的出货与客户
        # 分布是这个维度上最直接的独立读数（现有 INTC 的 4 条也正是出自它）。
        witnesses:
          - {entity: TSM, stance: supplier}
          - {entity: "005930.KS", stance: supplier}
          - {entity: INTC, stance: supplier}
          - {entity: ASML, stance: supplier}
          - {entity: NVDA, stance: customer}
          - {entity: AMD, stance: customer}
          - {entity: AVGO, stance: customer}
          - {entity: MRVL, stance: customer}

      # ⚠️ 2026-08-13 首轮判读暴露过两层问题，改了两次：
      #   ① 漏声明：INTC/三星只写进了 packaging_capacity_addition 的 expect_from，
      #     没进证人表——判读器拿不到"它们是供给侧同行"这个信号，只能凭常识现推，
      #     推成了"它们是台积电的竞争对手，与本命题无关"。common 命题问的是**行业
      #     供给缺口本身**，不是"以谁为主角、谁在挑战它"——所有代工/封装厂都是
      #     同一视角的供给侧证人，一律 supplier，不分 incumbent/competitor（那两个
      #     立场只在 relative 命题里有意义，因为那里的问题就是"谁相对谁"）。
      #     hbm_supply_tight 与 advanced_node_supply_gap 已经是这么做的，这条当初
      #     漏声明纯属疏忽。补声明后支持簇 2→3，但 INTC 仍全部判中性。
      #   ② 补完证人表后问题仍在，根子是 statement 点了"CoWoS"这个台积电自家商标——
      #     判读器据此技术性地认定"EMIB 与 CoWoS 非同一产能池，不算证据"，单独看
      #     没错，但把命题的意图收窄成了"台积电 CoWoS 专属缺口"，而这条命题的本意
      #     是"先进逻辑芯片封装（不分技术路线）整体是否仍供不应求"——不同方案服务
      #     同一个行业需求，EMIB 积压也是"封装这个环节整体仍紧"的佐证。改成不点名
      #     商标的措辞，把"谁的技术路线更强"完全留给下面的 relative 命题去问。
      - id: advanced_packaging_supply_gap
        kind: common
        statement: 先进逻辑芯片封装（不分技术路线）的需求仍高于可用产能——缺口在扩大而非收敛
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          # 复用 hbm_supply_tight 的 key，不新建：那里问的是"封装紧不紧会不会卡住
          # HBM 上板"，这里问的是"封装缺口本身的方向"，**同一个维度、两个问题**，
          # 正是 hbm_pricing / custom_silicon_program 已验证过的共享模式。
          - key: packaging_throughput
            desc: 先进逻辑芯片封装（CoWoS/EMIB/CoPoS 等 2.5D/3D 方案，不论哪家哪种
                  技术路线）的产能、排期与是否成为出货瓶颈。**不同技术路线服务的是
                  同一个行业需求**——任一家的产能紧张/积压都算这个环节整体供需的
                  佐证，不要求技术路线相同才算数，"谁的方案更强"是另一条命题的问题。
                  **买方一侧的配额与排期表述也记在这里**（拿到多少产能、是否因封装
                  而非晶圆受限、是否启用第二封装来源）——那是对供给侧自述的非自述印证
            expect_from: [TSM, INTC, "005930.KS", NVDA, AMD, AVGO, MRVL, TRENDFORCE]
          - key: packaging_capacity_addition
            desc: 先进逻辑芯片封装的产能扩张节奏——月产能目标、新封装厂/产线投产
                  时点、外包给 OSAT 的溢出比例（外包扩大既是产能扩张也是自有产能
                  吃紧的读数），以及玻璃基板/面板级等下一代方案的验证与量产时点。
                  同样**不分技术路线**，任一家的扩产/延迟都算行业产能供给的读数。
                  台积电 COUPE/CPO 光引擎的产能表述也记在这里——它 2026 起整合进
                  CoWoS 合封，与 GPU+HBM 消耗同一池中介层产能，不单开维度
            expect_from: [TSM, INTC, "005930.KS", TRENDFORCE]
        # 起草时这里还有第三个维度 packaging_allocation_pressure（买方侧的封装配额），
        # 首轮抽取后删掉：NVDA/AMD/AVGO/MRVL 在它上面**全零**，而同一批公司关于封装的
        # 话全被抽进了 packaging_throughput。两个 concept 在抽取模型眼里语义不可分，
        # 后声明的那个只会抢同一批行——与当初否掉 asic_external_revenue 是同一个毛病。
        # 买方视角没有丢：它并进了 packaging_throughput 的 desc 与 expect_from。
        falsifiers:
          - 任一家先进逻辑芯片封装的稼动率下滑、或下调月产能扩张目标，且无同业顶上
          - 买方表示封装已不再是约束、或封装配额出现富余
          - 外包给 OSAT 的比例下降且自有产能未同步吃紧
        # 2026-08-13 加 TRENDFORCE：stance 用 regulator（同 dram_contract_price 的先例——
        # WitnessStance 枚举没有 market，这个位置是"独立于任何一方的第三方"，不是"当事人
        # 的某一方"，regulator 语义上就是这个坑，observation_type 才是 market）。
        # 独立于台积电/Intel/三星任何一方，是这条命题第一个真正的非自述读数来源。
        # 不进 entities.yaml（同 TW_IC_EXPORT 的先例，是研究机构不是上市公司，不需要
        # 别名折叠或 downloader 路由）；通过 --file 手动喂文档，不走 chain_sources.
        # collect()——TrendForce 这批是新闻稿，不是结构化价格表。
        witnesses:
          - {entity: TSM, stance: supplier}
          - {entity: "005930.KS", stance: supplier}
          - {entity: INTC, stance: supplier}
          - {entity: NVDA, stance: customer}
          - {entity: AMD, stance: customer}
          - {entity: AVGO, stance: customer}
          - {entity: MRVL, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}

      # 下面两条是 relative。cohort 都是 [TSM, 005930.KS, INTC]，但**不合并成一条**：
      # 两个战场的相对位置正好相反——三星在制程上贴得近（2nm 项目赢单同比翻倍、
      # 8nm 及以下满载、先进制程收入占比 2026 过半），在封装上远（CPO turnkey 排到
      # 2029）；Intel 大致相反（18A 良率与 High-NA 首发在前，外部大客户上量未见）。
      # 合成一条只会把这两个方向相反的信号平均成一团糊，而它们的分歧正是要看的东西。
      #
      # 所有维度必须 direct: true——relative 命题只在 direct 维度上移动（闸 3），
      # 默认 false，cloud_moat_hard_assets 曾因此 47 条证据出 0 簇。
      # 为什么产能在这里是 direct、在上面 advanced_node_supply_gap 里却不是：
      # 那边是**行业供给**读数，竞争者扩产推不出"我方失份额"；这里的产能是**被比较
      # 的资产本身**，每家读数各自落进自己那一行。同一个词，两种语义。
      - id: advanced_node_competitive_position
        kind: relative
        entities: [TSM, "005930.KS", INTC]
        feeds_factor: tech_tenor
        statement: 先进制程的技术与量产位置在台积电 / 三星 / 英特尔之间如何分布
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: node_yield_progress
            desc: 各家先进节点的良率与器件性能进展——具体良率数字、SRAM 良率、
                  性能功耗密度对比、爬坡是否顺利。良率是**领先指标**：良率不达标时
                  名义产能不等于可用产能，这是本条命题的因果起点
            direct: true
            expect_from: [TSM, "005930.KS", INTC]
          - key: node_customer_wins
            desc: 先进节点的客户赢单、流片与量产承诺——项目数、订单管线、
                  谁通过认证、谁被替代、是否引入第二代工来源。这是良率进展的
                  **滞后确认**：设计赢单不等于上量承诺，两者要分开记
            direct: true
            expect_from: [TSM, "005930.KS", INTC, NVDA, AMD, AVGO, MRVL, KR_US_SUMMIT]
          - key: node_capacity_buildout
            desc: 各家自身先进制程产能的建设进度与地理布局——新厂投产时点、
                  节点产能规模、海外扩产的成本代价。只记**该家自己的**产能位置，
                  行业总量缺口属于 advanced_node_supply_gap
            direct: true
            expect_from: [TSM, "005930.KS", INTC]
        falsifiers:
          - 三星或英特尔披露先进节点良率达到可量产水平，且拿下具名大客户的上量订单
          - 台积电的节点爬坡时点推迟，或先进制程收入占比停止上移
          - 任一大客户明确将先进节点订单分流至第二代工来源
        # ASML 作 supplier 是这条命题里唯一的非自述读数来源：它会公开说 High-NA 谁先
        # 拿到、谁先上产线——现有 INTC 的 4 条读数全部出自它。
        # NVDA/AMD/AVGO/MRVL 作 customer：订单转移的表述只有买方说才算数，
        # 代工厂自述赢单是**利益相关方自我申报**，basis 低一档。
        # ⚠️ INTC 是 2026-08-13 才注册并进 observe 的，首轮判读时它大概率**三个维度
        # 全零**。那是"还没抓过"不是"没进展"，判读时不要把它读成落后。
        #
        # 2026-08-13 加 KR_US_SUMMIT：2026-07-24 旧金山韩美 AI 峰会的政府简报——三星电子
        # 与博通签 MOU，含 2000 亿美元先进存储供应与 AI 芯片代工合作。这条 entity 记的
        # 是 005930.KS（关于三星），source_entity 是峰会简报本身，不是三星自述——政府
        # 简报 + 双方联合披露，独立性比任一当事方自己说都强，stance 用 regulator
        # （同 TRENDFORCE 的理由：这个位置是"独立于任何一方"，不是"当事人的某一方"）。
        witnesses:
          - {entity: TSM, stance: incumbent}
          - {entity: "005930.KS", stance: competitor}
          - {entity: INTC, stance: competitor}
          - {entity: ASML, stance: supplier}
          - {entity: NVDA, stance: customer}
          - {entity: AMD, stance: customer}
          - {entity: AVGO, stance: customer}
          - {entity: MRVL, stance: customer}
          - {entity: KR_US_SUMMIT, stance: regulator}

      # 不设 feeds_factor：CoWoS 的定价权（晶圆 ASP 向 7nm 靠拢）确实是 moat_pricing
      # 的题中之义，但全库目前**没有一条封装 ASP/毛利的独立读数**——台积电只给公司级
      # 毛利，不拆封装。挂上因子等于让一个没有价格读数的维度去动截面权重。
      # 等真出现封装定价的可追踪读数再补。
      - id: advanced_packaging_competitive_position
        kind: relative
        entities: [TSM, "005930.KS", INTC]
        statement: 先进封装的技术与量产位置在台积电 / 三星 / 英特尔之间如何分布
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: packaging_yield_progress
            desc: 各家**逻辑芯片先进封装**的良率与技术就绪度——EMIB/SoIC/CoWoS/CoPoS
                  等 2.5D/3D 方案的验证与量产时点、玻璃基板与面板级封装的中试进度、
                  光引擎（COUPE 及同类）的量产状态。**时点推迟或提前本身就是读数**。
                  ⛔ 不记存储自身的堆叠与样品进度（HBM3E/HBM4/HBM4E 出货、DRAM 堆叠
                  良率）——那属于 hbm_share_and_pricing_power 的 customer_qualification。
                  首轮判读踩过这个坑：三星凭"行业首个 HBM4E 样品出货"被判为封装领先，
                  但存储堆叠与 CoWoS 级逻辑封装是两个不同战场，混在一起会把一家在
                  存储上的进度读成它在逻辑封装上追上了台积电
            direct: true
            expect_from: [TSM, INTC, "005930.KS", TRENDFORCE]
          - key: packaging_customer_wins
            desc: 逻辑芯片先进封装的客户承诺与订单归属——谁在谁家封装、是否启用第二
                  封装来源、是否有具名客户的试产或转单、封装订单积压的方向。
                  买方一侧的表述权重高于封装方自述。⛔ 同样不记存储客户的认证进展
            direct: true
            expect_from: [TSM, INTC, "005930.KS", NVDA, AVGO, AMD, TRENDFORCE]
        falsifiers:
          - 英特尔或三星的封装方案拿下具名大客户的量产订单（非仅试产/设计合作）
          - 台积电的封装量产时点推迟，或具名客户将封装分流至第二来源
          - 台积电与竞对在封装上转为合作结构（如共建标准/共用基板），
            相对位置的问法本身即失效，需重写命题
        # ⚠️ 起草时明知这条命题**当前几乎是台积电独角戏**：台账里三星 0 条封装读数
        # （它的代工话术全在节点上）、英特尔 0 条（刚注册）。仍然声明，理由与
        # asic_merchant_dependency 当初相同——**声明是为了让下一轮抽取有地方安放，
        # 并让沉默被显式记成缺口而不是中性**。若两轮抽取后三星/英特尔仍全零，
        # 该做的是把 cohort 收窄或废掉这条命题，不是留着它假装在比较。
        # 2026-08-13 加 TRENDFORCE：它专题报过台积电 CoWoS vs Intel EMIB 的横向比较、
        # 以及"GOOG/META 考虑转向 EMIB"这类具名客户动向——relative 命题的两个 direct
        # 维度都是 gate 3 只吃 cohort 内实体，TRENDFORCE 说的事只要 entity 落在
        # TSM/005930.KS/INTC 三家上就能过闸，不需要额外放宽隔离规则。
        witnesses:
          - {entity: TSM, stance: incumbent}
          - {entity: INTC, stance: competitor}
          - {entity: "005930.KS", stance: competitor}
          - {entity: NVDA, stance: customer}
          - {entity: AVGO, stance: customer}
          - {entity: AMD, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}

  - key: L8_equipment
    label: L8 半导体设备
    legacy_keys: [L6_equipment]
    # 2026-08-20 仅更名（原 L6_equipment）：互联与电力各占一层后序号顺延。
    question: 设备订单（WFE）领先指标指向扩产还是收缩？
    tickers:
      - {symbol: ASML, note: EUV 最不可替代}
      - {symbol: AMAT, note: 产品组合最宽（沉积/刻蚀/量测/先进封装），中国敞口最大}
      - {symbol: LRCX, note: 刻蚀/沉积，存储敞口在四家里最高}
      - {symbol: KLAC, note: KLA Corp（正确代码 KLAC，原 KLA 错误）}
    structure_notes:
      半导体设备: config/knowledge/半导体设备.md
      资本开支链: config/knowledge/资本开支链.md   # 跨层共同因子（见 docs/KNOWLEDGE.md）

    # ── 2026-08-15 新增五条设备层命题 ────────────────────────────────────────
    # 此前本层**一条命题都没有**，concept_menu() 对 KLAC/LRCX/AMAT 返回空菜单，
    # 390 条读数只有 1 条被映射（ASML 那 6 个菜单维度全来自 L5、全是关于**别人**的节点）。
    #
    # **命题集 = 知识库的收入分解式。** config/knowledge/半导体设备.md 第一节把设备公司
    # 的收入变化拆成六项，并指出「六项里只有第一项是整层共享的，其余都是个股差异的来源」：
    #
    #   收入变化 ≈ 客户产能扩张 + 制程内容量 + 份额 + 价格与组合 + 存量服务 − 出口与交付约束
    #
    #   客户产能扩张   → ① wfe_cycle_still_expanding        common（唯一能拉到买方的）
    #   制程内容量     → ② process_content_still_rising     common
    #   存量服务       → ③ equipment_service_buffer         common
    #   出口与交付约束 → ④ equipment_market_access_intact   common
    #   份额 + 价格组合 → ⑤ equipment_position_distribution  relative
    #
    # 按分解式一一对应不是修辞：它保证**没有一项被漏掉、也没有两条命题问同一件事**，
    # 而后者是这套系统里最贵的错误（packaging_allocation_pressure 因此被删）。
    #
    # **没有任何一条是"针对持仓"立的。** 起草时曾打算给 ASML 单立一条光刻命题，理由是
    # 「光刻没有可比同业、进不了截面」——逻辑成立，但核对证据后推翻了：光刻强度只有 ASML
    # 一家说话，**1 个说话人**在闸 2 分档规则下直接判 unknown（单一视角需 ≥3 个独立说话人），
    # 立了也永远出不了结论。改为把问题放大成"制程内容量"（命题 ②），光刻降为其中一维，
    # 于是 ASML/KLAC/LRCX 三家都能说话，而 ASML 关心的那件事一条不落。
    # **判据是这个维度有没有 ≥3 个独立说话人，不是"我持有它"，也不是"它有没有同业"。**
    #
    # **刻意不立的两条**（免得以后重复起草）：
    #   ~~独立的先进封装设备命题~~ —— 笔记确认先进封装是增量不是搬家、值得追踪，但 L5 的
    #     packaging_capacity_addition 已在收这批读数（AMAT 那条已映射的行就是证据），
    #     再开会抢同一批行。改放进 ② 的 process_content_intensity——那里问的是**每片晶圆的
    #     内容量**，与 L5 问的**产能**是两件事。
    #   ~~研发强度/花钱守位命题~~ —— 笔记把它改成了复合条件（研发强度↑ + 份额与新品收入未
    #     改善 + 毛利与增量 ROIC↓ 三者同时成立），单个 concept 承载不了这种合取判断，
    #     拆开后每一维又都会与 ⑤ 抢行。留给截面分析师在 moat_pricing 里综合。
    #
    # **LSRCY（Lasertec）与 8035.T（TEL）已于 2026-08-17 移出本层 tickers**：台账零证据、
    # 不在 targets/observe，留在宇宙里只会每周多两次取不到内容的价格快照，并在给行业
    # 分析师的层级表里占两行空位。
    # Lasertec 尤其可惜——`半导体设备.md` 单独点出掩模检测「需求跟着掩模层数与新节点导入走，
    # **不跟着 WFE 总量走**」，是本层唯一与 WFE 不同步的一段，本该是最好的对照组：
    # 它能证伪"整层同涨同跌"。**要加回来的条件是先进 observe 拿到读数**，而不是先放回
    # tickers 里等——后者正是它此前一直零证据的原因。
    claims:
      - id: wfe_cycle_still_expanding
        kind: common
        statement: 晶圆厂设备支出周期仍在上行，且买方的实际采购与设备商的预期一致
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: wfe_spend_outlook
            desc: 设备商对 WFE 总量的预期、修正方向与分部拆分（逻辑/存储/封装各多少）。
                  **买方一侧的设备采购承诺也记在这里**——工具支出的增减、新厂装机时点，
                  以及"用旧工具改造替代新购"这类**反向**表述。
                  ⚠️ 口径：WFE 通常特指**前道**设备，先进封装/组装设备是另一个预算与统计
                  口径。记读数时要带上口径，否则两个不同口径的数字会被当成同一件事比较
            expect_from: [KLAC, LRCX, ASML, AMAT, TSM, INTC, "005930.KS", MU, TRENDFORCE]
          - key: equipment_lead_time_and_coverage
            desc: 交期、订单覆盖率、积压订单与自身产能扩张计划。
                  笔记明确交期与积压是**周期性读数、不构成跨周期护城河**——所以它只出现在
                  这条周期命题里，**不进截面命题**
            expect_from: [ASML, KLAC, LRCX, AMAT]
        falsifiers:
          - 任一设备商下修 WFE 总量预期，或买方下修工具支出
          - 买方转向工具复用/改造而非新购
          - 交期缩短且订单覆盖率同步下降
        # 这是五条里**唯一能拿到 2 类立场的**：买方读数已在库且双向——
        # INTC「2026 工具支出 +40%」vs 台积电「把 5nm 工具改成 3nm」（复用而非新购，是真证伪）。
        # ⚠️ 那两条现已映射到 L5 的 foundry_node_capacity_addition / capacity_addition。
        # **不新开买方维度**，靠上面 desc 与 expect_from 把它们引到这里——
        # 与 packaging_throughput 已验证的做法一致。
        witnesses:
          - {entity: ASML, stance: supplier}
          - {entity: KLAC, stance: supplier}
          - {entity: LRCX, stance: supplier}
          - {entity: AMAT, stance: supplier}
          - {entity: TSM, stance: customer}
          - {entity: INTC, stance: customer}
          - {entity: "005930.KS", stance: customer}
          - {entity: MU, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}

      - id: process_content_still_rising
        kind: common
        statement: 单位晶圆/单位堆叠的设备内容量仍在上升——技术迁移带来的是净增加，不是步骤替代
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: process_content_intensity
            desc: 每片晶圆或每层堆叠需要的本公司工序内容量、新工序的导入、
                  SAM per wafer 的变化，以及**先进封装带来的新增工序**（混合键合、临时键合、
                  减薄、翘曲控制、面板级）。这里问的是**每片晶圆的内容量**，
                  ⛔ 不是产能——产能属于 L5 的 packaging_capacity_addition
            expect_from: [LRCX, KLAC, AMAT, ASML, TSM, "005930.KS"]
          - key: litho_intensity_trend
            desc: 光刻层数与强度的方向（每代节点用多少 EUV 层、光刻强度是升是降），
                  以及**客户用多重曝光等手段绕过最新一代光刻的迹象**。
                  ⛔ 不记客户的节点良率与量产进度，那属于 L5 的 node_yield_progress
            expect_from: [ASML, TSM, INTC, "005930.KS"]
        falsifiers:
          - 某代节点的工序步骤被合并或替代，导致净内容量下降
          - 客户用多重曝光持续替代最新一代光刻
          - 先进封装的增量被前道的减量抵消
        # 对应笔记第三节改写后的判据：「**不是每道工序每一代都单调上升**」——
        # EUV 单次曝光可替代多次 DUV 图形化，反而减少部分沉积/刻蚀/清洗步骤。
        # 所以这条是可证伪的，而不是"节点越小设备越好"的同义反复。
        witnesses:
          - {entity: ASML, stance: supplier}
          - {entity: KLAC, stance: supplier}
          - {entity: LRCX, stance: supplier}
          - {entity: AMAT, stance: supplier}
          - {entity: TSM, stance: customer}
          - {entity: "005930.KS", stance: customer}
          - {entity: TRENDFORCE, stance: regulator}

      - id: equipment_service_buffer
        kind: common
        statement: 服务与装机量收入正在提供跨周期缓冲——它的增速不随系统销售的周期同步回落
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: equipment_service_mix
            desc: 服务/备件/装机量管理收入的规模、增速与占比方向，
                  以及它与系统销售增速的**对比**（缓冲成立与否看的是两者的差，不是绝对水平）
            expect_from: [ASML, KLAC, LRCX, AMAT]
          - key: installed_base_upgrade_demand
            desc: 装机基数、装机利用率、升级改造需求与其附加值。
                  已在库：ASML「客户想尽快在现有厂拿到更多产能，创造了很强的升级需求」、
                  LRCX「导电刻蚀装机超 4 万腔体」「Akara 装机每年翻倍」
            expect_from: [ASML, KLAC, LRCX, AMAT]
        falsifiers:
          - 服务收入增速掉到系统销售增速以下
          - 装机利用率或升级改造需求出现下滑表述
          - 客户推迟维护/服务合同续约
        # 把笔记里「**本层最被低估的一条**」变成可追踪的命题——全库此前无任何命题、
        # 任何打分卡覆盖它。四家同为 supplier → 单一立场，但 4 个独立说话人 ≥3，
        # 按 2026-08-15 改档后的闸 2 会出 supportive(self_reported) 而不是卡住。
        witnesses:
          - {entity: ASML, stance: supplier}
          - {entity: KLAC, stance: supplier}
          - {entity: LRCX, stance: supplier}
          - {entity: AMAT, stance: supplier}
          - {entity: TRENDFORCE, stance: regulator}

      - id: equipment_market_access_intact
        kind: common
        statement: 出口管制与市场可达性尚未成为设备收入的实质约束
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: equipment_market_access
            desc: 受限市场（尤其中国区）的收入占比与方向、出口许可的变化、特定客户的可达性，
                  以及**竞争对手能否进入本公司进不去的市场**——可达性差异本身就是份额变化
                  的来源（KLAC 那句「竞争对手能出货到我们进不去的中国晶圆厂」是这个维度上
                  最有区分度的读数）
            expect_from: [ASML, LRCX, AMAT, KLAC, TRENDFORCE]
        falsifiers:
          - 任一家披露受限市场收入占比下滑且归因于许可变化
          - 出现新的管制范围扩大或许可撤销
          - 某家因可达性差异丢掉具名客户或具名订单
        # 对应笔记第五节新增的风险时间尺度表，核心句：
        # 「**护城河可以完全没变，收入仍可能因为出口许可或客户资本开支在一个季度内下降。
        #   不能用"护城河衰退慢"推导"盈利风险也慢"**。」这是旧版笔记完全没有的轴。
        #
        # **单 concept 是刻意的**：交付约束本可以单开一维，但它与命题 ① 的
        # equipment_lead_time_and_coverage 在抽取模型眼里语义不可分，后声明的那个只会抢
        # 同一批行——与被删掉的 packaging_allocation_pressure 同一个毛病。
        # 单 concept 有先例（hbm_pricing_still_expanding），且 4 个说话人足够过簇数门槛。
        witnesses:
          - {entity: ASML, stance: supplier}
          - {entity: KLAC, stance: supplier}
          - {entity: LRCX, stance: supplier}
          - {entity: AMAT, stance: supplier}
          - {entity: TRENDFORCE, stance: regulator}

      # 截面。四个维度全部 direct: true——relative 命题只在 direct 维度上移动（闸 3）。
      # 维度的**排序**按新版笔记调整过：旧版说「存储/逻辑两个周期不同步，这往往是本层截面
      # 区分度的主要来源」，新版加了限定——同一终端需求同时拉动两侧时两个周期会**阶段性
      # 同步**，此时区分度更多来自份额与制程内容量。当下正是这种同步期。
      - id: equipment_position_distribution
        kind: relative
        entities: [ASML, KLAC, LRCX, AMAT]
        feeds_factor: moat_pricing
        statement: 设备层的结构位置在 ASML / KLA / Lam / AMAT 之间如何分布
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: equipment_share_and_intensity
            desc: SAM 占 WFE 的比重、份额的稳定性、新节点导入时是否仍拿到 POR/量产认证。
                  这是笔记里 recipe 绑定深度的**可观测代理**（长期稳中有升本身就是绑定
                  有效的证据）。已在库：LRCX「SAM 已到 WFE 的 36.5%、目标高 30%」、
                  KLAC「是最接近对手的 6 倍」
            direct: true
            expect_from: [ASML, KLAC, LRCX, AMAT]
          # ⚠️ 这里原本还有一个 equipment_process_content（逐家的净内容量比较），
          # 首轮抽取后删除：**全库只抽到 2 行**（只有 LRCX，其余三家 0），而命题 ② 的
          # process_content_intensity 拿到 27 行。两个 concept 在抽取模型眼里语义不可分，
          # "行业整体的内容量趋势"与"逐家的内容量比较"用的是同一批句子，后声明的那个
          # 抢不过——与被删掉的 packaging_allocation_pressure 同一个毛病。
          # 起草时明明在注释里写了"与命题 ② 同源"，还是造了这个重复维度，留痕备戒。
          # 逐家的内容量差异没有丢：SAM per wafer 这类读数会落进下面的
          # equipment_share_and_intensity（份额与内容量本就是同一个问题的两面）。
          - key: equipment_segment_exposure
            desc: 存储/逻辑/先进封装的收入敞口及其方向。
                  ⚠️ **同一终端需求同时拉动存储与逻辑两侧时，两个周期会阶段性同步，
                  此时本维度的区分度会明显下降**——四家敞口相似**不等于**没有差异，
                  差异在上面两个维度里。判读时不要把"敞口接近"读成"位置相同"
            direct: true
            expect_from: [ASML, KLAC, LRCX, AMAT]
          - key: equipment_service_mix
            desc: 服务/备件/装机量收入的占比与增速——逐家比较。
                  笔记判据 3：服务占比越高，周期性打折应该越小
            direct: true
            expect_from: [ASML, KLAC, LRCX, AMAT]
        falsifiers:
          - 某家的工序被第二条技术路线绕开
          - 某家在新节点导入时未被选中（丢 POR）
          - 某家服务占比持续低于同业，且系统销售同步回落
        # equipment_service_mix 复用命题 ③ 的 key：一个 key 可被多条命题各自声明，
        # 且 direct 是**逐命题**的——③ 里非 direct（那是行业级问真假），这里 direct
        # （逐家比较）。同 capacity_addition 与 datacenter_capacity_delivered 的先例：
        # 同一个词，两种语义。
        # 2026-08-18 四家一律 supplier，与 L4 的 xpu_position_distribution 统一。
        # incumbent/competitor 这对标签是**旧 subject 式命题留下的化石**：它预设一个主角、
        # 把问题读成「谁在挑战 ASML」，而截面命题被发明出来正是为了取消主角
        # （见 schemas/chain.py 的 entities 字段注释：sk_hbm_share 被改写就是因为
        # 「以某家为主体」让它永远只有主体自述、实践上不可证伪）。
        # statement 已经是中立的「如何分布」，证人表不该把主角再塞回来。
        # 机制上 basis 结果相同（读数按 entity 分组，各自 1 类立场），差别在判读器看到的
        # 框架——它会照着框架写理由。L4 改完后实测：理由从「相对 NVDA 明显偏弱」这种
        # 挑战者叙事，变成按维度逐条陈述各家自己的位置。
        witnesses:
          - {entity: ASML, stance: supplier}
          - {entity: KLAC, stance: supplier}
          - {entity: LRCX, stance: supplier}
          - {entity: AMAT, stance: supplier}
          - {entity: TSM, stance: customer}
          - {entity: MU, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}

# 每票轻量快照的抓取策略（限速关键）
snapshot:
  momentum_days: [20, 60]
  consensus_for: pead_targets       # pead_targets | all | none
  sleep_between_tickers: 0.8        # get_info 间隔秒数

# 评审上下文的规模控制
review:
  static_notes_chars: 36000         # 静态合集喂给合成的总上限
  insights_per_ticker: 3
  events_lookback_days: 14
  events_min_triage: 0.6
  dossier_excerpt_chars: 350
