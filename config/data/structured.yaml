# Structured research data catalog and checked-in release baseline.
#
# DEPRECATED ENTRYPOINT (compatibility period): new source/dataset configuration
# starts at config/data/catalog.yaml and its domain/provider files. This file is
# still loaded as the structured legacy overlay; do not create a second source of
# truth by editing it without updating the unified catalog plan.
#
# PURPOSE
# -------
# This is the source of truth for registered structured sources, datasets, metrics,
# Provider mappings, quality gates, and checked-in rollout modes. It does NOT contain
# secrets, does NOT prove that a database currently contains data, and does NOT create
# scheduled jobs. Inspect actual coverage with `ats data catalog/availability`.
#
# SAFE CHANGE RULES
# -----------------
# 1. Add a persistent source under `sources`, reference it from exactly one dataset,
#    register its adapter key in src/ats/structured/runtime_registry.py, and start its
#    checked-in source mode at `legacy`.
# 2. A source that has written ingestion runs, artifacts, observations, or snapshots
#    must not be hard-deleted or renamed. Stop it by rolling its source mode back to
#    `legacy` and remove it from future primary/fallback selection while retaining the
#    source identity for historical lineage.
# 3. Secrets belong in `.env` or the deployment environment, never in this file.
# 4. `cadence` is descriptive metadata used by quality/operations. It is NOT cron.
#    Automated collection currently requires an external scheduler to invoke
#    `ats data ingest`; the existing `ats schedule` command does not schedule these
#    structured sources.
# 5. Source and dataset references are bidirectional: each `sources.<id>.datasets`
#    entry must include a dataset whose `primary_sources` or `fallback_sources` also
#    contains that source id.
#
# TOP-LEVEL SCHEMA
# ----------------
# version                    Config schema version; currently only 1.
# feature_flags              Checked-in source ingestion and consumer read modes.
# allowed_ingestion_statuses Legal terminal states emitted by ingestion runs.
# entities                   Stable non-security entities maintained in this catalog.
# sources                    Provider/runtime source registry and request budgets.
# datasets                   Business datasets, source priority, quality, acceptance.
# metric_definitions         Provider-neutral metric semantics.
# provider_mappings          Provider-native field -> metric id mappings.
# unmapped_policy            Policy for fields whose semantics are unresolved.
# migration_consumers        Persistent/runtime boundaries for existing consumers.
#
# LEGAL STATUS VALUES
# -------------------
# catalog_status:
#   current          implemented and mature capability
#   current_partial  implemented, but coverage/rollout/observation is incomplete
#   planned          registered intent; unified ingestion must reject it
#   deferred         known source/dataset, deliberately postponed
#   runtime_excluded runtime-only input; must never enter structured persistence
# persistence: persistent | runtime
# rollout mode: legacy | shadow | platform | fallback
#
# `catalog_status` is capability maturity. Rollout mode is runtime selection. Actual
# queryability comes from accepted observations. Do not use these concepts as aliases.
#
# PERSISTENT SOURCE SHAPE
# -----------------------
# source_id:
#   catalog_status: current_partial       # one of the values above
#   persistence: persistent               # persistent sources only
#   provider: Human-readable Provider
#   upstream: Optional original upstream  # when host != business source
#   adapter: stable_runtime_adapter_key    # controlled registry key, not import path
#   datasets: [one_dataset_id]             # current unified ingest requires one
#   cadence: monthly                       # descriptive, not a schedule expression
#   retention: query_slice                 # artifact/source retention policy label
#   internal_request_budget:               # internal guardrail, not official QPS
#     concurrency: 1
#     requests_per_run: 1
#     timeout_seconds: 30
#
# DATASET SHAPE
# -------------
# dataset_id:
#   catalog_status: current_partial
#   entities: [OPTIONAL_FIXED_ENTITY]
#   entity_registry: optional/path.yaml
#   coverage_from: [optional/business/config.yaml]
#   expected_cadence: monthly
#   primary_sources: [authoritative_source]
#   fallback_sources: [optional_mirror]
#   core_metrics: [metric.id]
#   quality: {... machine release thresholds ...}
#   acceptance_samples: [representative_entity]
#   rollback_on: [reason_code]
#
# Operational details and field-by-field guidance:
# docs/STRUCTURED_DATA_OPERATIONS.md

version: 1

# Governed raw-capability panel.  Model names are discovered dynamically; these
# entries define the eligible Lab universe and benchmark semantics only.
frontier_ai_capability_registry:
  cohort_version: frontier_ai_flagship_cohort/v1
  labs:
    OPENAI: {label: OpenAI, flagship_rule: general_frontier}
    ANTHROPIC: {label: Anthropic, flagship_rule: general_frontier}
    GOOGLE: {label: Google / Google DeepMind, flagship_rule: general_frontier}
    XAI: {label: xAI, flagship_rule: general_frontier}
    DEEPSEEK: {label: DeepSeek, flagship_rule: general_frontier}
    MOONSHOT: {label: Moonshot / Kimi, flagship_rule: general_frontier}
    TENCENT: {label: Tencent, flagship_rule: general_frontier}
    ZAI: {label: Z.ai / GLM, flagship_rule: general_frontier}
    ALIBABA: {label: Alibaba / Qwen, flagship_rule: general_frontier}
  benchmarks:
    livebench: {method_version: v1, b_eligible: false}
    automationbench_aa: {label: AutomationBench-AA, method_version: aa-v1, b_eligible: false, event_ledger: true}
    terminal_bench_4: {method_version: 4.0, b_eligible: true}
    terminal_bench_science_01: {method_version: 0.1, b_eligible: true}
    scicode: {method_version: v1, b_eligible: true}
    critpt: {method_version: v1, b_eligible: true}
    osworld_2: {method_version: 2.0-partial, b_eligible: false}
    mmmu_pro: {method_version: v1, b_eligible: true}
    toolathlon_verified: {label: Toolathlon Verified, method_version: verified-v1, b_eligible: true, event_ledger: true}
    spreadsheetbench_2: {label: SpreadsheetBench 2, method_version: 2, b_eligible: true, event_ledger: true}
    humanitys_last_exam: {label: Humanity's Last Exam, method_version: v1, b_eligible: true}
  excluded_benchmarks:
    enterpriseops_gym_aa: {reason: replaced_by_toolathlon_verified, historical_only: true}
    frontiermath_erdos: {reason: low_current_discrimination, default_panel: false}
    frontierscience_research: {reason: single_lab_coverage, default_panel: false}
    collective_intelligence: {reason: not_yet_governed, default_panel: false}
    safety_alignment: {reason: not_yet_governed, default_panel: false}

# Checked-in baseline only. Runtime resolution order is:
# environment override -> release overlay -> this section -> default_mode.
# `sources` controls governed data availability and data-layer release. `consumers`
# controls read paths only.  Source release is based on raw/derived data validation;
# it does not wait for Agent or Workflow shadow observation.
feature_flags:
  default_mode: legacy
  sources:
    tw_mof_exports: platform
    kr_ecos_exports: platform
    # This source may collect in the governed layer after isolated acceptance;
    # its own data-only release check still decides whether it can be published.
    trendforce_dram: shadow
    sec_companyfacts: shadow
    company_disclosures: shadow
    defeatbeta_stock_statement: shadow
    yfinance_financials: shadow
    yfinance_consensus: shadow
    # Private-company events are intentionally deferred and therefore do not
    # enter the persistent layer until a later, separately approved scope.
    accepted_document_evidence: legacy
    factset_earnings_insight_doc: shadow
    factset_earnings_insight_metrics: shadow
    # 082826 index acceptance and Macro dual-read are complete; this partition is
    # now the formal governed source for the Macro consumer.
    factset_earnings_insight_index: platform
    # 082826 的八张行业表已经通过独立原图 decoder 与 231/231 golden-cell
    # 比较；consumer 仍须在真实 Sector review 成功后另行切换。
    factset_earnings_insight_sector: platform
    # Economic Index starts as an isolated governed source.  It must pass its
    # own release check before a later explicit platform promotion.
    anthropic_economic_index: legacy
    # The two US adoption sources are the load-bearing axes of the L1 production
    # Observer and have been ingesting on schedule since 2026-09.  Their mode was
    # left at ``legacy`` while only the Anthropic index was promoted through the
    # runtime overlay, which made the checked-in baseline disagree with both the
    # observer it feeds and section 10.2 of STRUCTURED_DATA_OPERATIONS.  Promote
    # the baseline itself so the effective mode no longer depends on an overlay
    # entry that was never written for these two.
    us_census_btos: platform
    rps_genai_adoption: platform
    # Audit-only source: registered and ingesting, but no L1 claim consumes it.
    ons_bics_ai: legacy
    # Ramp starts in shadow until the web-export fixtures and slice-level
    # release gate have passed isolated acceptance.
    ramp_ai_index: shadow
    # OpenRouter Rankings Data API passed fixture/live smoke, offline replay,
    # visualization and L1 report acceptance; publish the source directly.
    openrouter_rankings: platform
    # Frontier AI Labs revenue is released straight to platform once its own
    # isolated end-to-end acceptance (7.1-7.5) passes; until then it only runs
    # under --force in an isolated SQLite/artifact root. There is deliberately
    # no shadow/experimental promotion step after acceptance.
    sacra_public_company_profiles: platform
    tickertrends_public_research: platform
    # Raw capability uses benchmark-maintainer Git/CSV/JSON/HTML routes plus
    # low-frequency policy-gated public structured pages. Paid AA API is never
    # required; policy-blocked or parser-drift slices fail closed. Keep the
    # Real-source acceptance and the full L1 regression gate passed on
    # 2026-09-18. Public benchmark data and the fail-closed official-release
    # supplement are therefore formal platform inputs.
    frontier_ai_capability: platform
    frontier_ai_capability_official_lab: platform
  consumers:
    # A source-level platform mode never bypasses a consumer release gate.  Each
    # direct consumer remains shadow/legacy until its durable release record has a
    # passing assessment; only the explicitly listed platform consumers below have
    # completed that review.
    # 台湾/韩国官方月度出口序列已完成 2026-06/07 的真实 legacy/platform
    # 点位、衍生同比/环比及 Chain observation 等价验收。
    chain_regional: platform
    # Current provider snapshot is accepted with source/known-at lineage; revisions
    # can differ from a prior analyst universe without being a data regression.
    pead_consensus: platform
    # 10.2 validation starts in shadow.  Do not regard the historical platform
    # default as a consumer release until inputs and report output are reconciled.
    sector_consensus: platform
    # The complete context acceptance (including indirect Chain evidence) is recorded
    # in the per-consumer release ledger; unknown evidence remains explicit, not a
    # fabricated data point.
    sector_agent: platform
    # Legacy regional fetch failures were independently checked against the official,
    # governed monthly observations before this consumer release.
    macro_agent: platform
    # MSFT's old DTO became unavailable.  The governed package was independently
    # verified for lineage, FY2026 Q4 period/unit semantics, freshness and the
    # complete PEAD statement contract before this consumer was published.
    pead_fundamentals: platform
    # NVDA Q2 FY2027 isolated legacy/platform comparison retained equal
    # deterministic score/decision behaviour while platform corrected legacy's
    # stale calendar event to the accepted immutable document package.
    pead_graph: platform
    # NVDA 七日窗口已验证：受管 IBKR News（Yahoo 仅在 IBKR 不可达时兜底）
    # 的版本血缘、时效与 monitor 输出均已独立验收。
    pead_monitor: platform
    # Per-company accounting view used by the sector workflow.  It shares PEAD's
    # complete company_financials report package; valuation and beta stay runtime.
    sector_constituent_financials: platform
    # PEAD research reads governed third-party research assets from platform.
    # Its processing lease and insight/event outputs remain Workflow memory.
    # SemiAnalysis previews are explicitly partial; they are not full articles.
    pead_research: platform
    # Actual platform Chain report acceptance passed with explicit no-LLM unknowns.
    # Each cited evidence item has either immutable document/version lineage or a
    # labelled historical evidence snapshot; structured observations are excluded.
    evidence_chain: platform
    # Scheduler has migrated to unified runtime/products/pipeline entrypoints.
    # Its workflow outputs remain in memory, and this shadow mode is not a platform release.
    runtime_scheduler: shadow
    chief_graph: shadow
    # Macro reads the released index partition.
    macro_factset: platform
    # 9.3: the 082826 sector partition passed the independent 231-cell gate and
    # completed its release; Sector may use it only in final top-down synthesis.
    sector_factset: platform
  consumer_sources: {}

# Terminal statuses have distinct operational meaning. In particular,
# not_yet_published, no_coverage, and unreachable must never be merged into "missing".
allowed_ingestion_statuses:
  - succeeded
  - no_change
  - zero_match
  - not_yet_published
  - no_coverage
  - stale
  - unreachable
  - unauthorized
  - not_pdf
  - parse_failed
  - validation_failed
  - partial

