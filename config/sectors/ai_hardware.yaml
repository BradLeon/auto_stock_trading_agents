# AI 硬件行业 — L1-L8 分层定义（sector_analyst 每周评审的宇宙）。
# Seed 自「半导体产业研究合集/AI半导体产业链分析上篇-供应链全貌概览」，需求沿 L1→L8 传导。
# ⚠️ 本文件是行业结构/归属的真源；风险上限统一在 config/risk.yaml，layer key 必须对应。
#
# ════════════════════════════════════════════════════════════════════════════
# 2026-08-20 六层重构为八层。**下面三条是判据本身，再调分层时直接引用，不要重新推导。**
# ════════════════════════════════════════════════════════════════════════════
#
# ① 层同时承担三件事，好的切法要三者同时成立：
#      ⑴ 需求传导链上的一个位置        —— 提示词里的 L1→L8 叙事
#      ⑵ 截面 cohort（z 分的作用域）    —— cross_section.rank_cohort
#      ⑶ 风险预算 / 相关簇单元          —— risk.yaml 的 sector_layer_caps
#    原 L5_fab（台积电 + 存储三巨头）在 ⑵⑶ 上都不成立，原 L3_dc_infra（光/铜/衬底 +
#    电力冷却）同样——那一层的 structure_notes 早就配了四份不同的判据笔记，
#    它事实上已经是四个 cohort，只是共用一个 boom_score 和一个 cap。
#
# ② **拆层的判据是「定价机制」，不是「产业环节」。** 产业环节（设计→制造→封测→设备）
#    回答的是「这东西怎么做出来的」，而层要回答的是「这两家放一起比 PEG/毛利率有没有
#    意义」「它们会不会一起跌」。这条链上有四种定价机制：
#      · 产能垄断型服务（卖方定价）      TSM 先进制程     毛利高且稳
#      · 商品化周期品（供需定价）        DRAM/NAND/HDD    毛利大幅摆动
#      · 技术代际替代（溢价窗口）        光模块 1.6T/CPO  毛利随代际起落
#      · 机电装机量（招标/长单）         VRT/ETN/GEV      毛利平稳靠量
#    反例最能说明问题：台积电与美光的毛利率差**不来自谁经营得更好**，来自商业模式，
#    而 z 分会把它读成「台积电的质量因子更强」——一个每周都会出现的假信号。
#
# ③ **层是风险预算与景气判断单元；subgroup 只是叙述与比较的分组标签。**
#    z 分在**整层**统一计算，subgroup 不参与标准化（组内样本太小会退化，见 L6 注释）。
#
# ④ **命题挂「被判断的主体」所在层，不挂「说话的人」所在层**；witness_roster 与
#    expect_from 天然跨层，**不随拆层重切**（详见 L7_foundry_pkg 的注释）。
#
# 拆分前的历史靠各层的 legacy_keys 解析，**旧记录一律不改写**：一行写着 L5_fab 的结论
# 是在「代工+存储」的合并口径下做出的，把它改写成 L6_memory 等于伪造当时的判断范围。

name: ai_hardware
label: AI硬件
sector_etf: SMH
benchmark: QQQ
output_dir: /Users/liuchao/Documents/Obsidian Vault/量化投资/个股分析系统

layers:
  - key: L1_app
    label: L1 AI应用层（Token经济）
    question: 谁在消耗算力？Token 需求是否仍在加速？
    tickers:
      - {symbol: GOOG, note: Gemini（兼属L2）—— A/C 类已在 entities.yaml 归一到 GOOG}
    # xAI 已于 2026-02 并入 SpaceX，后者 2026-05-20 递 S-1、以 SPCX 上市并出财报，
    # 所以它不再是「无票据」——已登记为 entities.yaml 的 SPCX 并进入 L2 各命题的证人表。
    private: [OpenAI, Anthropic]             # 无票据，供 LLM 参考需求侧
    structure_notes:
      Token经济: config/knowledge/Token经济.md
      资本开支链: config/knowledge/资本开支链.md   # 跨层共同因子（见 docs/KNOWLEDGE.md）
    # 2026-08-18 人工新增。此前 docs/KNOWLEDGE.md 写着「L1 不写」，理由是只有一只票、
    # cross_section._zscores 需要 ≥2 个样本——**理由本身没错，但它答的是另一个问题**。
    # 单样本确实让本层的截面 z 分恒为 0，所以这份笔记不改变任何权重；它有两个别的用途：
    #   ① `SectorContext.kb_criteria` 是**各层 structure_notes 的汇总**，sector_analyst
    #      读的是全部九份。L2–L6 的景气叙事最终都挂在「本层能不能把算力卖成链外收入」
    #      上，而此前那个前提**没有任何一份笔记写过**——它只存在于六份研报的散装叙述里。
    #   ② 本层主要玩家未上市（见 private），判读只能靠对手方披露。「怎么读二手证人」
    #      本身就是判据，写在笔记的第四节最后一条。
    # 同时它消掉 chain/kb_review.py 的①盲区标记（has_kb = bool(layer.structure_notes)）。
    #
    # 文件名取「Token经济」而不是「AI应用」是**为了 kb_audit 的越层检测**：那个检测器用
    # `if stem in why` 判断某层的理由里有没有引用它没拿到的笔记，而「AI应用」四个字会在
    # 别层理由里自然出现（「AI应用需求」），会造出一串假阳性。stem 必须够独特。

    # ========================================================================
    # 【需求端草案 · 供给端待定】2026-08-19 设计，**尚未生效**（全文注释）
    # ========================================================================
    # ⚠️ **下面五条是「理想情况下该问什么」，不是最终形态。**
    # 它们完全从「这个行业能不能长期成立」倒推出来，**写的时候没有让取数可行性参与决策**
    # ——这是有意的，先问对问题，再问拿不拿得到。但代价是：**这五条几乎肯定要改。**
    # 取数的形式与时效一旦摸清，至少三个地方会被迫调整：
    #   · **维度要重切。** 拿得到的读数是季度的还是月度的、是水平值还是方向、是自述还是
    #     强制披露，决定了一个 concept 能不能被证据答上。答不上的维度不该留着——
    #     那正是 kb_review 的「④归因失败」（某维度的判读几乎全为 neutral）。
    #   · **证人表要重写。** 现在有一批 expect_from 是**故意留空**的（找不到够格的名字，
    #     填谁都是造沉默证人）。取数落地后要么填上，要么承认这个角度问不了。
    #   · **命题可能要合并或删除。** 若两条最终共用同一批证人和同一批读数，它们就是
    #     一条命题的两种说法，合并；若某条一年也等不到两个独立证据簇，删掉。
    # 所以**不要把这段注释当成待办清单去逐条实现**，它是需求端的记录。
    # 正确的下一步是先做取数（见 config/sources.yaml 末尾「L1 候选源」的实测结果），
    # 再拿真实到手的数据回头改这五条。
    #
    # 刻意不激活的另一个理由：声明一个取不到文档的证人只会把覆盖率的分母做大，
    # 看起来更差而并没有更差（本文件 L2/L4 已各踩过一次）。
    # 每条末尾的「取数缺口」就是激活它之前必须先解决的东西。
    #
    # 起点问题不是「L1 该买哪只票」，而是**这个行业能不能长期成立**。所以五条按三个
    # 相互独立的变量组织，而不是按主题：
    #   A 需求是不是真的（用量与留存）           → ①
    #   B 价值捕获：钱归谁                        → ②
    #   C 支出会不会掉（三条曲线 + 信心 + 能力）  → ③④⑤
    # 之所以要强调「相互独立」：一组直觉上的指标（场景落地、ARR、算力需求、价格、融资）
    # 其实**五个都在测同一个变量**——需求还在不在。需求强时它们同时变绿，看起来是五个
    # 独立确认，实际只有一个。而**五个全绿，行业仍然可能是一门坏生意**：那是光纤的结局
    # ——需求是真的、渗透是真的、用量涨了几个数量级，投资人亏光，因为剩余价值流向了
    # 下游用户而不是基础设施的建设者。②就是为了回答这个而存在的，它是唯一一条能在
    # 其他两组全绿时给出否定答案的命题。
    #
    # ── 三类此前完全缺席的证人（这是第一版设计最大的错，记下来免得重犯）──────────
    # 第一版的证人表**全是云厂和芯片公司，一个 AI Lab、一个应用公司都没有**。理由当时是
    # 「未上市 → 披露是选择性的 → 偏差方向系统性向上」。这个观察没错，但由它推出的做法
    # 错了：**那等于在证人名单里手工重建一道系统已经废掉的闸**。立场多样性在 2026-08-15
    # 从「闸」改成了「档」——单一立场不再否决结论，只是给结论带上 basis=self_reported。
    # 引擎的版本是逐簇加权，我那版是一刀切成零。两个后果：
    #   · **有些事只有它们能说。** 降价是模型公司自己宣布的，云厂不会宣布别人的降价，
    #     媒体是转述。把第一手来源删掉只留回声，然后抱怨这条维度「取数薄」。
    #   · **沉默变得不可见。** expect_from 存在的全部理由就是让沉默显示成缺口而不是中性。
    #     不声明它们，等于宣布「它们不说话是正常的」；而模型公司停止公布定价/ARR/能力
    #     进展，是这条链上信息量最大的事件之一。
    # 现成的先例就在本文件里：asic_substitution_delivering 把 NVDA/AMD 声明为 competitor，
    # 注释写着「它们最有动机否认 ASIC 省钱，所以哪怕只让步一点都是强证据；而它们的
    # 沉默本身也是读数」。这套逻辑原封不动适用于 AI Labs。
    # 于是补三类：
    #   (i)   L1 主体自述（incumbent）：OPENAI / ANTHROPIC / DEEPSEEK
    #   (ii)  确定性序列（regulator）：模型定价、训练算力——**是价目表不是叙事**，
    #         没有解释空间，绕开「信不信它自述」这个问题；不走 LLM 抽取
    #   (iii) 应用层（customer / 被颠覆方）：**回答「天花板」的唯一第一方来源**。
    #         而且它天然分成动机相反的两类——AI 原生应用有动机把渗透说大，按席位收费的
    #         企业软件有动机把替代性说小，**两边都有人说，命题才真的可证伪**。
    #         第一版用「不在本 sector 宇宙里」把这一类糊弄过去了，那是用取数便利定义
    #         问题范围，反了。
