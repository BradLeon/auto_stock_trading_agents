# Freeze-only surface: files the final implementation freeze covers but production
# qualification evidence does NOT bind (see `ats.workflow.assurance_surface`).
#
# Production qualification (config/data/target_dataflow_coverage.yaml
# `required_fingerprint_paths` / `consumer_fingerprint_paths`) binds what the
# production runtime executes plus the data evidence's own verifiers. The files
# here only run while evidence is taken, registered or gated, so a change to one
# does not retire recorded evidence. It does change the freeze: a new freeze
# taken against an older one must dispose of every changed path here
# (`scoped_intake.freeze_snapshot(previous=..., dispositions=...)`).
#
# This file is outside the manifest digest on purpose: registering a new test or
# script must not rewrite the manifest, which would retire every recorded row.
# Moving a path HERE from the manifest still edits the manifest, so demoting a
# runtime file can never dodge drift silently.
