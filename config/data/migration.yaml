# Declarative migration contracts. Runtime manifests record individual runs;
# this file declares the approved domains, source/target assets and safeguards.
version: 1
backup:
  root_env: ATS_DATA_MIGRATION_BACKUP_DIR
  default_root: var/data_migration_backups
  require_verified_copy: true

# A reconciled check without mismatch is sufficient for the initial consumer release.
# Repeated same-day checks remain auditable but do not add new proof.
consumer_cutover:
  minimum_distinct_reconciled_days: 1
  maximum_mismatches: 0

domains:
  - id: structured-governed-history
    source_tables: [structured_artifact_blobs, structured_artifacts, structured_sources, structured_datasets, structured_metrics, structured_provider_mappings, structured_pending_mappings, structured_series, structured_observations, structured_derivations, structured_evidence_links, structured_entities, structured_events, structured_evidence_candidates, structured_evidence_reviews, structured_snapshots, structured_snapshot_items, structured_ingestion_runs, structured_candidates, structured_conflicts, structured_legacy_audits]
    target_owner: ats.data.stores.structured
    target_tables: [structured_artifact_blobs, structured_artifacts, structured_sources, structured_datasets, structured_metrics, structured_provider_mappings, structured_pending_mappings, structured_series, structured_observations, structured_derivations, structured_evidence_links, structured_entities, structured_events, structured_evidence_candidates, structured_evidence_reviews, structured_snapshots, structured_snapshot_items, structured_ingestion_runs, structured_candidates, structured_conflicts, structured_legacy_audits]
    batch_key: [source_id, dataset_id, entity_id, metric_id, period, known_at, content_hash]
    stable_keys: [blob_id, artifact_id, series_id, observation_id, run_id, snapshot_id]
    reconcile: [row_count, stable_key, content_hash, period_vintage, quality_status, lineage, query_result]
    rollback: preserve source SQLite and artifact root; restore target SQLite and artifact backup
  - id: structured-legacy-measurements
    source_tables: [measurement_series, measurement_points, ingestion_runs, data_sources]
    target_owner: ats.data.stores.structured
    target_tables: [structured_series, structured_observations, structured_artifacts, structured_ingestion_runs]
    batch_key: [source_id, series, period, content_hash]
    stable_keys: [series_id, point_id]
    reconcile: [row_count, stable_key, period_vintage, quality_status, lineage, query_result]
    rollback: preserve source tables and restore target backup
  - id: unstructured-documents
    source_tables: [source_documents, document_candidates, document_versions, document_entities, document_source_aliases, document_chunks, document_processing_runs]
    target_owner: ats.data.stores.unstructured
    target_tables: [data_documents, data_document_candidates, data_document_versions, data_document_entities, data_document_aliases, data_document_chunks, data_document_processing_runs]
    batch_key: [document_id, content_hash]
    stable_keys: [document_id, version_id, chunk_id]
    reconcile: [row_count, stable_key, content_hash, lineage, query_result]
    rollback: preserve source tables and restore target backup
  - id: unstructured-evidence
    source_tables: [evidence_observations, evidence_failures, evidence_facts, evidence_fact_projections]
    target_owner: ats.data.stores.unstructured
    target_tables: [data_evidence_observations, data_evidence_failures, data_evidence_facts, data_evidence_projections]
    batch_key: [document_id, fact_id, projection_id]
    stable_keys: [id, fact_id, projection_id]
    reconcile: [row_count, stable_key, content_hash, lineage, query_result]
    rollback: preserve source tables and restore target backup
