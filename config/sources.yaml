# 第三方证据源注册表 —— 不依赖任何公司自述的证据。
#
# 为什么需要它：截至 2026-08-07，两条 L5 命题的证据**全部**来自公司自己的财报纪要。
# 立场多样性闸因此只能在 customer / supplier 之间取得，而这两类都是当事人。海关统计和
# 定价机构不是任何一方当事人 —— 它们提供的 `regulator` 立场是这套系统里最稀缺、也最难
# 被单方叙事污染的证据。
#
# 数据模型不用改：Observation 早就有 observation_type: regulatory|market|research，
# WitnessStance 早就有 regulator，三道闸对它们一视同仁。这里加的只是取数与声明。
#
# --- 字段 -------------------------------------------------------------------
# adapter            取数适配器，对应 src/ats/data/sources/<adapter>.py
# params             传给适配器的参数（各家 API 不同，这一层无法也不该抽象）
# entity             这条事实"关于"什么。非公司实体，用大写下划线以免和 ticker 混淆
# stance             进入立场多样性闸的立场
# observation_type   regulatory（官方统计） | market（价格/成交） | research
# cadence            发布频率，同时也是陈旧判据
# concepts           它有资格说话的维度 —— 绑定发生在维度 key 上，不绑定具体命题，
#                    所以加一个源不用改任何命题，加一条命题也不用改任何源
# direction_from     方向怎么从序列算出来：
#                      yoy          同比 —— 看趋势，滤掉季节性
#                      mom          环比 —— 看拐点，比同比早一步反映转折
#                      level_vs_ma  与移动均值比 —— 看水平偏离
#                    同比同环比可以并列声明，各产出一条观测；一段趋势和一个拐点是两件
#                    不同的事实，合成一个数会把先行信息抹掉。
#
# --- 不做的事 ---------------------------------------------------------------
# 序列不走 LLM 抽取：一串数字没有散文可读，direction 由公式算出、evidence_span 确定性
# 渲染成一行可复核的事实。但**含义仍然交给判读器** —— "出口同比 +32%" 既可能是需求强劲
# 也可能是供给转松，和扩产是同一类问题。引擎算观测，模型判含义，分工不变。
#
# 第三方源**不计入** witnesses_reported 的覆盖率分母（2026-08-07 决定）。那个分母衡量
# 的是"该说话的公司说了没有"，把统计局塞进去会稀释公司的沉默。它们贡献证据簇、立场
# 类别与支持/反驳记分，在报告里单列。

sources:
  kr_semiconductor_exports:
    label: 韩国半导体出口指数（月度）
    adapter: kr_ecos
    params: {stat: "403Y001", item: "3091AA"}      # 수출금액지수 / 반도체
    entity: KR_SEMI_EXPORT
    stance: regulator
    observation_type: regulatory
    cadence: monthly
    concepts: [supply_tightness, hbm_demand]
    direction_from: [yoy, mom]
    # 韩国半导体出口以**存储为主**，而 SK 海力士 + 三星就是它的主体——这条序列测的是这两家
    # 实际出货了什么，而不是它们如何评价自己。韩国银行每月发布，且是指数（2020=100），
    # 所以观测取同比/环比变化而非水平值。
    # 与台湾那条的区别正是"机制"而不是"统计口径"：台湾出口是代工与封装，不是存储。

  tw_ic_exports:
    label: 台湾积体电路出口（月度）
    adapter: tw_mof
    params: {hs_prefix: "8542", metric: export_value_usd}
    entity: TW_IC_EXPORT
    stance: regulator
    observation_type: regulatory
    cadence: monthly
    concepts: [supply_tightness, hbm_demand]
    direction_from: [yoy, mom]
    # 覆盖台积电（CoWoS 封装）与南亚科。和韩国出口并列时能分开"存储紧张"与"封装紧张"，
    # 这正是 hbm_supply_tight 机制里最难靠单家财报分辨的一环。

  dram_contract_price:
    label: DRAM 合约价
    adapter: trendforce
    params:
      items: ["DDR5 8GB SO-DIMM", "DDR4 16Gb 2Gx8", "DDR4 8Gb 1Gx8"]
    entity: DRAM_CONTRACT_PRICE
    stance: regulator
    observation_type: market
    cadence: monthly
    concepts: [hbm_pricing, supply_tightness]
    direction_from: [mom]        # 公开表只给"较上期"，没有历史序列可算同比 —— 只凭一期
                                 # 快照造一个同比就是编造
    # `hbm_pricing` 维度上唯一的独立读数。其余全部是存储厂在描述自己的定价能力，而三家
    # 各说自己 ASP 涨了，是三个当事人，不是交叉印证。
    #
    # 它不是 HBM 价格，为什么仍然对症：HBM 每 bit 吃的晶圆约是常规 DRAM 的三倍，HBM 爬坡
    # 会挤占常规 DRAM 产能、推高其价格——SK 海力士在 Q2 FY2026 电话会上原话就是"常规 DRAM
    # 价格近月大幅上行"。常规合约价上行是挤出效应为真的证据；若 HBM 仍在爬坡而合约价转跌，
    # 那才是反证。
    #
    # observation_type 是 market 不是 regulatory：TrendForce 是定价机构不是官方统计。
    # 注意这让它落入 SECONDARY —— 能参与支持/反驳记分，但**不贡献立场类别**。这是对的：
    # 立场类别是"独立证人"的度量，而一家研究机构的报价不是一个新的经济位置。

# --- 已评估但暂不接入 ---------------------------------------------------------
# （暂无）
