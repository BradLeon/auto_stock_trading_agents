# 证人身份注册表 —— 证人是**公司**，不是代码。
#
# 为什么必须有这张表：SK 海力士在本仓库里有三个代码（SKHY 美股 ADR、HY9H 法兰克福、
# 000660.KS 韩股），三个都指向同一场电话会。若按代码入账，一份纪要会被算成三个"独立
# 证人"，把立场多样性闸（≥2 类证人才能下结论）从内部骗过去 —— 那道闸正是用来防止
# 单一信源自我印证的，被自己的代码别名攻破是最难察觉的一种失效。
#
# canonical  入库时写进 entity / source_entity 的唯一身份
# aliases    折叠到该身份的其它代码（含跨市场挂牌与 ADR）
# name       身份闸用它核对"取回的文档确实提到这家公司"
# market     文档在哪个市场披露 —— 决定 downloader 走哪条取数路径
# filings    该公司**原始文件**的披露地：sec 表示能在 EDGAR 找到，ir 表示只能取投资者
#            关系页/纪要。取不到不是错误，会如实记成缺口。

# ⚠️ 2026-08-13：别名表原本只登记**代码**，因为此前每份文档都是公司自己的财报——
# 公司在自己的电话会里几乎不会用英文全名自称，所以「通俗名」这一类别名从没被用到。
# 接入第三方文章后这个假设失效了：TrendForce 写的是 "SK hynix"、"Micron"、"Samsung"，
# 抽取模型照抄原文，于是 SAMSUNG(12 条) 与 005930.KS(8 条) 被拆成两个实体键——
# 正是本文件开头警告的那种「从内部骗过立场闸」的失效，只是这次走的是通俗名而不是代码。
# 别名是**精确整串匹配**（config.py::_alias_index），所以 "SAMSUNG ELECTRO-MECHANICS"
# 不会被 "SAMSUNG" 误折——那是另一家上市公司。
entities:
  SKHY:
    name: SK hynix
    aliases: [HY9H, "000660.KS", SKHYY, "000660", "SK HYNIX", "SK HYNIX INC"]
    market: KRX
    filings: ir

  "005930.KS":
    name: Samsung Electronics
    # "SAMSUNG ELECTRONICS" 补于 2026-08-13：喂三方新闻（TrendForce/峰会简报）时，
    # LLM 抽取按文中原文写公司全名，不是股票代码——canonical_entity() 现在也在逐条
    # 观测的 entity 字段上生效（见 observer.py extract()），折不到就会开一个新
    # entity 键，任何命题的证人/概念查询都够不着它。
    aliases: [SSNLF, "005930", SMSN, "SAMSUNG ELECTRONICS", SAMSUNG]
    market: KRX
    filings: ir

  # 2026-08-11 补。与 SK 海力士同一类问题：A/C 两类股是同一家公司、同一场电话会、
  # 同一份 10-Q，按代码入账会被算成两个独立证人，并在截面里各拿一份权重——L2 的
  # basket 里 GOOG 排第 4、GOOGL 排第 5，各配 3.6%，等于给 Alphabet 配了 7.2%。
  # canonical 取 GOOG：账户实际持有的是 C 类。
  GOOG:
    name: Alphabet
    # 2026-08-18 补 GOOGLE CLOUD / GCP：第三方文章按业务线称呼，而不是按上市主体。
    # 台账里这个写法有 17 条读数，全部够不着任何命题——corroborate.assess_layer 是
    # **按 entity 取行**的，一个折叠不了的名字等于这批证据不存在。
    aliases: [GOOGL, GOOG.L, ALPHABET, GOOGLE, "GOOGLE CLOUD", GCP]
    market: US
    filings: sec

  # 2026-08-18 新登记。MSFT 此前**根本不在这个注册表里**——它是 observe 名单成员、
  # 是 L2/L4 多条命题的证人，但第三方源写 "MICROSOFT" 时折叠不到 MSFT，18 条读数
  # 因此够不着任何命题。自家财报走 symbol=MSFT 那条路所以一直没暴露这个洞。
  MSFT:
    name: Microsoft
    aliases: [MICROSOFT, "MICROSOFT CORPORATION", AZURE]
    market: US
    filings: sec

  # 2026-08-18 新登记。它在 L2 的 tickers 里（标着 TODO 待确认），既非 target 也非
  # observe，所以没有第一方财报；但它在**别人的**新闻里频繁出现（NVDA 的算力承诺、
  # 实验室的部署去向）。登记只为让这些第三方读数能折叠到一个稳定身份。
  CRWV:
    name: CoreWeave
    aliases: [COREWEAVE, "CORE WEAVE"]
    market: US
    filings: sec

  # 2026-08-18 补。与 CRWV 同类的 neocloud。
  # ⚠️ **这两家的证据价值是有方向性的，不要当成通用买方证人**：它们的机队几乎全绑
  # 英伟达供应链，所以它们说的话对 NVDA 是有力的侧面佐证（客户视角的利用率、租金、
  # 采购与融资安排），但对 ASIC 路线（AVGO/MRVL）参考有限——它们本来就不买定制芯片，
  # 沉默不代表 ASIC 不行。截面判读时要记得这个不对称，别把"neocloud 没提 ASIC"
  # 读成对 ASIC 的反向证据。
  NBIS:
    name: Nebius Group
    aliases: [NEBIUS, "NEBIUS GROUP", YANDEX.NV]
    market: US
    filings: sec

  # 2026-08-12 补。xAI 于 2026-02 并入 SpaceX，后者 2026-05-20 递 S-1、以 SPCX 上市。
  # 登记的两个作用：① 让 xAI/SpaceX 这些名字折叠到同一身份；② 让知识库复核的
  # 「⑤ 陌生实体」不再每周举报它。
  # ⚠️ 它只有 AI/算力分部与 L2 命题相关——星链、星舰、发射业务不属于任何已声明维度，
  # 应当落在未映射池里。核验时要专门看这一条。
  SPCX:
    name: SpaceX
    aliases: [SPACEX, XAI, "SPACE X", STARLINK]
    market: US
    filings: sec

  MU:
    name: Micron Technology
    aliases: [MICRON, "MICRON TECHNOLOGY"]
    market: US
    filings: sec

  NVDA:
    name: NVIDIA
    aliases: [NVIDIA, "NVIDIA CORPORATION"]
    market: US
    filings: sec

  AMD:
    name: Advanced Micro Devices
    aliases: ["ADVANCED MICRO DEVICES"]
    market: US
    filings: sec

  AVGO:
    name: Broadcom
    aliases: [BROADCOM, "BROADCOM INC"]
    market: US
    filings: sec

  TSM:
    name: Taiwan Semiconductor Manufacturing
    aliases: ["2330.TW", TSMC]
    market: TWSE
    filings: sec          # 20-F + 英文法说会纪要

  # 2026-08-13 补。它是先进制程与先进封装两条命题里唯一未注册的 cohort 成员——
  # 台账里关于 Intel 的读数只有 4 条，且全部出自 ASML 之口（High-NA 谁先上量）。
  # 转述能证明"别人怎么看它"，证明不了它自己报的 18A 良率与外部客户进展；
  # 不注册 + 不进 observe，foundry_competitive_position 那两条命题的 Intel 一栏
  # 就会永远空着，而空着会被读成"没进展"，不是"没抓过"。
  INTC:
    name: Intel
    aliases: [INTEL, "INTEL FOUNDRY"]
    market: US
    filings: sec

  # --- L3 光互联/互联层 -------------------------------------------------------
  # 2026-08-14 补。这五家此前**一家都没注册**，而 L3 层马上要立命题。
  # 别名取的是**通俗名**而不是代码，因为踩坑的是第三方散文不是公司自述：
  # TrendForce 写的是 "Lumentum"/"Coherent"/"Credo"，抽取模型照抄原文，
  # 折不到就各开一个新实体键，任何命题都够不着——与上一轮 SAMSUNG 被拆成两个键同型。
  LITE:
    name: Lumentum
    aliases: [LUMENTUM, "LUMENTUM HOLDINGS"]
    market: US
    filings: sec

  COHR:
    name: Coherent
    # II-VI 是合并前的旧名，老文章仍在用
    aliases: [COHERENT, "COHERENT CORP", "II-VI", "II-VI INCORPORATED"]
    market: US
    filings: sec

  CRDO:
    name: Credo Technology
    aliases: [CREDO, "CREDO TECHNOLOGY", "CREDO SEMICONDUCTOR", "CREDO SEMI"]
    market: US
    filings: sec

  MRVL:
    name: Marvell Technology
    aliases: [MARVELL, "MARVELL TECHNOLOGY"]
    market: US
    filings: sec

  # 2026-08-20 canonical 由 AXT 翻转为 **AXTI**。这不是命名偏好，是**修一个静默的取数错误**：
  # 纳斯达克的上市代码就是 AXTI，`AXT` 在行情/基本面源上什么都取不到。实测对照——
  #   AXT   mcap=—     revG=—       GM=—      fwdPE=—     → data_ok=False
  #   AXTI  mcap=4.8B  revG=164.8%  GM=32.2%  fwdPE=33.0  → data_ok=True
  # 后果不是「少一列数」：截面里它每一轮都被判 data_ok=False、排最后、**不参与定权**，
  # 而层级分析师照纪律写「数据缺失，维持持有」——一条对错误输入的正确应用。
  # 同时它也修掉了风控侧的漏计：账户持有的 AXTI 此前显示「未分层」，仓位不计入任何层上限。
  # 修后实测（2026-08-20，net_liq 251,040）：L4 互联层由 4.0% 升到 5.5%，
  # AXTI 从未分层持仓里消失。
  # ⚠️ 市值 4.8B **低于** LIQ_FLOOR_USD(5e9)，会吃流动性折价——那是预期行为。
  AXTI:
    name: AXT Inc
    aliases: [AXT, "AXT INC"]
    market: US
    filings: sec

  ASML:
    name: ASML Holding
    aliases: [ASML.AS, ASMLF]
    market: US
    filings: sec          # 20-F

  KLAC:
    name: KLA
    aliases: [KLA]
    market: US
    filings: sec

  LRCX:
    name: Lam Research
    aliases: []
    market: US
    filings: sec

  # 2026-08-15 补别名。台账里它的 12 条读数全部存在 `APPLIED MATERIALS (AMAT)` 这个
  # 键下——第三方文章（TrendForce）写的是"公司全名 (代码)"，抽取模型照抄原文，而这里
  # aliases 是空的，于是折不回来。后果比 SAMSUNG 那次更彻底：`AMAT` 名下**一条读数都没有**，
  # 把它声明成证人 = 声明一个永远沉默的证人。
  AMAT:
    name: Applied Materials
    aliases: ["APPLIED MATERIALS", "APPLIED MATERIALS (AMAT)"]
    market: US
    filings: sec

