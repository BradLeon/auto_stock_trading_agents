# Application configuration (non-secret). Secrets live in .env.
# Loaded by src/ats/config.py.

environment: live           # paper | live  (switch here when going live)

# --- LLM routing -------------------------------------------------------------
# provider: anthropic (native ChatAnthropic) | openai (OpenAI-compatible via base_url)
llm:
  # OpenRouter relay (OpenAI-compatible) — swap provider/model by editing here.
  default_provider: openai
  default_model: deepseek/deepseek-v4-pro
  # Default structured-output transport is strict JSON Schema. Roles on models that need forced
  # tool calls (the DeepSeek-based ones below) set function_calling explicitly.
  default_structured_output_method: json_schema
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 120
  max_retries: 3
  # Per-role overrides. Omit a role to use the defaults above.
  routing:
    # 2026-10-17 max_tokens / reasoning audit. Reasoning tokens are billed and counted INSIDE max_tokens on
    # OpenRouter's deepseek-v4: measured on layer_rotation (answer ~1.7K tokens) the model spent 8.5-9.3K
    # tokens thinking, hit the 8192 ceiling, returned no tool call, and run_structured retried the identical
    # request 4 times (~$0.09 for nothing). `reasoning: off` removes the hazard for extraction/structuring/
    # classification roles; `reasoning: <n>` caps thinking for weekly judgment roles whose max_tokens already
    # leaves room for cap + answer. Roles left untouched on purpose (changing them retires their cached
    # execution identity, see agents/base.execution_versions): research_extract, context_monitor,
    # fundamental_analyst. The evidence_* roles go to the DeepSeek API directly with thinking disabled.
    industry_analyst: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, max_tokens: 12288}   # PEAD signal-chain read-throughs
    manager: {max_tokens: 12288}            # routing key reused by pead-scorer — real money; no per-role model override, so it runs on default_model
    # --- cheap tier (Gemini Flash): high-volume or extraction-only, no quality loss ---
    news_triage: {model: deepseek/deepseek-v4-flash-0731, temperature: 0.0, max_tokens: 8192, structured_output_method: function_calling, reasoning: "off"}  # 高频头条 triage 打分（gemini-flash 太贵，deepseek-v4-pro ~1/9 输出价、智能相近）
    context_monitor: {model: deepseek/deepseek-v4-flash-0731, max_tokens: 8192, structured_output_method: function_calling}   # PEAD monitor _llm_update（高频；triage 已预筛；deepseek-v4-pro 省钱）
    intel_brief: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, temperature: 0.2, max_tokens: 8192, reasoning: "off"}   # 每日情报 digest：逐票投资要点+方向+中文翻译（嵌套结构化，flash/deepseek 偶发翻空 → 用 sonnet 保证每天出；2026-08-03 验证后换 terra，更便宜且智能指数更高）
    actuals_extract: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, max_tokens: 8192, reasoning: "off"}   # pull reported numbers from transcript/8-K over a large context — gemini-flash flaked (empty tool call → all-zero scorecard); needs a reliable extractor（2026-08-03 换 terra）
    # 2026-10-16 用户指示：原先走 openai/gpt-5.6-terra 的 10 个角色（intel_brief、actuals_extract、claim_proposer、
    # sector_analyst、macro_strategist、pead_analyst、structure_analyst、layer_analyst、layer_rotation、invalidation_check）
    # 统一改为 deepseek/deepseek-v4-pro。原因：OpenRouter 账单显示 10-16 一天 Terra 花了 $6.88（PEAD 准备把整份财务快照
    # 塞进提示词，单次输入近 20 万 token）。以下各角色行内旧注释里的 Terra 选型理由是历史记录，不再生效。
    # 风险（需观察）：intel_brief 此前在 deepseek/flash 上“偶发翻空”；actuals_extract 此前在 gemini-flash 上“空工具调用”。
    # --- mid tier: analysis/synthesis where near-Opus quality costs 1/4-1/20 ---
    research_extract: {model: deepseek/deepseek-v4-flash-0731, structured_output_method: function_calling}   # supply-chain insight extraction
    # 产业链证据抽取（观察名单财报）：只抽事实+原文片段，不做判断 → 便宜档足够。
    # 6 个名字 × 每年约 4 次财报 ≈ 24 次/年，成本可忽略。见 docs/archive/CHAIN_EVIDENCE.md
    # provider: deepseek —— 走官方 API 而不是 OpenRouter。同一份文档、同一段 prompt，
    # 经 OpenRouter 三次抽取结果是 [0, 33, 36]；换 terra 档是 [3, 3, 2]（稳定但几乎读不出
    # 东西）。两个模型两种异常，共同变量是网关，所以先把网关这个变量去掉。
    # 纯文本进出、无需跨供应商路由的角色才这么切；需要 Anthropic/OpenAI 的仍走 OpenRouter。
    evidence_observer: {provider: deepseek, model: deepseek-v4-flash, temperature: 0.0, max_tokens: 8192, structured_output_method: function_calling}
    # 涌现命题归纳：低频（证据驱动，不设 cron），但要从一堆散落事实里归纳出可证伪命题，
    # 是判断活不是抽取活 → 走中档。产出只是给人看的待确认卡，不进因子也不进 Chief。
    claim_proposer: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, max_tokens: 4096, reasoning: "off"}
    # 证据簇判读：唯一决定"这组证据对命题意味着什么"的地方。取代了原来写在 yaml 里的
    # supports_when 标量——真实数据证明那个形状是错的（SK 海力士一边说客户还在要货、
    # 一边扩产，被判成 7 条反驳）。上下文很短（一条命题 + ~10 组、每组几句原文），
    # 但判的是机制不是方向词，判错方向直接改写结论 → 走中档。频次同 sector_review。
    evidence_adjudicator: {provider: deepseek, model: deepseek-v4-flash, temperature: 0.0, max_tokens: 8192, structured_output_method: function_calling}
    # gemini-2.5-pro (reasoning model) on the full ~57k live context intermittently
    # returns an empty tool call → None; run_structured retries a few times. 24000
    # keeps output headroom for reasoning + the large structured payload.
    sector_analyst: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, max_tokens: 24000, reasoning: 6000}   # weekly L1-L6 sector review — 试点(2026-08-03)验证通过：Terra AA智能指数55(max effort)>sonnet-5(53)，且 OpenRouter 限时5折后价格($1/$6)是 sonnet-5($2/$10)的一半；结构化输出稳定，不稳就退回 anthropic/claude-sonnet-5
    macro_strategist: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, max_tokens: 24000, reasoning: 6000} # weekly macro regime + sector tilts — 同上，换 terra（2026-08-03）
    pead_analyst: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, max_tokens: 16384}  # PEAD prep framework/narrative/expectations (token-heavy)（2026-08-03 换 terra）
    structure_analyst: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, max_tokens: 8192, reasoning: "off"}  # 截面 v2 KB 定性结构层：技术久期/护城河/定价权（2026-08-03 换 terra）
    # 层级子行业分析师（2026-08-20 新增）：每层一次，产出配置结论（超配/标配/低配/清仓）
    # 与层内选股。上下文只含本层素材，比原来的全行业合成小得多，所以同档模型跑八次的
    # 总量与原来跑一次同量级。它的产出**会改变本层预算使用率**，所以不放低档。
    layer_analyst: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, max_tokens: 12000, reasoning: 4000}
    # 跨层轮动（收窄后的 sector_analyst 第二段）：只消费八条层级结论，输入紧凑。
    layer_rotation: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, max_tokens: 8192, reasoning: "off"}
    invalidation_check: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, max_tokens: 2048, reasoning: "off"}  # 交易日志每周失效判定——事实分类不是叙事，输入已 blind() 去除盈亏，判读需稳定（2026-08-03 换 terra）
    # --- high-judgment tier: drives trades, low frequency. No per-role model override: runs on default_model ---
    chief: {max_tokens: 16384}            # 首席收口 — daily portfolio decision synthesis
    risk_officer: {max_tokens: 16384}     # 组合风控官 — narrative memo over the deterministic 6-layer read
    # Fundamental routine fact-change classification. One output size standard for every ticker:
    # a larger watch-list entry (e.g. TSM, 22 fact changes) overflowed the 4096 default and was
    # truncated. The ceiling is only spent when output needs it. Do NOT raise the global default
    # instead: the role config is part of the Information extraction identity (role: research_extract),
    # so changing the default would retire the whole extraction cache.
    fundamental_analyst: {max_tokens: 8192}
    # Routine fact-change classification: tiny input, tiny structured answer. On 2026-10-16 one call with a
    # 1K-token prompt ran to the 8192 ceiling (several minutes) and the batch fell back to rules. Its own
    # role keeps `fundamental_analyst` (part of the published execution identity) untouched.
    fundamental_classifier: {model: deepseek/deepseek-v4-pro, structured_output_method: function_calling, temperature: 0.0, max_tokens: 3072, reasoning: "off"}
    critic: {max_tokens: 12288}           # 交易日志季度 critic —— 低频、人工签字前最后一道叙事关卡，成本不是约束

# --- IBKR broker connection --------------------------------------------------
# Port: TWS live=7496, TWS paper=7497, IB Gateway live=4001, IB Gateway paper=4002
# client_id: use different IDs for paper vs live to avoid conflicts
broker:
  port: 7496        # live TWS
  client_id: 12     # live client id

# --- Account (sizing) --------------------------------------------------------
account:
  net_liquidation_usd: 100000   # paper book size until IBKR provides the live value

# --- Boss approval channel ---------------------------------------------------
channel:
  kind: feishu_bot              # cli | feishu (app) | feishu_bot (group-bot signed-link approval) | discord
                                # feishu_bot: scheduler pushes an approval card with signed Approve/Reject
                                # links to FEISHU_BOT_WEBHOOK; taps hit `ats serve` (FEISHU_APPROVE_BASE).

# --- Trade journal -----------------------------------------------------------
# 对账必须每个交易日跑：IBKR 的 reqExecutions 只返回**当日**执行，漏掉的那天成交
# 无法事后补回（除非人工导 Flex Query）。所以它是独立 cron，不挂在日级联后面 ——
# 级联里任何一个 LLM 步骤失败都不该连累它。
journal:
  enabled: true
  reconcile_at: "16:10"         # America/New_York，收盘后
  horizons: [1, 5, 20, 60]      # 预测打分窗口；四个全部保留，长短期分歧本身是信号
