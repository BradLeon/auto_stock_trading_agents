src_tools:
- path: src/ats/workflow/analysis_verification.py
  reason: offline analysis verification harness; imported by no module
- path: src/ats/workflow/boundary_drill.py
  reason: isolated boundary drill; reached only from the cli drill command
- path: src/ats/workflow/consumer_disposition.py
  reason: consumer disposition report; reached only from the cli
- path: src/ats/workflow/cutover_acceptance.py
  reason: cutover acceptance report; reached only from the cli
- path: src/ats/runtime/evidence_observe.py
  reason: chain-evidence extraction run by the data refresh controller; no consumer's qualification evidence reads it
- path: src/ats/workflow/intake.py
  reason: prerequisite intake and evidence registration; reached only from the cli
- path: src/ats/workflow/pytest_optional_deps_plugin.py
  reason: pytest plugin; test runs only
- path: src/ats/workflow/retirement_clearance.py
  reason: legacy retirement clearance report; reached from the cli and boundary_drill only
- path: src/ats/workflow/test_baseline.py
  reason: test baseline bookkeeping; imported by no module
- path: src/ats/trader/statement_import.py
  reason: one-off backfill of broker-statement fills; reached only from the cli, never from a scheduled clerk run
self_verifying:
- path: src/ats/workflow/boundary_evidence.py
  family: boundary_enforcement
  reason: entry-evidence verifier; data qualification does not run it, and every registered entry bundle binds its hash so
    the entry gate fails closed at runtime when it changes
  self_check: tests/test_phase_f_scoped_routes.py::test_incomplete_or_false_entry_proof_refuses[missing_verifier_hash]
