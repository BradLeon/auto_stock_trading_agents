  - {id: ledger_state, from: TRADE_LOG, to: INTERNAL_API, owner: ats.execution.state_api, verify: internal_asof_completeness}
  - {id: memory_state, from: MEMORY, to: INTERNAL_API, owner: ats.execution.state_api, verify: internal_asof_completeness}
  - {id: memory_clerk, from: MEMORY, to: CLERK, owner: ats.execution.clerk, verify: ledger_readback}
  - {id: state_feedback, from: INTERNAL_API, to: AGENT_CHIEF, owner: ats.execution.state_api, verify: internal_asof_completeness}
  - {id: opinion_boundary, from: MEMORY, to: ISOLATION, owner: ats.data.stores.ownership, verify: opinion_write_rejection}
  - {id: governance_structured, from: GOVERNANCE, to: OBS, owner: ats.data, verify: source_quality_cost_lineage}
  - {id: governance_unstructured, from: GOVERNANCE, to: DOCS, owner: ats.data, verify: source_quality_cost_lineage}
consumers:
  - id: layer
    domain: hierarchy
    contract_version: target-dataflow-v1
    evidence_ttl_days: 90
    required_evidence: [write, admission, read, lineage, completeness, reconciliation, rollback]
    products: [HIER_DATA, DOC_DATA]
    read_api: ats.data.consumer_api.read_input
    legacy_read_api: ats.data.products.sector_inputs + ats.data.products.routing.UnstructuredReadRouter + ats.data.runtime.market_data
    owner: ats.data.products
    vintage: document_publication_and_immutable_version; fact_observed_at_and_supersession; structured_known_at_and_report_period
    completeness: missing_notes_and_no_coverage_are_explicit; native_packet_filters_fact_and_document_vintage; legacy_metadata_history_is_not_fabricated
    source_flag: none
    consumer_flag: none
    fallback: no_provider_fallback_for_persisted_evidence; missing_or_unverifiable_lineage_is_explicit
    legacy: direct_knowledge_reads
    verify: layer_read_contract
    allowed_projection_inputs: []
  - id: information
    domain: documents
    contract_version: target-dataflow-v1
    evidence_ttl_days: 30
    required_evidence: [write, admission, read, lineage, completeness, reconciliation, rollback]
    products: [DOC_DATA]
    read_api: ats.data.consumer_api.read_input
    legacy_read_api: ats.data.products.unstructured.admitted_documents
    owner: ats.data.products
    vintage: document_published_at_and_version
    completeness: partial_preview_labeled
    source_flag: data_source_release
    consumer_flag: none_verified
    fallback: none_verified
    legacy: news_digest
    verify: information_read_contract
    allowed_projection_inputs: []
  - id: sector
    domain: hierarchy
    contract_version: target-dataflow-v1
    evidence_ttl_days: 90
    required_evidence: [write, admission, read, lineage, completeness, reconciliation, rollback]
    products: [HIER_DATA]
    read_api: ats.data.consumer_api.read_input
    legacy_read_api: ats.data.products.sector_inputs
    owner: ats.data.products
    vintage: mixed_structured_known_at_and_document_version
    completeness: per_input_missing_status
    source_flag: config/data/structured.yaml#feature_flags.sources
    consumer_flag: config/data/structured.yaml#feature_flags.consumers.sector_agent
    fallback: none_verified_for_unstructured_router
    legacy: sector_context
    verify: sector_read_contract
    allowed_projection_inputs: [layer]
  - id: fundamental
    domain: company
    contract_version: target-dataflow-v1
    evidence_ttl_days: 30
    required_evidence: [write, admission, read, lineage, completeness, reconciliation, rollback]
    products: [COMPANY_DATA, HIER_DATA]
    read_api: ats.data.consumer_api.read_input
    legacy_read_api: ats.data.products.base.DataProducts.company_research_package
    owner: ats.data.products
    vintage: company_report_period_known_at_and_document_version
    completeness: financial_package_and_document_scoreable
    source_flag: config/data/structured.yaml#feature_flags.sources
    consumer_flag: config/data/structured.yaml#feature_flags.consumers.pead_fundamentals
    fallback: requires_individual_release_ledger_check
    legacy: pead_direct_reads
    verify: fundamental_read_contract
    allowed_projection_inputs: [information]
  - id: macro
    domain: macro
    contract_version: target-dataflow-v1
    evidence_ttl_days: 30
    required_evidence: [write, admission, read, lineage, completeness, reconciliation, rollback]
    products: [MACRO_DATA]
    read_api: ats.data.consumer_api.read_input
    legacy_read_api: ats.data.products.macro_inputs.regional_monthly
    owner: ats.data.products
    vintage: regional_known_at_and_factset_release
    completeness: missing_regional_is_explicit
    source_flag: config/data/structured.yaml#feature_flags.sources
    consumer_flag: config/data/structured.yaml#feature_flags.consumers.macro_agent
    fallback: requires_individual_release_ledger_check
    legacy: macro_direct_reads
    verify: macro_read_contract
    allowed_projection_inputs: []
  - id: technical
