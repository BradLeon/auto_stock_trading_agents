      require_human_verification_for_release: true
    acceptance_samples: [OPENAI, ANTHROPIC]
    rollback_on: [evidence_incomplete, unit_unresolved, event_duplicate, sample_error]

# Provider-neutral metrics. An id is a durable contract once observations use it.
# Semantically different GAAP/non-GAAP, point-in-time/period, or raw/derived values
# require separate definitions rather than an ambiguous mapping.
metric_definitions:
  ai.work_adoption.usage_share:
    {value_type: number, unit_family: percent, cadence: monthly, period_basis: calendar_month,
     entity_scope: [soc_major_group, soc_occupation, onet_task],
     required_dimensions: [source_product, classification, hierarchy_level],
     description: Share of the corresponding Claude source product's usage, not worker adoption.}
  ai.work_adoption.automation_share: {value_type: number, unit_family: percent, cadence: monthly, period_basis: calendar_month}
  ai.work_adoption.augmentation_share: {value_type: number, unit_family: percent, cadence: monthly, period_basis: calendar_month}
  ai.work_adoption.collaboration.directive_share: {value_type: number, unit_family: percent, cadence: monthly, period_basis: calendar_month}
  ai.work_adoption.collaboration.feedback_loop_share: {value_type: number, unit_family: percent, cadence: monthly, period_basis: calendar_month}
  ai.work_adoption.collaboration.task_iteration_share: {value_type: number, unit_family: percent, cadence: monthly, period_basis: calendar_month}
  ai.work_adoption.collaboration.validation_share: {value_type: number, unit_family: percent, cadence: monthly, period_basis: calendar_month}
  ai.work_adoption.collaboration.learning_share: {value_type: number, unit_family: percent, cadence: monthly, period_basis: calendar_month}
  ai.work_adoption.collaboration.none_share: {value_type: number, unit_family: percent, cadence: monthly, period_basis: calendar_month}
