# Taiwan Semiconductor Manufacturing (TSM) — PEAD config
# L5 先进制程龙头：N3/N2 节点 + CoWoS 先进封装 + AI 芯片代工核心
# 2026-11-04 更新：毛利率目标从过期的 53-55% 改为现实区间。依据（网络检索 + 6-K）：Q3 2026 毛利率 66.4%（环比 -1.3pt，N2 爬坡稀释），
# Q4 指引 65–67%、营收 $52.3–54.3B；N2 占晶圆营收 8%，2027 年 N2 产能翻倍以上；海外厂稀释约 2pt；2026 资本开支 $60–64B。

symbol: TSM
company_name: "Taiwan Semiconductor"
# fiscal_label 由财报日历派生（data/period.resolve_fiscal_label），无需手填；读档案用 data/period.label_for_reads。
#   2026-10-17：手填的季度名每季都会过期（ASML/TSM 财报已出 Q3，这里仍是 Q2），改为不写。
sector_etf: SMH
benchmark: QQQ
run_up_warn_pct: 5.0
long_threshold: 1.2          # 龙头溢价，稍高于默认 1.0

scorecard_dims:
  - {key: revenue,        weight: 0.20, label: 营收超预期（美元/台币双口径）}
  - {key: gross_margin,   weight: 0.20, label: 毛利率（vs 指引区间；N2 爬坡与海外厂稀释）}
  - {key: forward_guide,  weight: 0.20, label: 次季营收指引（美元中枢）}
  - {key: cowos,          weight: 0.15, label: CoWoS 先进封装产能与价格}
  - {key: advanced_node,  weight: 0.10, label: N3/N2 产能爬坡节奏}
  - {key: ai_demand,      weight: 0.10, label: AI 加速芯片需求能见度}
  - {key: call_tone,      weight: 0.05, label: 电话会语气与资本支出指引}

signal_chain:
  - {symbol: NVDA,  role: downstream}   # 最大 CoWoS 客户
  - {symbol: AMD,   role: downstream}
  - {symbol: AAPL,  role: downstream}
  - {symbol: AVGO,  role: downstream}
  - {symbol: ASML,  role: upstream}     # EUV 设备供应
  - {symbol: AMAT,  role: upstream}
  - {symbol: SKHY,  role: peer}         # HBM 封装合作方
  - {symbol: MU,    role: peer}

narrative_seed: >
  全球最先进晶圆代工厂；毛利率已在 65% 以上的历史高位，N2 爬坡与海外厂是主要稀释项；
  CoWoS 先进封装产能决定 NVDA Rubin 与各家定制 ASIC 的供货能力，2027 年产能预计再翻倍；
  资本开支指引（2027 预计大幅上调）是全链供给扩张的领先信号；
  台币/美元汇率与电力成本是毛利率波动主因；地缘政治（台海风险溢价）压制 P/E 倍数，但 AI 需求能见度超强。
