  ai.enterprise_adoption.expected_use_standard_error: {value_type: number, unit_family: percent, cadence: biweekly, period_basis: survey_reference_window}
  ai.worker_adoption.work_use_share: {value_type: number, unit_family: percent, cadence: quarterly, period_basis: calendar_quarter, description: Self-reported work GenAI use among US employed adults aged 18-64.}
  ai.worker_adoption.last_week_work_use_share: {value_type: number, unit_family: percent, cadence: quarterly, period_basis: calendar_quarter}
  ai.worker_adoption.daily_work_use_share: {value_type: number, unit_family: percent, cadence: quarterly, period_basis: calendar_quarter}
  ai.worker_adoption.assisted_work_hours: {value_type: number, unit_family: percent, cadence: quarterly, period_basis: calendar_quarter, description: Estimated share of all work hours assisted by GenAI.}
  ai.worker_adoption.time_saved_hours: {value_type: number, unit_family: percent, cadence: quarterly, period_basis: calendar_quarter, description: Self-reported counterfactual time savings as a share of work hours.}
