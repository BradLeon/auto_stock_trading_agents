# 风控配置唯一入口。
# 行业结构/标的归属仍在 config/sectors/*.yaml；所有可调风险阈值都只在本文件维护。

# L1-L6 全局限额
limits:
  # L1 标的
  max_position_pct: 0.25
  max_sector_pct: 0.50
  stop_loss_pct: 0.25
  # L2 组合
  max_gross_leverage: 1.0
  max_single_order_usd: 25000
  cash_floor_pct: 0.10
  max_margin_util_pct: 0.50
  min_excess_liquidity_pct: 0.10
  # L3 市场/因子
  beta_cap: 2.0
  cluster_corr_threshold: 0.70
  cluster_weight_cap: 0.75
  # L4 亏损/回撤
  max_drawdown_pct: 0.15
  daily_loss_limit_pct: 0.05
  # L5 尾部/压测
  max_stress_loss_pct: 0.25
  stress_market_shocks: [-0.10, -0.20]
  stress_vol_shocks: [0.20, 0.50]
  ai_bubble_cluster_shock: -0.35
  ai_bubble_vol_shock: 0.80
  # L6 事件/流动性
  max_event_loss_pct: 0.03
  max_pct_adv: 0.10
  # 期权 Greeks/止损
  option_risk_free_rate: 0.045
  max_net_vega_pct: 0.05
  short_option_loss_mult: 2.0
  # symbol -> haircut；0=全额现金信用，1=完全作为风险资产
  cash_equivalents:
    SGOV: 0.0
    SHV: 0.0
    BRK-B: 0.0

# 各行业产业链层限额；key 必须匹配 config/sectors/<sector>.yaml 的 layer key
sector_layer_caps:
  ai_hardware:
    L1_app: {weight_cap: 0.15}
    L2_cloud: {weight_cap: 0.25}
    L3_dc_power: {weight_cap: 0.10}                          # 原 L3_dc_infra 拆出
    L4_interconnect: {weight_cap: 0.15, weight_cap_hard: 0.20}  # 继承原 L3 的敞口性质
    L5_chip_design: {weight_cap: 0.15}                       # 原 L4_chip_design，数值不变
    L6_memory: {weight_cap: 0.25}                            # 原 L5_fab 拆出
    L7_foundry_pkg: {weight_cap: 0.20}                       # 原 L5_fab 拆出
    L8_equipment: {weight_cap: 0.15}                         # 原 L6_equipment，数值不变

# 跨层上限 —— **拆层不得放大总敞口**。
# 拆层有一个机械性副作用：L5_fab ≤30% 变成两个各自独立的 cap，两层同时满仓就能到
# 25%+20%=45%。那等于在重构的掩护下悄悄放松了护栏。做法是**加一层新护栏而不是撤销旧的**：
# 子层保留各自的 cap，它们的**合计**仍被拆分前的原值卡住。
# 子层 cap 之和 > group cap 是**有意的**——允许配置在成员之间倾斜，但总量不动。
layer_groups:
  ai_hardware:
    dc_infra:
      label: 数据中心基建（电力冷却 + 互联与网络）
      layers: [L3_dc_power, L4_interconnect]
      weight_cap: 0.15          # 沿用拆分前的 L3_dc_infra
      weight_cap_hard: 0.20
    fab_memory:
      label: 制造与存储（存储 + 代工封装）
      layers: [L6_memory, L7_foundry_pkg]
      weight_cap: 0.30          # 沿用拆分前的 L5_fab

# 层级配置结论 → 本层预算使用率。**只下调，不放大**：
# basket 权重之和 = weight_cap × clamp(使用率, 0, 1)，weight_cap 仍是永不突破的天花板。
# 映射表在这里是因为它是**治理**（这个账户愿意让一条判断把预算摆动多大）；
# 判断本身是语义，由层级分析师给出并连同证据归因一起落库。
layer_utilization:
  超配: 1.0
  标配: 0.6
  低配: 0.3
  清仓: 0.0

# sell-put 资金生存性
option_survival:
  max_full_assignment_nav_pct: 1.00
  max_probability_weighted_nav_pct: 0.35
  max_p99_assignment_nav_pct: 0.75
  max_peak_expiry_nav_pct: 0.50
  expiry_horizons_days: [7, 30, 90, 365]
  p99_z_score: 2.326

# Chief 状态机
directive:
  limited_headroom_pct: 0.10

# 执行证券 -> 经济风险实体；未配置证券默认自身为实体、1x 敞口
instruments:
  "7709":
    economic_entity: SK_HYNIX
    label: SK Hynix
    risk_symbol: HY9H
    layer_symbol: HY9H
    exposure_multiplier: 2.0
    product_type: leveraged_etf
  HY9H:
    economic_entity: SK_HYNIX
    label: SK Hynix
    risk_symbol: HY9H
    layer_symbol: HY9H
    product_type: cross_listing
  SKHY:
    economic_entity: SK_HYNIX
    label: SK Hynix
    risk_symbol: HY9H
    layer_symbol: HY9H
    product_type: adr
  "000660.KS":
    economic_entity: SK_HYNIX
    label: SK Hynix
    risk_symbol: HY9H
    layer_symbol: HY9H
    product_type: primary_listing
