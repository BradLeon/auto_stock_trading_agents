# Provider sources. `adapter` must match a controlled runtime adapter key.
# `internal_request_budget` is our conservative limit, not a Provider SLA/QPS claim.
sources:
  anthropic_economic_index:
    catalog_status: current_partial
    persistence: persistent
    provider: Anthropic Economic Index
    upstream: Anthropic/EconomicIndex Hugging Face repository
    adapter: anthropic_economic_index
    datasets: [ai_work_adoption]
    cadence: release_event
    retention: query_slice
    discovery_group: ai_adoption
    internal_request_budget:
      concurrency: 1
      requests_per_run: 8
      timeout_seconds: 300
      max_file_bytes: 367001600
      retry_attempts: 3
  us_census_btos:
    catalog_status: current_partial
    persistence: persistent
    provider: US Census Bureau Business Trends and Outlook Survey
    upstream: Census BTOS Core API and historical downloads
    adapter: census_btos
    datasets: [ai_enterprise_adoption_us]
    cadence: biweekly
    retention: query_slice
    discovery_group: ai_adoption
    internal_request_budget: {concurrency: 1, requests_per_run: 12, timeout_seconds: 60, max_file_bytes: 52428800, retry_attempts: 3}
  rps_genai_adoption:
    catalog_status: current_partial
    persistence: persistent
    provider: Real-Time Population Survey via Federal Reserve Economic Data
    upstream: FRED RPS GenAI Adoption Tracker series
    adapter: rps_genai_adoption
    datasets: [ai_worker_adoption_us]
    cadence: quarterly
    retention: query_slice
    discovery_group: ai_adoption
    internal_request_budget: {concurrency: 1, requests_per_run: 10, timeout_seconds: 60, max_file_bytes: 10485760, retry_attempts: 3}
  ramp_ai_index:
    catalog_status: current_partial
    persistence: persistent
    provider: Ramp AI Index
    upstream: Ramp AI Index public chart exports (Get the data)
    adapter: ramp_ai_index
    datasets: [ramp_ai_adoption, ramp_ai_spend]
    cadence: monthly
    retention: query_slice
    discovery_group: ai_adoption
    internal_request_budget:
      concurrency: 1
      requests_per_run: 5
      timeout_seconds: 30
      max_file_bytes: 52428800
      retry_attempts: 0
  openrouter_rankings:
    catalog_status: current_partial
    persistence: persistent
    provider: OpenRouter Rankings Data API
    upstream: OpenRouter public routed token rankings
    adapter: openrouter_rankings
    datasets: [openrouter_rankings_daily]
    cadence: daily_utc
    retention: query_slice
    discovery_group: ai_commercialization
    constraints:
      endpoint: https://openrouter.ai/api/v1/datasets/rankings-daily
      authentication: bearer_api_key
      api_key_env: OPENROUTER_API_KEY
      period: day
      timezone: UTC
      overlap_days: 14
      historical_start_date: 2025-01-01
      max_days_per_request: 30
      provider_limit_per_minute: 30
      provider_limit_per_day: 500
      public_private_scope: public_routed_only
      license: CC BY 4.0
      request_share: unavailable
      revenue_conversion: forbidden
    internal_request_budget:
      concurrency: 1
      requests_per_run: 14
      timeout_seconds: 30
      max_file_bytes: 52428800
      retry_attempts: 2
  frontier_ai_capability:
    catalog_status: current_partial
    persistence: persistent
    provider: Official benchmark-maintainer public results + independent pages + Lab releases
    upstream: LiveBench, Terminal-Bench, Terminal-Bench-Science, OSWorld, AutomationBench, SciCode, CritPt, MMMU-Pro, Toolathlon Verified, SpreadsheetBench 2 and Humanity's Last Exam public artifacts
    adapter: frontier_ai_capability
    datasets: [frontier_ai_capability_benchmarks]
    cadence: daily_utc
    retention: query_slice
    discovery_group: frontier_ai_capability
    constraints:
      public_routes: [git_csv, git_json, public_json, public_html_structured, official_html, official_html_event, readme_table]
      authentication: none_for_registered_public_routes
      optional_api_env: ARTIFICIAL_ANALYSIS_API_KEY
      bulk_requests_per_run: 11
      conditional_requests: [etag, last_modified, git_sha, payload_sha256]
      policy_gate_env: ATS_FRONTIER_AI_ALLOW_PUBLIC_STRUCTURED_PAGES
      terms_approval_env: ATS_FRONTIER_AI_PUBLIC_TERMS_APPROVED
      fail_closed_on_policy_or_parser_drift: true
      event_ledger_benchmarks: [automationbench_aa, osworld_2, toolathlon_verified, spreadsheetbench_2]
      browser_visual_scraping: forbidden
      direct_platform_after_acceptance: true
      license: provider_terms_or_public_page_citation
    internal_request_budget: {concurrency: 1, requests_per_run: 64, timeout_seconds: 30, max_file_bytes: 104857600, retry_attempts: 2}
  frontier_ai_capability_official_lab:
    catalog_status: current_partial
    persistence: persistent
    provider: Frontier Lab official releases and model cards
    upstream: OpenAI, Anthropic, Google, xAI, DeepSeek, Moonshot, Tencent, Z.ai and Alibaba public releases
    adapter: frontier_ai_capability_official_lab
    datasets: [frontier_ai_capability_benchmarks]
    cadence: daily_utc
    retention: query_slice
    discovery_group: frontier_ai_capability
    constraints:
      public_only: true
      source_type: lab_self_reported
      direct_platform_after_acceptance: true
      license: public_page_citation
    internal_request_budget: {concurrency: 1, requests_per_run: 1, timeout_seconds: 30, max_file_bytes: 104857600, retry_attempts: 2}
  ons_bics_ai:
    catalog_status: current_partial
    persistence: persistent
    provider: UK Office for National Statistics Business Insights and Conditions Survey
    upstream: ONS BICS workbooks and questionnaires
    adapter: ons_bics_ai
    datasets: [ai_enterprise_adoption_uk]
    cadence: conditional_wave
    retention: query_slice
    internal_request_budget: {concurrency: 1, requests_per_run: 8, timeout_seconds: 90, max_file_bytes: 104857600, retry_attempts: 3}
  tw_mof_exports:
    catalog_status: current_partial
    persistence: persistent
    provider: Taiwan Ministry of Finance
    adapter: tw_mof
    datasets: [regional_tw_exports]
    cadence: monthly
    retention: full_response
    internal_request_budget: {concurrency: 1, requests_per_run: 2, timeout_seconds: 60}
  kr_ecos_exports:
    catalog_status: current_partial
    persistence: persistent
    provider: Bank of Korea ECOS
    adapter: kr_ecos
    datasets: [regional_kr_exports]
    cadence: monthly
    retention: query_slice
    internal_request_budget: {concurrency: 1, page_size: 10, timeout_seconds: 30}
  trendforce_dram:
    catalog_status: current_partial
    persistence: persistent
    provider: TrendForce public price table
    adapter: trendforce
    datasets: [industry_dram_contract_price]
    cadence: monthly
    retention: constrained_snapshot
    internal_request_budget: {concurrency: 1, requests_per_run: 1, timeout_seconds: 30}
  sec_companyfacts:
    catalog_status: current_partial
    persistence: persistent
    provider: SEC EDGAR
    adapter: sec_companyfacts
    datasets: [company_financials]
    cadence: event
    retention: full_response
    internal_request_budget: {concurrency: 1, requests_per_second: 5, timeout_seconds: 30}
  company_disclosures:
    # Current partial: official TSM quarterly release (SEC 6-K/EX-99.1) only.
    # No annual 20-F obligation is implied by this source's acceptance scope.
    catalog_status: current_partial
    persistence: persistent
    provider: issuer or equivalent official disclosure
    adapter: company_disclosures
    datasets: [company_financials]
    cadence: event
    retention: source_policy
    internal_request_budget: {concurrency: 1, requests_per_second: 1, timeout_seconds: 30}
  defeatbeta_stock_statement:
    catalog_status: current_partial
    persistence: persistent
    provider: defeatbeta mirror hosted by HuggingFace
    upstream: Yahoo Finance structured statement data
    adapter: defeatbeta_stock_statement
    datasets: [company_financials]
    cadence: snapshot
    retention: query_slice
    internal_request_budget: {concurrency: 1, slices_per_entity_run: 1, timeout_seconds: 60}
  yfinance_financials:
    # Promoted from the legacy fundamentals reader strictly for low-frequency
    # financial statement gaps.  Prices, OHLCV, options and quote metadata remain
    # runtime-only under yfinance_market / yfinance_options below.
    catalog_status: current_partial
    persistence: persistent
    provider: Yahoo Finance via yfinance
    adapter: yfinance_financials
    datasets: [company_financials]
    cadence: event
    retention: query_slice
    internal_request_budget: {concurrency: 1, min_interval_seconds: 1, timeout_seconds: 30}
  yfinance_consensus:
    catalog_status: current_partial
    persistence: persistent
    provider: Yahoo Finance via yfinance
    adapter: consensus
    datasets: [market_consensus]
    cadence: event_snapshot
    retention: normalized_snapshot
    internal_request_budget: {concurrency: 1, min_interval_seconds: 1, timeout_seconds: 30}
  accepted_document_evidence:
    # The evidence workbench remains available for a future approved source, but
