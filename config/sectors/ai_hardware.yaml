    # 全部 kind: common、feeds_factor 留空。留空是有意的：L1 只有一只票，截面 z 分单样本
    # 恒为 0，挂 factor 没有意义。**这五条产出的是判断，不是分数**——它们不该改某一只票
    # 的权重，它们该改你对 L2–L6 全部仓位的信心。
    # statement 一律写成**多头假设**，让证据去证伪（沿用 capex_funding_quality 与
    # xpu_revenue_funded_by_customers 的先例：方向反过来之后两边才都有人主动说）。
