    legacy: news_triage
    verify: document_admission_and_rejection
  - id: QUARANTINE
    domain: persistent
    owner: ats.data.stores
    implementation: src/ats/data/stores
    config: config/data/catalog.yaml
    legacy: candidate_failures
    verify: rejection_raw_and_reason_readback
  - id: OBS
    domain: structured
    owner: ats.data.stores.structured
    implementation: src/ats/data/stores/structured/repository.py
    config: config/data/structured.yaml
    legacy: measurement_series_and_points
    verify: observation_vintage_asof
  - id: DOCS
    domain: unstructured
    owner: ats.data.stores.unstructured
    implementation: src/ats/data/stores/unstructured/platform.py
    config: config/data/unstructured.yaml
    legacy: memory_document_reads
    verify: immutable_document_versions
  - id: FACTS
    domain: unstructured
    owner: ats.data.stores.unstructured
    implementation: src/ats/data/stores/unstructured/evidence.py
    config: config/data/unstructured.yaml
    legacy: memory_evidence_reads
