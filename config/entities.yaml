# 证人身份注册表 —— 证人是**公司**，不是代码。
#
# 为什么必须有这张表：SK 海力士在本仓库里有三个代码（SKHY 美股 ADR、HY9H 法兰克福、
# 000660.KS 韩股），三个都指向同一场电话会。若按代码入账，一份纪要会被算成三个"独立
# 证人"，把立场多样性闸（≥2 类证人才能下结论）从内部骗过去 —— 那道闸正是用来防止
# 单一信源自我印证的，被自己的代码别名攻破是最难察觉的一种失效。
#
# canonical  入库时写进 entity / source_entity 的唯一身份
# aliases    折叠到该身份的其它代码（含跨市场挂牌与 ADR）
# name       身份闸用它核对"取回的文档确实提到这家公司"
# market     文档在哪个市场披露 —— 决定 downloader 走哪条取数路径
# filings    该公司**原始文件**的披露地：sec 表示能在 EDGAR 找到，ir 表示只能取投资者
#            关系页/纪要。取不到不是错误，会如实记成缺口。

# ⚠️ 2026-08-13：别名表原本只登记**代码**，因为此前每份文档都是公司自己的财报——
# 公司在自己的电话会里几乎不会用英文全名自称，所以「通俗名」这一类别名从没被用到。
# 接入第三方文章后这个假设失效了：TrendForce 写的是 "SK hynix"、"Micron"、"Samsung"，
# 抽取模型照抄原文，于是 SAMSUNG(12 条) 与 005930.KS(8 条) 被拆成两个实体键——
# 正是本文件开头警告的那种「从内部骗过立场闸」的失效，只是这次走的是通俗名而不是代码。
# 别名是**精确整串匹配**（config.py::_alias_index），所以 "SAMSUNG ELECTRO-MECHANICS"
# 不会被 "SAMSUNG" 误折——那是另一家上市公司。
entities:
  SKHY:
    name: SK hynix
    aliases: [HY9H, "000660.KS", SKHYY, "000660", "SK HYNIX", "SK HYNIX INC"]
    market: KRX
    filings: ir

  "005930.KS":
    name: Samsung Electronics
    # "SAMSUNG ELECTRONICS" 补于 2026-08-13：喂三方新闻（TrendForce/峰会简报）时，
    # LLM 抽取按文中原文写公司全名，不是股票代码——canonical_entity() 现在也在逐条
    # 观测的 entity 字段上生效（见 observer.py extract()），折不到就会开一个新
    # entity 键，任何命题的证人/概念查询都够不着它。
    aliases: [SSNLF, "005930", SMSN, "SAMSUNG ELECTRONICS", SAMSUNG]
    market: KRX
    filings: ir

  # 2026-08-11 补。与 SK 海力士同一类问题：A/C 两类股是同一家公司、同一场电话会、
  # 同一份 10-Q，按代码入账会被算成两个独立证人，并在截面里各拿一份权重——L2 的
  # basket 里 GOOG 排第 4、GOOGL 排第 5，各配 3.6%，等于给 Alphabet 配了 7.2%。
  # canonical 取 GOOG：账户实际持有的是 C 类。
  GOOG:
    name: Alphabet
    aliases: [GOOGL, GOOG.L, ALPHABET, GOOGLE]
    market: US
    filings: sec

  # 2026-08-12 补。xAI 于 2026-02 并入 SpaceX，后者 2026-05-20 递 S-1、以 SPCX 上市。
  # 登记的两个作用：① 让 xAI/SpaceX 这些名字折叠到同一身份；② 让知识库复核的
  # 「⑤ 陌生实体」不再每周举报它。
  # ⚠️ 它只有 AI/算力分部与 L2 命题相关——星链、星舰、发射业务不属于任何已声明维度，
  # 应当落在未映射池里。核验时要专门看这一条。
  SPCX:
    name: SpaceX
    aliases: [SPACEX, XAI, "SPACE X", STARLINK]
    market: US
    filings: sec

  MU:
    name: Micron Technology
    aliases: [MICRON, "MICRON TECHNOLOGY"]
    market: US
    filings: sec

  NVDA:
    name: NVIDIA
    aliases: [NVIDIA, "NVIDIA CORPORATION"]
    market: US
    filings: sec

  AMD:
    name: Advanced Micro Devices
    aliases: ["ADVANCED MICRO DEVICES"]
    market: US
    filings: sec

  AVGO:
    name: Broadcom
    aliases: [BROADCOM, "BROADCOM INC"]
    market: US
    filings: sec

  TSM:
    name: Taiwan Semiconductor Manufacturing
    aliases: ["2330.TW", TSMC]
    market: TWSE
    filings: sec          # 20-F + 英文法说会纪要

  # 2026-08-13 补。它是先进制程与先进封装两条命题里唯一未注册的 cohort 成员——
  # 台账里关于 Intel 的读数只有 4 条，且全部出自 ASML 之口（High-NA 谁先上量）。
  # 转述能证明"别人怎么看它"，证明不了它自己报的 18A 良率与外部客户进展；
  # 不注册 + 不进 observe，foundry_competitive_position 那两条命题的 Intel 一栏
  # 就会永远空着，而空着会被读成"没进展"，不是"没抓过"。
  INTC:
    name: Intel
    aliases: [INTEL, "INTEL FOUNDRY"]
    market: US
    filings: sec

  ASML:
    name: ASML Holding
    aliases: [ASML.AS, ASMLF]
    market: US
    filings: sec          # 20-F

  KLAC:
    name: KLA
    aliases: [KLA]
    market: US
    filings: sec

  LRCX:
    name: Lam Research
    aliases: []
    market: US
    filings: sec

  AMAT:
    name: Applied Materials
    aliases: []
    market: US
    filings: sec

  # --- 跨市场：可达性待 downloader 覆盖扫描验证 -------------------------------
  "6857.T":
    name: Advantest
    aliases: [ATEYY, "6857"]
    market: TSE
    filings: ir

  "6146.T":
    name: Disco Corporation
    aliases: [DSCSY, "6146"]
    market: TSE
    filings: ir

  BESI.AS:
    name: BE Semiconductor Industries
    aliases: [BESIY, BESI]
    market: AMS
    filings: ir

  "2408.TW":
    name: Nanya Technology
    aliases: ["2408"]
    market: TWSE
    filings: ir
