    # ⚠️ 三类里目前只有 (ii) 有现成路径。(i)(iii) 要先建取数——这正是上一轮对 L4 做过的
    #    事：**财报答不了的问题，不是放弃提问，是去建取数路径。**
    #
    # ── 实测的取数事实（2026-08-19 逐个 curl 验过，不是推测）─────────────────────
    #   OpenRouter /api/v1/models      200 无鉴权 · 415 模型 / 60 厂商 · 逐档定价
    #                                  (prompt/completion/cache) + created 时间戳
    #   OpenRouter /models/{id}/endpoints  200 · 逐 provider 定价（Azure/原厂分列）
    #   Epoch AI notable_ai_models.csv 200 免费 · 1050 行 · 含 Training compute (FLOP)
    #   OpenAI /news/rss.xml           200 标准 RSS
    #   Anthropic /news                200 但**无 RSS**（/rss.xml 与 /news/rss.xml 均 404），
    #                                  索引页 href 可提取 → 适配器工作量约为 OpenAI 的两倍
    #   HuggingFace /api/models        200 无鉴权
    #   Artificial Analysis API        **401 要付费 key** → 放弃，用 Epoch 替代
    #   DeepSeek API                   401 → 走 HuggingFace + 第三方
    #
    # 两个已知的坑，供给端细化时先解决：
    #   ⚠️ **定价类 API 只给当前状态，没有历史。** 现有两个序列源都是从提供方拿历史的
    #      （kr_ecos 一次抓 lookback+13 个月，自己算 yoy/mom），而 OpenRouter/HF 问它
    #      今天只答今天。要做成序列**必须自己定期存快照**，而 memory/store.py 现在
    #      20 张表里没有一张适合放外部时序。工作量因此不是「一个 90 行适配器」。
    #   ⚠️ **Epoch 是回填型数据集。** Training compute 是事后反推的，近期覆盖率逐年下滑
    #      （2024H2 41% → 2025H2 33% → 2026H1 25%）。**能回答曲线的形状，回答不了
    #      当季有没有变化**——当季度读数用会一直是空的。
    #   ⚠️ 定价序列**不能做成篮子均价**：新模型上架/旧模型下架都会让均价跳变，而那不是
    #      价格变化。两种正确构造二选一——按模型血统追踪（贴近「单位能力价格」，需人工
    #      维护映射），或按能力档位分组（用 context_length / 是否 reasoning 等 API 里
    #      直接可读的字段分档，全自动，且同档位内闭源与开源的价差正好回答开源侵蚀）。
    #      **口径未定，先别写适配器。**
    #
