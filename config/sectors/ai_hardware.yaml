  - key: L2_cloud
    label: L2 云服务层（算力租用）
    question: 算力租金/利用率如何？Capex 指引是否继续上修？
    tickers:
      - {symbol: MSFT}
      - {symbol: AMZN}
      - {symbol: META, note: 自用为主，近期传出售闲置算力}
      - {symbol: GOOG, note: Alphabet（A/C 类归一到 C 类，账户实际持有；见 entities.yaml）}
      - {symbol: CRWV, note: neocloud，TODO 用户确认}
    structure_notes:
      云服务: config/knowledge/云服务.md
      资本开支链: config/knowledge/资本开支链.md   # 跨层共同因子，六层都挂（见 docs/KNOWLEDGE.md）
    # 2026-08-11 人工新增，同日按复核收窄证人范围。
    #
    # 命题问的是「这笔 capex 由谁的钱支撑」——**只有钱的主人能作证**。首版把 NVDA/AVGO/
    # MRVL/TSM/LRCX/ASML/LITE/COHR 也列为证人（想借它们对客户 capex 节奏的自述预期来抓
    # 传导），结果正好犯了本文件 L5 命题注释里写着的那条错：
    #   「名单宁短勿长：声明一个取不到或说不出区分度的证人，只会把覆盖率的分母做大，
    #     看起来更差而并没有更差。」
    # 后果有三：12 个应发声证人 → 覆盖 3/12 虚低；立场仍只有 1 类（供给侧根本没说话）；
    # 以及把「资金结构会不会断」与「需求节奏会不会掉」两个问题混在一条命题里。
    # 传导是**分析上的联系**，写在 config/knowledge/资本开支链.md 与交易日志里即可，
    # 不需要塞进同一条命题让引擎去建模。
    #
    # 证人只留买方，并补入 ORCL：它在 observe 名单里、是负债驱动 capex 最典型的一家。
    # CRWV 不入列——它既非 target 也非 observe，声明了也取不到数，只会再造一个沉默证人。
    #
    # statement 刻意写成**多头假设**，让证据去证伪它。首次判读即为 mixed（反驳 3 簇），
    # 那正是它的价值，不是要回避的结果。
    # ⚠️ 还有一条**为本层设计、但尚未生效**的命题：`ai_surplus_retained_in_chain`
    # （AI 创造的剩余有没有沉淀在这条链上，还是流向了链外的使用方）。它出自 2026-08-19
    # 那次 L1 的设计讨论，所以**全文写在 L1_app 的注释块里**，激活时移到这里。
    # 它是那一组里唯一取数缺口接近于零的一条——证人全是已在取数的报表方。
    claims:
      - id: capex_funding_quality
        kind: common
        statement: 超大规模厂商的 AI capex 由内生现金流支撑，未依赖递增的外部融资与表外承诺
        horizon: {from: 2026-08-01, to: 2027-12-31}
        # 「这笔 capex 是谁的钱」**只有钱的主人能回答**——供应商与客户拿不到它的资产
        # 负债表，所以这条命题永远只有一类立场。
        # 曾经需要在这里声明 min_stance_classes: 1 来买一个豁免；2026-08-15 立场闸从
        # "闸"改成"档"之后不再需要——6 个独立说话人自动够格，结论照出，
        # 只是带上 basis=self_reported 的标注。那个旋钮已从 schema 删除。
        concepts:
          - key: external_funding_need
            desc: 为资本开支进行的债务发行、优先股/可转债/ATM 额度，以及净债务与杠杆率
                  方向。核心读数是自由现金流能否覆盖当期 capex——覆盖不了，capex 的节奏
                  就不再由需求单独决定，而受制于融资窗口
            expect_from: [GOOG, MSFT, AMZN, META, ORCL]
          - key: off_balance_sheet_shift
            desc: 经营租赁重分类、资产使用年限变更、SPV/JV 与第三方合作结构等把支出
                  移出资本开支口径的做法。判据：口径调整不等于支出减少
            expect_from: [GOOG, MSFT, AMZN, META, ORCL]
          - key: purchase_commitments
            desc: 无条件采购承诺、长期供货合同与剩余履约义务的规模和年限——已经签字的
                  未来支出下限。对客户是收入承诺，对自己是必须建出来的产能承诺
            expect_from: [GOOG, MSFT, AMZN, META, ORCL]
        falsifiers:
          - 任一超大规模厂商为 capex 发行债务/优先股，且当期自由现金流无法覆盖 capex
          - 出现 capex 口径调整（租赁重分类/折旧年限延长/SPV 托管）而实质现金承诺未降
        witnesses:
          - {entity: GOOG, stance: customer}
          - {entity: MSFT, stance: customer}
          - {entity: AMZN, stance: customer}
          - {entity: META, stance: customer}
          - {entity: ORCL, stance: customer}
          # SPCX 只记 AI/算力分部：它 Q2 capex $184 亿中 $158 亿投在 AI 算力基建，
          # 且是全库唯一披露回本期的实体（"less than one-year payback"）。
          - {entity: SPCX, stance: customer}

      # ── 2026-08-11 新增三条云服务命题 ────────────────────────────────────────
      # 起草时先写了「已锁定的电力与场地」「自研芯片的部署占比」，审计台账后发现
      # **五家全部 0 条**——没有一家披露 PPA、并网、土地收购或部署分母。那是问了公司
      # 不会说的话，和「名单宁短勿长」是同一类错误，只是发生在维度层而不是证人层。
      # 下面的维度全部改成**公司真会说的话**。
      - id: cloud_demand_still_accelerating
        kind: common
        statement: 云 AI 需求仍在加速——订单承诺的增长快于已确认收入，且供给仍是约束
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: rpo_backlog_growth
            desc: RPO / backlog 的增速与**同一家公司自身收入增速**的对比。
                  只做公司内部对比，不跨公司比绝对值——MSFT 的 commercial RPO 含
                  Office/Dynamics，GOOG 的是纯云 backlog，口径本就不可比。
                  同时记录转化节奏（多少会在未来 N 个月确认为收入）
            expect_from: [MSFT, GOOG, AMZN, SPCX]
          - key: cloud_capacity_constraint
            desc: 需求是否仍超过可用产能——"supply constrained""demand exceeds capacity"、
                  用第三方产能过桥、交付排期。注意这是**云侧**的产能约束，
                  与 L5 的 HBM 供给紧张是两件事
            expect_from: [MSFT, GOOG, AMZN, META]
          - key: demand_conversion
            desc: 供给侧对终端需求的确认——**只记与云/数据中心终端需求直接相关的
                  订单与出货表述**，不记该公司自身产品线的供需（那属于 L5 的命题）。
                  瓶颈现在在存储与先进封装，不在加速器设计，所以三者都要问
            expect_from: [SKHY, MU, TSM, NVDA]
        falsifiers:
          - 任一云厂的 RPO/backlog 增速掉到自身收入增速以下
          - 云厂不再提产能约束，或转为"需求受限"表述
          - 存储/封装的订单与出货增速掉头，与云厂的 backlog 叙事背离
        # ORCL 不入列：RPO $6,380 亿高度集中在少数几笔（"four customers contracting for
        #   more than $8 billion this quarter"、$750 亿预付与客户自供硬件）。它是
        #   **资金结构的好证人、需求广度的坏证人**——留在 capex_funding_quality。
        # META 不入列：不卖云，backlog 那条腿永久沉默（唯一命中是客户案例）。
        #   但它在 cloud_capacity_constraint 上有话说，所以只在该维度的 expect_from 里。
        # 电力侧没有好的上市证人（VRT 只讲行业总量、无区分度），改由第三方源补，
        #   见 datacenter_buildout_constraint。
        witnesses:
          - {entity: MSFT, stance: incumbent}
          - {entity: GOOG, stance: incumbent}
          - {entity: AMZN, stance: incumbent}
          - {entity: SPCX, stance: incumbent}
          - {entity: SKHY, stance: supplier}
          - {entity: MU,   stance: supplier}
          - {entity: TSM,  stance: supplier}
          - {entity: NVDA, stance: supplier}

      - id: cloud_moat_hard_assets
        kind: relative
        entities: [MSFT, GOOG, AMZN, META, SPCX]
        feeds_factor: moat_pricing
        statement: 云服务的硬资产护城河（数据中心容量、自研芯片）在超大规模厂商之间如何分布
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          # 两条都必须 direct: true，否则隔离闸（gate 3）会把它们全部挡掉——
          # relative 命题只在 direct 维度上移动，而默认是 false。
          #
          # 为什么 capacity 在这里是 direct，在 hbm_supply_tight 里却不是：
          # 那边 capacity_addition 是**行业供给**读数，竞争者扩产推不出"我方失份额"，
          # 所以必须挡住。这里的容量**就是被比较的资产本身**，且每家的读数各自落进
          # 自己那一行（按 entity 分组），不存在跨公司推断。同一个词，两种语义。
          - key: datacenter_capacity_delivered
            desc: 已交付/在建的电力与数据中心容量——**物理量**：GW/MW、新增站点数、
                  合建结构、机房上线。**不要记资产负债表的固定资产净额/PP&E**——
                  那是会计口径不是容量，且不同折旧政策下不可比（首轮判读里它被当成
                  容量用了，还把两栏读反）。
                  **这是"已交付"不是"已锁定"**：知识库判据里最硬的一条是已锁定的电力与
                  场地，但无人披露 PPA/并网/土地，所以这里退到能拿到的最接近读数
            expect_from: [MSFT, GOOG, AMZN, META, SPCX]
            direct: true
          - key: custom_silicon_program
            desc: 自研芯片的部署形态与经济性——已上线机架/数据中心数、性能功耗比、
                  对外收入、代际延续与设计伙伴。**不要求份额分母**（无人披露）。
                  设计伙伴（AVGO/MRVL）谈到某家客户的项目时，entity 记的是**那家客户**，
                  这是本条唯一的非自述读数来源
            expect_from: [MSFT, GOOG, AMZN, META, AVGO, MRVL]
            direct: true
        falsifiers:
          - 某家的自研芯片代际中断或更换设计伙伴
          - 某家披露数据中心/电力交付时点推迟
        # AVGO/MRVL 作 supplier：它们是 TPU/MTIA/Maia 的联合设计方，会披露项目进度与
        # 客户——这是对"自研芯片到底部署了没有"的**非自述**读数，把 basis 从「仅自述」
        # 升到「有交叉印证」。
        # 预期 GOOG 在 datacenter_capacity_delivered 上沉默（台账里它这一项 0 条）。
        # 沉默被显式记成缺口而非中性，这正是该看见的事实。
        witnesses:
          - {entity: MSFT, stance: incumbent}
          - {entity: GOOG, stance: competitor}
          - {entity: AMZN, stance: competitor}
          - {entity: META, stance: competitor}
          - {entity: SPCX, stance: competitor}
          - {entity: AVGO, stance: supplier}
          - {entity: MRVL, stance: supplier}

      # 单独立一条，不并进上面两条：它问的是完全不同的事，而且**同一条读数对两件事
      # 符号相反**——审批冻结让短缺更持久（对"需求超供给"是支持），同时让下游收入被
      # 推迟（对交付是利空）。合在一起判读器只能二选一。
      #
      # 这是"钱和需求都到位了，东西建不建得出来"的问题：审批批不下来、电接不上，
      # capex 就落不了地，L3–L6 的收入预期直接被封顶。属于基本面约束，不是情绪。
      - id: datacenter_buildout_constraint
        kind: common
        statement: 数据中心的物理落地未被审批与并网卡住——已宣布的产能能按期交付
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: power_delivery_timeline
            desc: 公司自述的电力/机房上线时点——按期、提前、还是推迟。
                  只记**时点**的变化，不记容量规模（那属于 cloud_moat_hard_assets）
            expect_from: [MSFT, GOOG, AMZN, META, ORCL, SPCX]
          - key: permitting_action
            desc: 审批与政策对数据中心建设的限制——暂停/新规/成本分摊原则变化，
                  以及公司对选址转移的表述。**财报里罕见，主要靠第三方源**
            expect_from: [MSFT, GOOG, AMZN, META, ORCL]
          - key: interconnection_queue
            desc: 电网接入排队中的数据中心负荷规模及其变化。**只能来自第三方源**——
                  电网运营商是独立第三方，公司不会披露自己在排队里的位置
            expect_from: []
        falsifiers:
          - 任一云厂披露电力/机房上线时点推迟
          - 出现新的辖区级审批暂停或大负荷接入限制
        witnesses:
          - {entity: MSFT, stance: incumbent}
          - {entity: GOOG, stance: incumbent}
          - {entity: AMZN, stance: incumbent}
          - {entity: META, stance: incumbent}
          - {entity: ORCL, stance: incumbent}
          # 全库唯一给出逐季 GW 交付序列的实体：400MW → 1GW → 1.4GW → 年底 2GW+，
          # 电厂级 15GW。新进入者、无存量机房，约束读数不被既有产能稀释。
          # 但它在审批/并网上 0 条——那部分仍是缺口。
          - {entity: SPCX, stance: incumbent}

      # 2026-08-12 新增。与上面的 cloud_moat_hard_assets 问的是**不同的问题**：
      # 那条是 relative，问「谁的自研更深」（排序）；这条是 common，问「自研整体上
      # 兑现了没有」（真假）。两者**共用同一个 concept key**——一个 key 可被多条命题
      # 各自声明，corroborate._relevant_concept 是逐命题查自己的 concept 表，
      # 所以那 30 条证据两条命题都能完整取到，不会被拆散。
      #
      # 刻意**没有**新建的两个维度（避免以后重复踩）：
      #   asic_unit_economics —— 「比通用 GPU 省了多少」全库只有 5 条，META 零条，
      #     且比较对象根本不是通用 GPU（MSFT 比"我们机队上一代"、GOOG 比"peer
      #     offerings"、AMZN 的 Graviton/Axion 是 CPU 不是加速器）。问了公司不会说的话。
      #   asic_external_revenue —— custom_silicon_program 的 desc 已逐字包含"对外收入"，
      #     GOOG 的 TPU 系统销售、AMZN 的 Trainium 外售都已在其中；单拆只会抢同一批行。
      - id: asic_substitution_delivering
        kind: common
        statement: 自研 ASIC 正在兑现——部署在扩大、已产生外部收入，且开始降低对外购加速器的依赖
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          # 复用，不新建。定义在 cloud_moat_hard_assets 里，两条命题共享同一批观测。
          - key: custom_silicon_program
            desc: 自研芯片的部署形态与经济性——已上线机架/数据中心数、性能功耗比、
                  对外收入、代际延续与设计伙伴。**不要求份额分母**（无人披露）。
                  设计方（AVGO/MRVL）谈到某家客户的项目时，entity 记的是**那家客户**；
                  设计方谈自己的 design win 与自研业务收入构成时，entity 记它自己
            expect_from: [MSFT, GOOG, AMZN, META, AVGO, MRVL]
          # 唯一真正缺的角度。**已知当前 NVDA/AMD 零条**——声明它正是为了让下一轮抽取
          # 有地方安放，并让沉默被显式记成缺口而不是中性。
          - key: asic_merchant_dependency
            desc: 自研与外购加速器的**配比及其方向**（买方自述，如"训练用外购、推理用
                  自研"或独家采购承诺），以及通用 GPU 侧对被替代的回应——份额、定价、
                  竞争格局表述。不记单纯的产品发布，只记涉及**替代关系**的表述
            expect_from: [MSFT, GOOG, AMZN, META, SPCX, NVDA, AMD]
        falsifiers:
          - 自研芯片的部署或对外收入停滞、代际中断
          - 买方明确提高外购加速器的比重，或承诺独家采购通用 GPU
        # NVDA/AMD 作 competitor 是本命题最锋利的一环：它们最有动机否认 ASIC 省钱，
        # 所以哪怕只让步一点都是强证据；而它们的沉默本身也是读数。
        # SPCX 入列的理由与其他云厂相反——它公开表态"exclusively on Nvidia"，
        # 是这条命题现成的反向读数。
        witnesses:
          - {entity: MSFT, stance: incumbent}
          - {entity: GOOG, stance: incumbent}
          - {entity: AMZN, stance: incumbent}
          - {entity: META, stance: incumbent}
          - {entity: SPCX, stance: incumbent}
          - {entity: AVGO, stance: supplier}
          - {entity: MRVL, stance: supplier}
          - {entity: NVDA, stance: competitor}
          - {entity: AMD,  stance: competitor}

  - key: L3_dc_power
    label: L3 数据中心电力与冷却
    legacy_keys: [L3_dc_infra]
    question: 供电与散热哪个环节仍是交付瓶颈？电网接入与机电交期能见度多长？
    # 2026-08-20 从 L3_dc_infra 拆出。拆的判据是**定价机制**不是产业环节：
    # 本层是机电装机量驱动（项目招标/长单、毛利平稳、靠量），互联层是技术代际替代驱动
    # （新一代溢价窗口、毛利随代际起落）。两者的毛利率/PEG 放进同一批 z 分，比较的是
    # 两个不同的东西；而 cap 要限住的是「一起跌」，它们并不一起跌。
    # **本层不设 subgroup**（四只票分组是过度设计）——代价是 BE 与 ETN 会进同一张 z 分表
    # 直接比，对冲办法只有下面每只票 note 里写明的敞口性质与定价机制。
    tickers:
      # ⚠️ subgroup 字段在本层**不用**（四只票分组是过度设计）。VRT 这行保留的
      # `subgroup: 电力冷却` 是拆分前带过来的历史值，本层不据此做任何分组。
      - {symbol: VRT,  subgroup: 电力冷却, note: Vertiv 电力/热管理/液冷，大盘动量。机电装机量驱动}
      # 2026-08-20 新增三只。不扩的话本层只剩 VRT 一票，而 _zscores 在样本 <2 时全返 0
      # ——截面等于没跑。
      - {symbol: ETN, note: 伊顿。数据中心配电。⚠️ AI 数据中心敞口**不是 100%**，
          z 分里混着非 AI 业务；定价机制=机电装机量（项目招标/长单）}
      - {symbol: GEV, note: GE Vernova。燃气轮机/电网设备，供电瓶颈的直接受益方。
          ⚠️ AI 敞口同样不是 100%；定价机制=机电装机量}
      - {symbol: BE,  note: Bloom Energy。固体氧化物燃料电池，**现场发电（behind-the-meter）**，
          绕过电网接入排队——而接入排队正是本层「供电瓶颈」叙事里最硬的那条约束，
          所以它是本层 **AI 纯度最高**的一只。
          ⚠️ 但也是**最不同类**的一只：定价机制是**技术采纳曲线**，ETN/GEV 是机电装机量。
          本层不设 subgroup，所以它会与 ETN/GEV 进同一张 z 分表直接比 —— 层级分析师
          必须依据本条 note 说明它的可比性限制，不得仅凭它在层内的名次给结论。
          实测（2026-08-20 首跑）：三条担心的降级路径**一条都没中** —— fwd_pe 42.3 可得、
          revG +165.5% 为正、市值 $60.9B 远高于 LIQ_FLOOR_USD，data_ok=True 正常参与定权。
          它 comp 0.48 排第一（增速+PEG 拉动，尽管 mom60 -31.7%），而 beta 3.83 把权重
          压到 2.2% —— 低于排第二的 ETN 的 4.0%。**风险预算在起作用，这是对的。**}
    # 截面同业（风控主层在别处）
    cohort_extra: []
    structure_notes:
      电力冷却: config/knowledge/电力冷却.md
      资本开支链: config/knowledge/资本开支链.md   # 跨层共同因子（见 docs/KNOWLEDGE.md）
    # ⚠️ **本层零命题，这是拆分的直接后果，不是遗漏。**
    # 原 L3_dc_infra 的四条命题（optical_component_supply_gap / rate_transition_pricing_power
    # / copper_ip_crosses_to_optical / interconnect_moat_distribution）**全部是互联的**，
    # 整块去了 L4_interconnect。
    #
    # 后果是**静默**的：observer.concept_menu 按「这家公司是不是某条命题的声明证人」过滤，
    # 声明为空 → 菜单为空 → extract 把本层各票的观测 concept 全部置空 → 100% 未映射。
    # 本仓踩过一次：2026-08-14 之前 L3 一条命题都没有，COHR 216 条、LITE 52 条读数全部
    # 落在未映射池，当时的结论是「证据一直在库里，只是没有落点——这是配置缺口不是数据缺口」。
    #
    # **不在这里凭空起草命题**，走两步法（先观测再声明）：
    #   ① 先跑一轮 observe，看本层四只票实际说了什么、未映射池里堆了什么
    #   ② 拿真实读数起草命题——维度由读数决定，不是先设计维度再指望它答得上
    # 判据不是「声明还是不声明」，是**这个实体是否已经在产出读数**：声明一个取不到文档或
    # 说不出区分度的证人只会把覆盖率的分母做大；而不声明一个已在产出读数的实体，
    # 会让那批读数无处可落。先例见 TRENDFORCE（首轮实测 57 条落在未映射池，然后才声明）。
    #
    # ── 第一步已执行：2026-08-20 跑了一轮 observe，实测结果如下 ────────────────
    # 文档可达性：四只票**全部可达**，且都是 keyed 数据集直取最新一季
    #   VRT 44,846 字符 / ETN 32,556 / GEV 35,351 / BE 43,417（披露日 2026-07-22~07-31）
    # 读数产出：VRT 92 条 · ETN 116 条 · GEV 136 条 · BE 74 条 = **418 条，100% 未映射**
    #
    # ⚠️ **但「有读数」不等于「该立命题」。** 看这 418 条在说什么，前十四位是：
    #   free_cash_flow / revenue_guidance / revenue / net_sales / net_income /
    #   diluted_eps / adjusted_operating_{profit,margin} / adjusted_ebitda / ...
    # ——**几乎全是通用财务条目**，而那些数字截面因子已经拿到了，对「这一层该给多少钱」
    # 不含增量信息。真正像是命题维度的只有少数几个：organic_growth_guidance、
    # site_termination_costs（项目取消是本层最硬的负面读数之一）。
    #
    # 机制上这不奇怪，而且值得记下来：**空菜单不只是让读数无处可落，它还改变了抽取出来
    # 的东西**——observer 没有可瞄准的维度时，会退化成给利润表编目录。所以第二步不是
    # 「把这 418 条映射掉」，是先想清楚本层该问什么，再看这些文档能不能答。
    #
    # 下一轮起草命题的判据因此收紧为：**能否给出区分性读数**，不是「有没有读数」。
    # 本层候选方向（未定稿，仅记录观察）：并网接入排队与交期、机电长单能见度、
    # 项目取消/延期、液冷渗透、现场发电从应急转常规。
    claims: []
  - key: L4_interconnect
    label: L4 互联与网络（光/铜/衬底）
    legacy_keys: [L3_dc_infra]
    question: 光/铜/CPO 的替代边界移到哪了？器件缺口与代际切换的节奏如何？
    # 2026-08-20 从 L3_dc_infra 拆出，电力冷却分到 L3_dc_power。
    # **拆出的是「互联与网络」而不只是「光互联」**：光 / 铜 / CPO / 交换是同一个**互相替代**
    # 的战场，放同一层 relative 命题才有对手可比；拆成两层则每层都成单一子层，
    # 回到 L1 的单样本困境。
    # 子层：光互联(收发/光引擎) · 铜连接(AEC/DSP) · 上游衬底
    tickers:
      - {symbol: COHR, subgroup: 光互联, note: 1.6T/InP 衬底自供}
      - {symbol: LITE, subgroup: 光互联, note: 收发+激光器}
      - {symbol: AAOI, subgroup: 光互联, note: 收发，含CATV，小盘高波}
      - {symbol: CRDO, subgroup: 铜连接, note: Credo AEC有源电缆+DSP/retimer，超高增速/贵}
      - {symbol: AXT,  subgroup: 衬底,   note: 化合物半导体衬底 InP/GaAs，小盘/中国敞口}
    # 截面同业（风控主层在别处）：MRVL 风控=L5 芯片设计、AVGO 风控=L5，
    # 二者的光 DSP / 交换芯片收入与本层同业，仅参与排序不占本层预算。
    # 这两笔收入此前**无家可归**——被 L4 芯片设计的命题注释显式排除，又不属于原 L3 任何命题。
    cohort_extra: [MRVL, AVGO]
    # 子层 → 策展知识库笔记（structure_analyst v2 定性结构层，--structure 时启用）
    structure_notes:
      光互联: config/knowledge/光互联.md
      铜连接: config/knowledge/铜连接.md
      衬底: config/knowledge/光互联.md      # 衬底判据写在光互联笔记里（需求派生自它）
      资本开支链: config/knowledge/资本开支链.md   # 跨层共同因子（见 docs/KNOWLEDGE.md）

    # ── 2026-08-14 新增四条互联层命题 ──────────────────────────────────────────
    # 此前本层**一条命题都没有**，后果是 concept_menu() 对 LITE/COHR/CRDO 返回空菜单，
    # 它们的观测被 extract() 全部置空 concept：COHR 216 条、LITE 52 条 100% 未映射，
    # MRVL 190 条里 164 条未映射（那 26 条已映射的全是定制硅/代工维度，**没有一条是光的**）。
    # 证据一直在库里，只是没有落点——这是配置缺口不是数据缺口。
    #
    # 与知识库笔记的分工（config/knowledge/光互联.md 开头的范围契约写死了这条）：
    # 笔记只写年度级不变的**判据**，不写"谁排第几"；本期排序由这里的命题用财报原文给出。
    # 所以下面每条命题都对应笔记里的一条判据，而不是重复笔记的结论。
    #
    # 形状规则（沿用 L5 已确立的）：common 命题里所有供给侧同行一律 supplier，
    # 不分 incumbent/competitor（那两个立场只在 relative 里有意义）；relative 命题的
    # 每个 concept 必须 direct: true，否则闸 3 全挡（cloud_moat_hard_assets 曾因此 47 条出 0 簇）。
    #
    # **刻意不立的两条**（免得以后重复起草）：
    #   ~~独立的 CPO 商业化时点命题~~：CPO 的一阶效应是替代**铜**不是替代可插拔光
    #     （Cignal AI：最早的量产应用是替代铜），所以它属于下面第 ③ 条的机制，不单开；
    #     而且 L5 的 packaging_capacity_addition 已经在收 CPO **产能**读数（台积电 COUPE），
    #     再开一个 L3 的 CPO 产能维度会与它抢同一批行——与被删掉的
    #     packaging_allocation_pressure 同一个毛病。
    #   ~~衬底（AXT）专属命题~~：~~台账零证据~~，且 光互联.md 判据写明衬底需求是**派生**的、
    #     "方向相同但时点滞后、幅度放大"——单立会与第 ① 条永远同向变动，互相稀释。
    #     ⚠️ **「台账零证据」这条依据 2026-08-20 已作废**：那天首次为 AXT 跑 observe，
    #     产出 25 条读数（AAOI 78 条）。零证据的真实原因不是它不说话，是**从来没为它
    #     抓过文档**——而没抓文档的原因又是它不在任何命题的证人声明里，一个自我实现的闭环。
    #     结论不变（仍不单立衬底命题），但**理由只剩「派生需求会与第①条同向稀释」这一条**。
    #
    # ── AAOI / AXT 的命题缺口实测 · 2026-08-20 ─────────────────────────────────
    # 二者是本层票，却不在上面四条命题的任何一条的 expect_from / witnesses 里，
    # 所以 concept_menu 对它们返回空菜单，103 条读数（AAOI 78 / AXT 25）**100% 未映射**。
    # 内容里有真正对本层命题有用的维度：manufacturing_capacity{,_guidance}、
    # long_term_supply_agreement、customer_concentration、gross_margin_target
    # ——这几个正对着第 ① 条的产能扩张与第 ④ 条的客户集中度。
    # **本次不加**（见 L3_dc_power 注释里的两步法纪律：先看清楚再声明），
    # 但这是下一轮优先级最高的一项：不是要新建命题，只要把它们补进既有命题的 expect_from。
    # ⚠️ AXT 的文档来自 tavily（tier-0 搜索，最弱的一档），可信度低于其余各票的
    #    keyed 直取；补声明前先确认它能稳定拿到一手文档。
    claims:
      # ① 对应 光互联.md 判据一「瓶颈环节的所有权」：先确认瓶颈还在不在。
      - id: optical_component_supply_gap
        kind: common
        statement: 光器件（EML / CW 激光器 / InP 衬底）的供给缺口仍在扩大而非收敛
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: optical_component_tightness
            desc: 光器件供需缺口的**量化表述**、售罄状态、交期长短、是否成为出货瓶颈，
                  以及**定价弹性**（"还有提价空间"本身就是缺口未消解的读数）。
                  只记器件层（激光器/衬底/PIC）的紧张，不记模块组装产能——
                  组装是薄利可替代环节，它紧不紧说明不了瓶颈在哪
            expect_from: [LITE, COHR, MRVL, NVDA, TRENDFORCE]
          - key: optical_capacity_buildout
            desc: 激光器与衬底产能扩张的**规模与时点**——新增产线、晶圆尺寸代际推进、
                  投产时间表、长约与预付。扩产是对需求强度的回应而非对紧张的否定；
                  真正的反证是**投放速度快于订单能见度的延长**
            expect_from: [LITE, COHR, TRENDFORCE]
        falsifiers:
          - 任一器件供应商披露供需缺口的量化数字收窄（如 LITE 的 EML 缺口从 >30% 下修）
          - 出现"不再售罄""交期缩短""客户要求降价"这类表述
          - 新增器件产能的投放速度快于买方订单能见度的延长
        # AXT 不入列：衬底是本层最上游，但它零证据且需求是派生的（见上方注释）。
        # AAOI 不入列：既非 target 也非 observe，零观测，声明了只会制造沉默证人。
        witnesses:
          - {entity: LITE, stance: supplier}
          - {entity: COHR, stance: supplier}
          - {entity: MRVL, stance: supplier}
          - {entity: NVDA, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}

      # ② 对应 光互联.md 常见误判「定价权的直接读数是 ASP 的方向，不是毛利的水平」。
      # 这条命题就是把那句话变成可证伪的追踪。
      - id: rate_transition_pricing_power
        kind: common
        statement: 800G→1.6T 的代际切换仍在带来 ASP 与毛利上行，而非转入价格战
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: rate_transition_asp
            desc: 速率代际切换带来的 **ASP 方向**与毛利结构变化——新一代相对上一代是
                  溢价还是平价。**不记毛利率的绝对水平**（高毛利可能只是产品组合，
                  光互联.md 明确警告过这个误判）。产品**品类**之间的 ASP 差异
                  （分立器件 vs 整机模块）也记在这里，但要与代际切换分开判读
            expect_from: [LITE, COHR, MRVL, CRDO, NVDA]
          - key: rate_transition_ramp
            desc: 新一代的出货节奏与收入占比，以及**上一代是否同步走弱**。
                  两代同时增长是缺口未收敛的佐证；新一代放量而上一代掉头，
                  才是切换进入替代期、议价窗口收窄的信号
            expect_from: [LITE, COHR, MRVL, TRENDFORCE]
        falsifiers:
          - 新一代产品的 ASP 或毛利贡献不再高于上一代
          - 上一代速率的收入掉头向下，同时新一代未同步放量
          - 出现客户要求降价、或供应商主动放缓提价的表述
        witnesses:
          - {entity: LITE, stance: supplier}
          - {entity: COHR, stance: supplier}
          - {entity: MRVL, stance: supplier}
          - {entity: CRDO, stance: supplier}
          - {entity: NVDA, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}

      # ③ 对应 铜连接.md「retimer/DSP 的能力可以向光 DSP 延伸——这是判断一家铜连接
      # 公司久期的关键分叉点」。
      #
      # ⚠️ 起草时这条本来写的是「铜的可达距离尚未被 CPO/光方案侵蚀」，2026-08-14 首次
      # 抽取 CRDO 后**推翻重写**：CRDO 管理层自己就让步了那个方向——「eventually we
      # could get to 50/50 for sure... optical could actually exceed copper in the
      # upcoming years」，且 CPO/NPO 首笔收入预期 FY2028。追踪一个当事人已经承认的
      # 方向没有意义。真正未定、且决定持仓成败的是**转身能不能兑现、代价是什么**：
      # 它铜侧毛利 68%，而自述光 DSP/SiPho PIC 是"两位数 ASP"、只有 ZeroFlap 整机是
      # "三位数 ASP"——收入转过去了，毛利结构未必跟得过去。
      - id: copper_ip_crosses_to_optical
        kind: common
        statement: 铜连接侧的 DSP / SerDes IP 正在成功转化为光侧收入，且未以毛利结构为代价
        horizon: {from: 2026-08-01, to: 2028-06-30}
        concepts:
          - key: interconnect_ip_crossover
            desc: 铜侧 IP 向光侧延伸的**收入兑现与时点**——光 DSP / PIC / 光模块的
                  收入规模、增速、占比目标与爬坡时点，以及**它带来的毛利结构变化**。
                  这是本条命题的核心：收入转过去不等于经济性转过去
            expect_from: [CRDO, MRVL, LITE, COHR]
          - key: copper_optical_boundary
            desc: 铜光边界的移动——SerDes 代际对铜可达距离的影响、AEC 与光方案的分工
                  变化、CPO/NPO 的量产时点与它先替代谁。**时点推迟或提前本身就是读数**
            expect_from: [CRDO, MRVL, COHR, NVDA]
        falsifiers:
          - 光侧收入占比上升的同时毛利率下行（转身成功但经济性劣化）
          - 光侧的量产/爬坡时点推迟，或 design win 落后于同业
          - 铜侧收入掉头而光侧未同步接上（青黄不接）
        witnesses:
          - {entity: CRDO, stance: supplier}
          - {entity: MRVL, stance: supplier}
          - {entity: COHR, stance: supplier}
          - {entity: LITE, stance: supplier}
          - {entity: NVDA, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}

      # ④ 截面。维度取自两份知识库笔记**共有**的判据，这样铜光两侧才可比：
      # 光互联.md 的排序是「瓶颈所有权 > 垂直整合 > 客户分散度 > 封装规模」，
      # 铜连接.md 是「SerDes/DSP IP 深度 > 客户分散度(权重更高) > 下一代设计导入 > 产能」。
      # 交集正是下面三条。
      - id: interconnect_moat_distribution
        kind: relative
        entities: [LITE, COHR, MRVL, CRDO]
        feeds_factor: moat_pricing
        statement: 互联层的结构位置在 Lumentum / Coherent / Marvell / Credo 之间如何分布
        horizon: {from: 2026-08-01, to: 2027-12-31}
        concepts:
          - key: interconnect_bottleneck_asset
            desc: 自有的**瓶颈资产**——InP/EML 自供产能与垂直整合深度（光侧），
                  SerDes/DSP 的 IP 深度与工艺代际（铜侧）。两份笔记各自的"最硬"
                  一条在这里合并：拥有别人绕不开的东西
            direct: true
            expect_from: [LITE, COHR, MRVL, CRDO]
          - key: interconnect_customer_concentration
            desc: 客户集中度及其分散进展——前几大客户占比、10% 客户家数、
                  新客户导入。铜连接.md 明确写本子层这条的**扣分权重比别的子层更高**：
                  一个客户的架构选型变更就能改写全年
            direct: true
            expect_from: [LITE, COHR, MRVL, CRDO]
          - key: interconnect_next_gen_design_in
            desc: 下一代规格（1.6T/3.2T、CPO/NPO、下一代 AEC）的**设计导入与量产承诺**
                  ——即久期能见度。设计赢单不等于上量承诺，两者要分开记
            direct: true
            expect_from: [LITE, COHR, MRVL, CRDO, NVDA]
        falsifiers:
          - 某家的瓶颈资产被绕开（客户改用替代方案或第二供应商）
          - 某家的客户集中度进一步上升而同业在下降
          - 某家在下一代规格上缺席，而同业已拿到具名客户的量产承诺
        # NVDA 作 customer 是本条唯一的非自述读数来源：它 2026-03 同时投了 LITE 与 COHR
        # 各 20 亿美元锁产能，谁被它选中、选中做什么，比任一家自述的护城河都重。
        witnesses:
          - {entity: LITE, stance: incumbent}
          - {entity: COHR, stance: competitor}
          - {entity: MRVL, stance: competitor}
          - {entity: CRDO, stance: competitor}
          - {entity: NVDA, stance: customer}
          - {entity: TRENDFORCE, stance: regulator}

  - key: L5_chip_design
    label: L5 芯片设计
    legacy_keys: [L4_chip_design]
    # 2026-08-20 仅更名（原 L4_chip_design）：互联与电力各占一层后序号顺延。
    # 2026-08-17 收窄到 XPU/AI 加速器口径。本层只问「算力芯片本身」——网络与交换芯片、
    # 光 DSP、铜连接归 L3（interconnect_moat_distribution 已在跑，MRVL 就在那条的 cohort
    # 里）；HBM 与内存互联归 L5。**cohort 不因此变**，变的是每个维度 desc 里写死的边界：
    # AVGO 的网络收入、MRVL 的光 DSP 收入不进本层任何一条命题。
    question: XPU（GPU/ASIC）的订单节奏、单位算力价值捕获与四家之间的位置分布？
    tickers:
      - {symbol: NVDA, note: 外售通用加速平台的行业标准}
      - {symbol: AMD,  note: 唯一的第二家外售通用 GPU —— 通用平台路线在截面里的对照组。
                            observe 名单成员，只贡献证据、不进下单路径}
      - {symbol: AVGO, note: 定制 XPU。**网络/交换芯片收入不在本层命题内**（归 L3），
