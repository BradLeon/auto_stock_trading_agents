# Unresolved fields remain traceable but unavailable to default consumer queries.
unmapped_policy:
  action: retain_pending_mapping
  preserve_provider_field: true
  preserve_raw_artifact: true
  publish_to_default_query: false

# Documentation of consumer contracts and the persistent/runtime boundary. Runtime
# price/options inputs remain outside this structured persistent platform.
migration_consumers:
  macro_factset:
    current_contracts: [EarningsBackdrop]
    persistent_datasets: [sp500_earnings_insight]
    runtime_inputs: []
    initial_mode: shadow
  sector_factset:
    current_contracts: [EarningsInsightSnapshot]
    persistent_datasets: [sp500_earnings_insight]
    runtime_inputs: []
    initial_mode: shadow
  pead:
    current_contracts: [FundamentalData, consensus_dict]
    persistent_datasets: [company_financials, market_consensus]
    runtime_inputs: [ticker_price, ohlcv, option_chain, greeks, implied_volatility]
    initial_mode: legacy
  sector:
    current_contracts: [fundamentals_light_dict, consensus_dict]
    persistent_datasets: [company_financials, market_consensus]
    runtime_inputs: [ticker_price, ohlcv, momentum]
    initial_mode: legacy
  chain:
    current_contracts: [SeriesPoint, Observation]
    persistent_datasets: [regional_tw_exports, regional_kr_exports,
                          industry_dram_contract_price]
    runtime_inputs: []
    initial_mode: legacy
  risk:
    current_contracts: [fundamentals_light_dict]
    persistent_datasets: []
    runtime_inputs: [beta, ticker_price, option_chain, greeks]
    initial_mode: legacy
