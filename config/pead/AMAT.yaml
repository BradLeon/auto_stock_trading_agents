# 产业链关系：四大设备商里产品组合最宽的一家——沉积为主，同时覆盖刻蚀、量测与先进封装。
# 知识库判据说"产品组合广度是最软的护城河"，所以它在截面里的作用恰恰是**反例对照**：
# 广度能摊薄周期，但在可替代的工序上换不来定价权。
signal_chain:
  - {symbol: TSM,   role: downstream}   # 先进逻辑产能
  - {symbol: SKHY,  role: downstream}   # HBM/DRAM 扩产
  - {symbol: MU,    role: downstream}   # DRAM/NAND 产线
  - {symbol: INTC,  role: downstream}   # IDM 扩产与工具支出
  - {symbol: LRCX,  role: peer}         # 沉积/刻蚀直接竞争
  - {symbol: KLAC,  role: peer}         # 部分量测环节直接竞争
  - {symbol: ASML,  role: peer}         # 同吃 WFE 预算但工序不重叠
