# ANT 算力承诺与现金流基线（静态材料，截至 2026-09-30）
#
# 用途：首份财报起，拿新披露值对照本基线。
# 性质：静态参考资料。没有任何程序读取本文件；它不是已发布的披露序列，也不是监测配置。
#
# 分四类，使用时不要混：
#   disclosed   招股书直接披露，附原文
#   computed    只用 disclosed 做加减乘除得到，写明算式；inferred: true 的另含推断
#   estimates   持仓人的估算，招股书没有披露
#   user_rules  持仓人在原表里设的判读线，尚未纳入行动指南
#
# 金额单位：十亿美元（billion USD）。原文表格以百万美元列示的，除以 1000。

